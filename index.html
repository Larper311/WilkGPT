const STARTERS=['basic','twin','sniper','pounder','flank','shotgun','missile','trapper','director'];

const SHT=[['sq',4,18,20,6,'#ffe763',4],['tr',3,16,40,12,'#fc7677',5],['pe',5,26,140,75,'#768cfc',10]];

let MODE='ffa',state='menu',P=null,cur=null,shake=0,DBG=false,auto=false,autoSpin=false,streak=0,streakT=0,lbT=0;
let teamCols=null,teamWin=null;

let now=0;

const sz=t=>1+Math.min(1.35,Math.pow(Math.max(0,t.sc)/80000,.45));
const rad=t=>(T[t.k]?.r||26)*sz(t);
const M=t=>T[t.k]?.m||{};
const mx=t=>(95+t.st.hp*18)*(.9+sz(t)*.1);
const dmgOf=t=>(7+t.st.bdmg*4)*(M(t).dmg||1)*(.94+sz(t)*.06);
const relOf=t=>Math.max(95,500*Math.pow(.89,t.st.rel)*(M(t).rel||1)*(t.bf.rapid>0?.58:1));
const bspd=t=>(340+t.st.bspd*24)*(M(t).spd||1);
const movOf=t=>(145+t.st.mov*10)/Math.pow(sz(t),.13);
const bodyOf=t=>(8+t.st.body*3.8)*(.94+sz(t)*.08);
const need=l=>Math.round(13*Math.pow(l,1.62));
function mk(x,y,k,pl,team){
  const st={};S.forEach(s=>st[s[0]]=0);
  const col=team!=null&&teamCols?teamCols[team][0]:(pl?T[k].c:pick(['#f14e54','#e67e22','#9b59b6','#3498db','#1abc9c']));
  const isTrap=k==='trapper'||k==='megaTrap'||k==='hexaTrap';
  return{x,y,vx:0,vy:0,ang:rr(0,TAU),k,pl,team:team!=null?team:null,col,st,hp:100,hpv:100,lv:1,xp:0,sc:0,pts:0,cd:0,rc:0,fl:0,bi:0,bf:{rapid:0,shield:0},dash:0,name:pl?'You':pick(NAMES),ps:isTrap?'trapper':pick(Object.keys(PS)),dead:0,ai:0,aim:rr(0,TAU),sd:R()<.5?1:-1,heat:0,spawn:0,blockCd:0,blockSpot:null,droneCd:0};
}

function spark(x,y,n,cols,s0,s1,z0,z1,l0,l1){for(let i=0;i<n;i++){const a=rr(0,TAU),s=rr(s0,s1),l=rr(l0,l1);pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l,m:l,c:pick(cols),s:rr(z0,z1)})}if(pt.length>800)pt.splice(0,pt.length-800)}
const ring=(x,y,mr,c,l)=>rg.push({x,y,r:0,mr,l:l||.3,m:l||.3,c});

/* ========== TIGHT HALL MAZE — small spaces ========== */
function buildMaze(){
  walls=[];
  const T=55; // thick
  // LEFT gate wall — 2 small openings only
  walls.push({x:720, y:0,    w:T, h:480});
  walls.push({x:720, y:620,  w:T, h:520});
  walls.push({x:720, y:1280, w:T, h:520});
  walls.push({x:720, y:1940, w:T, h:WW-1940});

  // RIGHT gate wall
  walls.push({x:WW-720-T, y:0,    w:T, h:480});
  walls.push({x:WW-720-T, y:620,  w:T, h:520});
  walls.push({x:WW-720-T, y:1280, w:T, h:520});
  walls.push({x:WW-720-T, y:1940, w:T, h:WW-1940});

  // CENTER horizontal dividers — tight 3-lane hall
  walls.push({x:720+T, y:560,  w:WW-1440-T*2, h:T});
  walls.push({x:720+T, y:1220, w:WW-1440-T*2, h:T});
  walls.push({x:720+T, y:1880, w:WW-1440-T*2, h:T});

  // center pillars for cover (small)
  walls.push({x:WW/2-T/2, y:720,  w:T, h:160});
  walls.push({x:WW/2-T/2, y:1380, w:T, h:160});
  walls.push({x:WW/2-T/2, y:2040, w:T, h:160});

  // side cover in each lane
  walls.push({x:1000, y:300,  w:140, h:T});
  walls.push({x:WW-1140, y:300, w:140, h:T});
  walls.push({x:1000, y:900,  w:140, h:T});
  walls.push({x:WW-1140, y:900, w:140, h:T});
  walls.push({x:1000, y:1560, w:140, h:T});
  walls.push({x:WW-1140, y:1560, w:140, h:T});
  walls.push({x:1000, y:2220, w:140, h:T});
  walls.push({x:WW-1140, y:2220, w:140, h:T});
}
function wallHit(x,y,r){
  for(const w of walls){const nx=cl(x,w.x,w.x+w.w),ny=cl(y,w.y,w.y+w.h);if(hyp(x-nx,y-ny)<r)return{nx,ny}}
  return null;
}
function resolveWall(t){
  const hit=wallHit(t.x,t.y,rad(t));if(!hit)return;
  const dx=t.x-hit.nx,dy=t.y-hit.ny,d=hyp(dx,dy)||1;
  t.x=hit.nx+dx/d*(rad(t)+2);t.y=hit.ny+dy/d*(rad(t)+2);t.vx*=.15;t.vy*=.15;
}
/* LOS check through walls */
function hasLOS(x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,dist=hyp(dx,dy)||1,steps=Math.ceil(dist/28);
  for(let i=1;i<steps;i++){const t=i/steps;if(wallHit(x1+dx*t,y1+dy*t,6))return false}
  return true;
}
function steerAround(b,tx,ty){
  const ang=Math.atan2(ty-b.y,tx-b.x);
  const look=70;
  if(!wallHit(b.x+Math.cos(ang)*look,b.y+Math.sin(ang)*look,rad(b)+6))return ang;
  for(const off of [.6,-.6,1.2,-1.2,1.8,-1.8,2.4,-2.4]){
    const a2=ang+off;
    if(!wallHit(b.x+Math.cos(a2)*look,b.y+Math.sin(a2)*look,rad(b)+6))return a2;
  }
  return ang+1.5;
}
/* nearest opening toward enemy side */
function nearestOpening(b){
  const openings=b.team===0
    ?[[750,550],[750,950],[750,1550],[750,2100]]
    :[[WW-750,550],[WW-750,950],[WW-750,1550],[WW-750,2100]];
  let best=openings[0],bd=1e9;
  for(const o of openings){const d=hyp(o[0]-b.x,o[1]-b.y);if(d<bd){bd=d;best=o}}
  return best;
}

  bases=[

function fire(t){
  if(t.heat>=1){t.cd=260;return}
  const guns=T[t.k].b,m=M(t),s=sz(t),n=guns.length;
  const bs=m.alt?[guns[t.bi++%n]]:guns,r=rad(t);
  if(m.trap){
    for(const b of bs){
      const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.48*s),ty=t.y+Math.sin(a)*(r+b.l*.48*s);
      const life=5*(m.trapLife||1);
      traps.push({x:tx,y:ty,vx:Math.cos(a)*(180+t.st.bspd*11),vy:Math.sin(a)*(180+t.st.bspd*11),r:11*(m.trapSize||1)*s,rot:rr(0,TAU),spin:8+rr(0,3),life,maxLife:life,o:t,team:t.team,col:t.col,settled:0,hp:18*(m.trapSize||1)});
      spark(tx,ty,2,[t.col,'#fff'],25,80,.8,1.8,.05,.12);
    }
  } else if(m.drone){
    // spawn controlled drones
    const maxD=m.droneCount||4;
    const mine=drones.filter(d=>d.owner===t).length;
    if(mine<maxD){
      const a=t.ang,tx=t.x+Math.cos(a)*(r+20),ty=t.y+Math.sin(a)*(r+20);
      drones.push({x:tx,y:ty,vx:0,vy:0,ang:a,r:9*(m.droneStr||1),hp:30*(m.droneStr||1),mh:30*(m.droneStr||1),owner:t,col:t.col,slot:mine,phase:rr(0,TAU),hitCd:0,fl:0});
      spark(tx,ty,3,[t.col,'#fff'],30,90,.9,2,.06,.14);
    }
  } else if(m.missile){
    for(const b of bs){

function lbd(){const l=[];if(P&&!P.dead)l.push({n:'You',s:P.sc,c:T[P.k]?T[P.k].n:'?',y:1,col:P.col});for(const b of bt)l.push({n:b.name,s:b.sc,c:T[b.k]?T[b.k].n:'?',col:b.col});l.sort((a,b)=>b.s-a.s);
  $('lb').innerHTML='<div style="text-align:center;color:#ffd34d;font-weight:700;margin-bottom:2px;font-size:9px">LEADERBOARD</div>'+l.slice(0,10).map((r,i)=>'<div style="display:flex;gap:2px;padding:1px 0;'+(r.y?'font-weight:700':'')+'"><span style="width:11px;color:#aaa">'+(i+1)+'</span><span style="flex:1;color:'+(r.col||'#fff')+'">'+r.n+'</span><span style="color:#ffd34d;width:34px;text-align:right">'+fs(r.s)+'</span></div>').join('')}

addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==='tab'||k===' ')e.preventDefault();
  if(k==='`'){DBG=!DBG;$('dbg').textContent=DBG?'DEBUG Shift+L/U/H/K':''}
  if(k==='tab')$('lb').style.display=$('lb').style.display==='none'?'':'none';
  if(k==='e')auto=!auto;if(k==='q')autoSpin=!autoSpin;
  const n=parseInt(e.key);
  if(cur&&(state==='menu'||state==='pick')&&n>=1&&n<=cur.items.length){cur.cb(cur.items[n-1]);return}
  if(e.key==='Enter'&&state==='dead'&&cur){cur.cb(cur.items[0]);return}
  if(state!=='play'||!P)return;
  if(n>=1&&n<=7)spend(n-1);
  if(k===' '&&P.dash<=0){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(!dx&&!dy){dx=Math.cos(P.ang);dy=Math.sin(P.ang)}const l=hyp(dx,dy);P.vx+=dx/l*800;P.vy+=dy/l*800;P.dash=3.4;spark(P.x,P.y,7,['#fff',P.col],30,120,1,2.5,.08,.22);ring(P.x,P.y,32,'#fff',.14)}
  if(DBG&&e.shiftKey){if(k==='l')for(let i=0;i<5;i++)addXp(P,need(P.lv));if(k==='u')P.pts+=5;if(k==='h')P.hp=mx(P);
    if(k==='k')for(const b of bt)if(hyp(b.x-P.x,b.y-P.y)<400)hurt(b,99999,P)}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
C.addEventListener('mousemove',e=>{ms.x=e.clientX;ms.y=e.clientY});C.addEventListener('mousedown',()=>ms.d=1);addEventListener('mouseup',()=>ms.d=0);C.addEventListener('contextmenu',e=>e.preventDefault());

for(let i=0;i<40;i++)spawnShape();for(let i=0;i<8;i++)spawnBot();
let last=performance.now();
function loop(tnow){const dt=Math.min(.05,(tnow-last)/1000);last=tnow;
  if(state==='play')update(dt);fxUpdate(dt);draw(tnow);hud();lbT+=dt;if(lbT>.5){lbT=0;lbd()}requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
