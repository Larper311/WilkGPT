<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tank Prototype — Arras-style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #555; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud-top {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    width: 340px; text-align: center; color: #fff; user-select: none; z-index: 5;
  }
  #levelbar-wrap {
    height: 22px; background: rgba(0,0,0,.45); border: 2px solid #222;
    border-radius: 4px; overflow: hidden; position: relative;
  }
  #levelbar { height: 100%; width: 0%; background: linear-gradient(90deg,#6fa32e,#9be24b); transition: width .15s; }
  #leveltext {
    position: absolute; inset: 0; line-height: 20px; font-size: 13px; font-weight: bold;
    text-shadow: 1px 1px 0 #000;
  }
  #score { margin-top: 4px; font-size: 15px; font-weight: bold; text-shadow: 1px 1px 0 #000; }

  #controls-hint {
    position: fixed; bottom: 12px; left: 12px; color: rgba(255,255,255,.75);
    font-size: 12px; text-shadow: 1px 1px 0 #000; user-select: none; z-index: 5;
  }

  /* ---------- Upgrade panel ---------- */
  #upgrades {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; z-index: 5;
  }
  .upbtn {
    background: rgba(0,0,0,.5); border: 2px solid #222; color: #fff;
    padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
    text-align: center; min-width: 92px; user-select: none; transition: transform .1s, border-color .1s;
  }
  .upbtn:hover { background: rgba(255,255,255,.15); transform: translateY(-2px); border-color: #8abc3f; }
  .upbtn b { display: block; font-size: 11px; }
  .upbtn .pips { letter-spacing: 2px; color: #8abc3f; }
  .upbtn .key { color: #ffd34d; font-weight: bold; }

  #points {
    position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
    color: #ffd34d; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 0 #000;
    display: none; user-select: none; z-index: 5; animation: bob 1s infinite ease-in-out;
  }
  @keyframes bob { 0%,100%{ transform: translateX(-50%) translateY(0);} 50%{ transform: translateX(-50%) translateY(-4px);} }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(15,18,24,.72); color: #fff; text-align: center; z-index: 10;
  }
  .overlay h1 { font-size: 44px; letter-spacing: 2px; animation: glowpulse 2.2s infinite ease-in-out; }
  @keyframes glowpulse {
    0%,100% { text-shadow: 0 0 14px rgba(0,224,255,.8); }
    50%     { text-shadow: 0 0 34px rgba(0,224,255,1), 0 0 70px rgba(0,224,255,.55); }
  }
  .overlay p { font-size: 16px; color: #ccc; line-height: 1.6; }
  .hidden { display: none !important; }

  /* ---------- Class select ---------- */
  #class-cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
  .card {
    width: 178px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.16);
    border-radius: 12px; padding: 12px; cursor: pointer; color: #fff;
    transition: transform .13s, border-color .13s, background .13s, box-shadow .13s;
  }
  .card:hover {
    transform: scale(1.07) translateY(-5px);
    border-color: #00e0ff; background: rgba(0,178,225,.13);
    box-shadow: 0 8px 30px rgba(0,224,255,.35);
  }
  .card canvas { width: 100%; border-radius: 8px; background: #b9b9b9; }
  .card h3 { margin: 10px 0 5px; font-size: 17px; }
  .card .num { color: #ffd34d; font-size: 11px; letter-spacing: 1px; }
  .card p { font-size: 12px; color: #bbb; line-height: 1.45; min-height: 52px; }
</style>
<base target="_blank">
</head>
<body>

<div id="hud-top">
  <div id="levelbar-wrap"><div id="levelbar"></div><div id="leveltext">Level 1</div></div>
  <div id="score">Score: 0</div>
</div>

<div id="points">Upgrade points: 0</div>
<div id="upgrades"></div>
<div id="controls-hint">WASD move · Mouse aim · Hold click (or E = autofire) · 1–7 upgrades</div>

<div class="overlay" id="class-overlay">
  <h1>TANK PROTOTYPE</h1>
  <p>Choose your class &nbsp;—&nbsp; press <b>1–4</b> or click</p>
  <div id="class-cards"></div>
  <p style="font-size:13px;color:#888">Destroy shapes and enemy tanks to level up. Spend points on stats.</p>
</div>

<div class="overlay hidden" id="death-overlay">
  <h1 style="animation:none;text-shadow:0 0 20px rgba(241,78,84,.9)">You were destroyed</h1>
  <p id="death-stats"></p>
  <p>Press <b>Enter</b> to choose a new class</p>
</div>

<canvas id="game"></canvas>

<script>
'use strict';
/* =====================================================================
   ARRAS-STYLE TANK PROTOTYPE v2 — classes, missiles & juice
   ===================================================================== */

/* ---------------- Tank (class) definitions ----------------
   barrels: angle = direction relative to tank facing (radians)
            length / width = barrel size
            offset = perpendicular shift (for multi-barrel)
   modifiers:
     reloadMult     multiply reload time (higher = slower)
     bulletDmgMult  multiply bullet damage
     bulletSizeMult multiply bullet size
     missile        fires a missile instead of a bullet        */
const TANKS = {
  basic: {
    name: 'Basic Tank', radius: 26, color: '#00b2e1',
    desc: 'Balanced single-barrel tank. The classic all-rounder.',
    modifiers: {},
    barrels: [ { angle: 0, length: 40, width: 18, offset: 0 } ]
  },
  pounder: {
    name: 'Pounder', radius: 29, color: '#ff8c42',
    desc: 'Massive cannon. Much slower reload, but huge, devastating bullets.',
    modifiers: { reloadMult: 2.1, bulletDmgMult: 2.5, bulletSizeMult: 1.8 },
    barrels: [ { angle: 0, length: 50, width: 30, offset: 0 } ]
  },
  twin: {
    name: 'Twin', radius: 26, color: '#8abc3f',
    desc: 'Two barrels side by side. Twice the bullets, twice the fun.',
    modifiers: {},
    barrels: [
      { angle: 0, length: 40, width: 14, offset: -11 },
      { angle: 0, length: 40, width: 14, offset:  11 }
    ]
  },
  missile: {
    name: 'Missile', radius: 26, color: '#bf7ff5',
    desc: 'Launches piloted missiles. Their engine-gun sprays bullets behind them, then they explode into a ring of bullets.',
    modifiers: { missile: true },
    barrels: [ { angle: 0, length: 52, width: 24, offset: 0 } ]
  }
};
const CLASS_KEYS = Object.keys(TANKS);

/* ---------------- Shape (polygon) definitions ---------------- */
const SHAPE_TYPES = {
  square:   { sides: 4, radius: 26, hp: 30,  xp: 10,  score: 10,  color: '#ffe763', bodyDmg: 8  },
  triangle: { sides: 3, radius: 24, hp: 70,  xp: 25,  score: 25,  color: '#fc7677', bodyDmg: 12 },
  pentagon: { sides: 5, radius: 34, hp: 220, xp: 130, score: 130, color: '#768cfc', bodyDmg: 20 }
};
const SHAPE_COUNTS = { square: 60, triangle: 32, pentagon: 12 };

/* ---------------- Canvas / world ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

const WORLD = { w: 4200, h: 4200 };
const GRID = 48;

/* ---------------- Game state ---------------- */
let gameState = 'menu';           // 'menu' | 'playing' | 'dead'
let player = null;
let shake = 0;                    // screen shake magnitude

/* ---------------- Stat system ---------------- */
const STAT_DEFS = [
  { key: 'regen',      name: 'Health Regen' },
  { key: 'maxHp',      name: 'Max Health'   },
  { key: 'bodyDmg',    name: 'Body Damage'  },
  { key: 'bulletSpd',  name: 'Bullet Speed' },
  { key: 'bulletDmg',  name: 'Bullet Damage'},
  { key: 'reload',     name: 'Reload'       },
  { key: 'moveSpd',    name: 'Move Speed'   }
];
const MAX_STAT = 8;

/* ---------------- Entity + FX arrays ---------------- */
let bullets = [];     // {x,y,vx,vy,radius,dmg,owner,life,color}
let missiles = [];    // {x,y,angle,speed,life,owner,radius,emitCd,flameCd}
let shapes  = [];     // {x,y,type,def,hp,maxHp,rot,spin,hurtFlash,spawnT}
let enemies = [];
let particles = [];   // {x,y,vx,vy,life,maxLife,color,size}
let explosions = [];  // {x,y,maxR,life,maxLife}
let flashes = [];     // {x,y,angle,life,maxLife}
let floatTexts = [];  // {x,y,vy,life,maxLife,text,color,size}

/* ---------------- Tiny synthesized sound (no assets needed) ---------------- */
const AudioFX = {
  ctx: null, enabled: true,
  init() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { this.enabled = false; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type, vol, slideTo) {
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur);
  },
  noise(dur, vol) {
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(t);
  },
  shoot()   { this.tone(200 + Math.random() * 60, 0.08, 'square', 0.022, 90); },
  boom()    { this.noise(0.35, 0.11); this.tone(90, 0.3, 'sawtooth', 0.05, 30); },
  hit()     { this.tone(140, 0.05, 'triangle', 0.018, 70); },
  levelup() { this.tone(440, 0.1, 'sine', 0.045, 660);
              setTimeout(() => this.tone(660, 0.13, 'sine', 0.045, 880), 95); },
  die()     { this.noise(0.5, 0.14); this.tone(200, 0.5, 'sawtooth', 0.06, 40); }
};

/* ---------------- Helpers ---------------- */
function makeStats() { const s = {}; STAT_DEFS.forEach(d => s[d.key] = 0); return s; }
function mods(t) { return TANKS[t.typeKey].modifiers; }

function maxHpOf(t)     { return 100 + t.stats.maxHp * 22; }
function regenOf(t)     { return 0.4 + t.stats.regen * 0.55; }
function bodyDmgOf(t)   { return 10 + t.stats.bodyDmg * 5; }
function bulletDmgOf(t) { return (9 + t.stats.bulletDmg * 5.5) * (mods(t).bulletDmgMult || 1); }
function bulletSpdOf(t) { return (380 + t.stats.bulletSpd * 34) * (mods(t).bulletSpdMult || 1); }
function reloadOf(t)    { return Math.max(120, 550 * Math.pow(0.87, t.stats.reload) * (mods(t).reloadMult || 1)); }
function moveSpdOf(t)   { return 170 + t.stats.moveSpd * 14; }
function bulletRadiusOf(t) { return (8 + t.stats.bulletDmg * 0.5) * (mods(t).bulletSizeMult || 1); }
function xpToNext(level) { return Math.round(14 * Math.pow(level, 1.7)); }

function xpForLevel(t, lvl) {
  // total xp required to reach lvl (for enemy setup)
  let total = 0; for (let l = 1; l < lvl; l++) total += xpToNext(l); return total;
}

function addXp(t, amount) {
  t.xp += amount; t.score += amount;
  while (t.xp >= xpToNext(t.level)) {
    t.xp -= xpToNext(t.level);
    t.level++; t.upgradePoints++;
    t.hp = maxHpOf(t);
    if (t.isPlayer) {
      AudioFX.levelup();
      floatTexts.push({ x: t.x, y: t.y - t.radius - 24, vy: -45, life: 1.1, maxLife: 1.1,
                        text: 'LEVEL UP!', color: '#ffd34d', size: 20 });
      explosions.push({ x: t.x, y: t.y, maxR: 60, life: 0.35, maxLife: 0.35, color: '#ffd34d' });
    }
  }
}

/* ---------------- FX spawners ---------------- */
function addShake(amount) { shake = Math.min(22, shake + amount); }

function spawnParticles(x, y, count, colors, speedMin, speedMax, sizeMin, sizeMax, lifeMin, lifeMax) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = speedMin + Math.random() * (speedMax - speedMin);
    const life = lifeMin + Math.random() * (lifeMax - lifeMin);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life, maxLife: life,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: sizeMin + Math.random() * (sizeMax - sizeMin)
    });
  }
  if (particles.length > 600) particles.splice(0, particles.length - 600);
}

function floatText(x, y, text, color, size) {
  floatTexts.push({ x, y, vy: -50, life: 0.9, maxLife: 0.9, text, color, size: size || 14 });
}

/* ---------------- Entities ---------------- */
function createTank(x, y, typeKey, isPlayer) {
  const def = TANKS[typeKey];
  return {
    x, y, angle: Math.random() * Math.PI * 2, typeKey, isPlayer,
    radius: def.radius, color: def.color,
    stats: makeStats(),
    hp: 100, level: 1, xp: 0, score: 0, upgradePoints: 0,
    fireCd: 0, recoil: 0, dead: false,
    hitCd: 0, flash: 0,
    aiCd: 0, aiAngle: Math.random() * Math.PI * 2
  };
}

function spawnShape(forceType) {
  const keys = Object.keys(SHAPE_TYPES);
  const type = forceType || keys[Math.floor(Math.random() * keys.length)];
  const def = SHAPE_TYPES[type];
  shapes.push({
    x: 60 + Math.random() * (WORLD.w - 120),
    y: 60 + Math.random() * (WORLD.h - 120),
    type, def, hp: def.hp, maxHp: def.hp,
    rot: Math.random() * Math.PI * 2,
    spin: (type === 'pentagon' ? 0.25 : 0.08) * (Math.random() < 0.5 ? -1 : 1),
    hurtFlash: 0, spawnT: 0
  });
}

function spawnEnemy() {
  let x, y, tries = 0;
  do {
    x = Math.random() * WORLD.w; y = Math.random() * WORLD.h; tries++;
  } while (player && Math.hypot(x - player.x, y - player.y) < 700 && tries < 20);

  const typeKey = CLASS_KEYS[Math.floor(Math.random() * CLASS_KEYS.length)];
  const e = createTank(x, y, typeKey, false);
  e.color = ['#f14e54', '#e05c5c', '#d14e9c'][Math.floor(Math.random() * 3)];
  e.level = 8 + Math.floor(Math.random() * 20);
  e.xp = xpForLevel(e, e.level);
  let pts = e.level - 1;
  while (pts-- > 0) e.stats[STAT_DEFS[Math.floor(Math.random() * STAT_DEFS.length)].key]++;
  e.hp = maxHpOf(e);
  enemies.push(e);
}

function initWorld() {
  bullets = []; missiles = []; shapes = []; enemies = [];
  particles = []; explosions = []; flashes = []; floatTexts = [];
  for (const [t, n] of Object.entries(SHAPE_COUNTS)) for (let i = 0; i < n; i++) spawnShape(t);
  for (let i = 0; i < 8; i++) spawnEnemy();
}

/* ---------------- Class select ---------------- */
function drawTankIcon(cv, typeKey) {
  const c = cv.getContext('2d');
  const def = TANKS[typeKey];
  // background + grid lines
  c.fillStyle = '#b9b9b9'; c.fillRect(0, 0, cv.width, cv.height);
  c.strokeStyle = 'rgba(0,0,0,0.12)'; c.lineWidth = 1;
  for (let g = 0; g <= cv.width; g += 18) {
    c.beginPath(); c.moveTo(g, 0); c.lineTo(g, cv.height); c.stroke();
    c.beginPath(); c.moveTo(0, g); c.lineTo(cv.width, g); c.stroke();
  }
  const fake = {
    x: cv.width / 2 - 8, y: cv.height / 2, angle: 0,
    typeKey, radius: def.radius, color: def.color,
    recoil: 0, hp: 1, level: 1, isPlayer: true, stats: makeStats()
  };
  drawTank(fake, 0, 0, c, false);
}

function buildClassSelect() {
  const box = document.getElementById('class-cards');
  box.innerHTML = '';
  CLASS_KEYS.forEach((key, i) => {
    const def = TANKS[key];
    const card = document.createElement('div');
    card.className = 'card';
    const cv = document.createElement('canvas');
    cv.width = 160; cv.height = 160;
    drawTankIcon(cv, key);
    const num = document.createElement('div'); num.className = 'num'; num.textContent = 'PRESS ' + (i + 1);
    const title = document.createElement('h3'); title.textContent = def.name;
    const desc = document.createElement('p'); desc.textContent = def.desc;
    card.append(cv, num, title, desc);
    card.onclick = () => { AudioFX.init(); chooseClass(key); };
    box.appendChild(card);
  });
}

function chooseClass(key) {
  player = createTank(WORLD.w / 2, WORLD.h / 2, key, true);
  gameState = 'playing';
  shake = 0;
  document.getElementById('class-overlay').classList.add('hidden');
  document.getElementById('death-overlay').classList.add('hidden');
  buildUpgradeUI();
  explosions.push({ x: player.x, y: player.y, maxR: 70, life: 0.4, maxLife: 0.4, color: player.color });
  spawnParticles(player.x, player.y, 18, [player.color, '#ffffff'], 60, 200, 2, 5, 0.3, 0.7);
  AudioFX.levelup();
}

/* ---------------- Input ---------------- */
const keys = {};
const mouse = { x: 0, y: 0, down: false };
let autoFire = false;

addEventListener('keydown', e => {
  AudioFX.init();
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'e') autoFire = !autoFire;

  // class select shortcuts
  if (gameState === 'menu') {
    const n = parseInt(e.key);
    if (n >= 1 && n <= CLASS_KEYS.length) { chooseClass(CLASS_KEYS[n - 1]); return; }
  }
  // death screen
  if (e.key === 'Enter' && gameState === 'dead') {
    gameState = 'menu';
    document.getElementById('death-overlay').classList.add('hidden');
    document.getElementById('class-overlay').classList.remove('hidden');
    return;
  }
  const n = parseInt(e.key);
  if (n >= 1 && n <= STAT_DEFS.length) spendPoint(STAT_DEFS[n - 1].key);
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => { AudioFX.init(); mouse.down = true; });
addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- Upgrades UI ---------------- */
function buildUpgradeUI() {
  const box = document.getElementById('upgrades');
  box.innerHTML = '';
  STAT_DEFS.forEach((d, i) => {
    const b = document.createElement('div');
    b.className = 'upbtn';
    b.id = 'up-' + d.key;
    b.onclick = () => spendPoint(d.key);
    box.appendChild(b);
  });
  refreshUpgradeUI();
}
function refreshUpgradeUI() {
  if (!player) return;
  STAT_DEFS.forEach((d, i) => {
    const b = document.getElementById('up-' + d.key);
    if (!b) return;
    const v = player.stats[d.key];
    const pips = '●'.repeat(v) + '○'.repeat(MAX_STAT - v);
    b.innerHTML = `<span class="key">[${i + 1}]</span> <b>${d.name}</b><span class="pips">${pips}</span>`;
    b.style.opacity = (player.upgradePoints > 0 && v < MAX_STAT) ? 1 : 0.55;
  });
  const p = document.getElementById('points');
  p.style.display = player.upgradePoints > 0 ? 'block' : 'none';
  p.textContent = `Upgrade points: ${player.upgradePoints} (press 1–7 or click)`;
}
function spendPoint(key) {
  if (!player || gameState !== 'playing' || player.upgradePoints <= 0 || player.stats[key] >= MAX_STAT) return;
  player.upgradePoints--;
  player.stats[key]++;
  if (key === 'maxHp') player.hp += 22;
  refreshUpgradeUI();
}

/* ---------------- Combat ---------------- */
function barrelTip(t, b) {
  return {
    x: t.x + Math.cos(t.angle) * (t.radius + b.length * 0.55) - Math.sin(t.angle) * b.offset,
    y: t.y + Math.sin(t.angle) * (t.radius + b.length * 0.55) + Math.cos(t.angle) * b.offset
  };
}

function fire(t) {
  const def = TANKS[t.typeKey];
  const m = def.modifiers;
  for (const b of def.barrels) {
    const a = t.angle + b.angle;
    const tip = barrelTip(t, b);
    if (m.missile) {
      missiles.push({
        x: tip.x, y: tip.y, angle: a,
        speed: bulletSpdOf(t) * 0.8,
        life: 2.6, owner: t, radius: 13, emitCd: 0, flameCd: 0
      });
    } else {
      bullets.push({
        x: tip.x, y: tip.y,
        vx: Math.cos(a) * bulletSpdOf(t), vy: Math.sin(a) * bulletSpdOf(t),
        radius: bulletRadiusOf(t),
        dmg: bulletDmgOf(t), owner: t, life: 1.6,
        color: t.isPlayer ? '#00e0ff' : '#ffd34d'
      });
    }
    flashes.push({ x: tip.x, y: tip.y, angle: a, life: 0.07, maxLife: 0.07 });
    spawnParticles(tip.x, tip.y, 3, ['#fff2ae', '#ffd34d'], 60, 180, 1.5, 3, 0.1, 0.25);
  }
  t.fireCd = reloadOf(t);
  t.recoil = 8;
  if (t.isPlayer || (player && Math.hypot(t.x - player.x, t.y - player.y) < 900)) AudioFX.shoot();
}

function explodeMissile(ms) {
  const owner = ms.owner;
  const n = 14;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.12;
    bullets.push({
      x: ms.x, y: ms.y,
      vx: Math.cos(a) * 330, vy: Math.sin(a) * 330,
      radius: 6 + owner.stats.bulletDmg * 0.3,
      dmg: bulletDmgOf(owner) * 0.7, owner, life: 1.1,
      color: owner.isPlayer ? '#00e0ff' : '#ffd34d'
    });
  }
  explosions.push({ x: ms.x, y: ms.y, maxR: 95, life: 0.4, maxLife: 0.4, color: '#ff9a3d' });
  spawnParticles(ms.x, ms.y, 20, ['#ff9a3d', '#ffd34d', '#ff5c2e', '#ffffff'], 100, 280, 2, 6, 0.4, 0.9);
  if (player && !player.dead) {
    const d = Math.hypot(ms.x - player.x, ms.y - player.y);
    if (d < 520) addShake((1 - d / 520) * 12);
    if (d < 950) AudioFX.boom();
  }
}

function damageTank(t, dmg) {
  if (t.dead) return;
  t.hp -= dmg;
  t.flash = 0.15;
  if (t.hp <= 0) {
    t.dead = true;
    // death FX
    explosions.push({ x: t.x, y: t.y, maxR: t.radius * 3, life: 0.45, maxLife: 0.45, color: t.color });
    spawnParticles(t.x, t.y, 26, [t.color, '#ffffff', '#666666'], 80, 300, 2, 6, 0.4, 1);
    if (t.isPlayer) {
      gameState = 'dead';
      addShake(18);
      AudioFX.die();
      document.getElementById('death-stats').textContent = `Level ${t.level} · Score ${t.score}`;
      document.getElementById('death-overlay').classList.remove('hidden');
    } else {
      if (player && !player.dead) {
        addXp(player, 250);
        floatText(t.x, t.y, '+250', '#ffd34d', 18);
      }
      const idx = enemies.indexOf(t);
      if (idx >= 0) enemies.splice(idx, 1);
      setTimeout(() => { if (gameState !== 'menu') spawnEnemy(); }, 2000);
    }
  }
}

function damageShape(s, dmg, idx) {
  s.hp -= dmg; s.hurtFlash = 0.1;
  if (s.hp <= 0) {
    shapes.splice(idx, 1);
    spawnParticles(s.x, s.y, 12, [s.def.color, '#ffffff'], 60, 190, 2, 5, 0.3, 0.7);
    if (player && !player.dead) {
      addXp(player, s.def.xp);
      floatText(s.x, s.y, '+' + s.def.xp, '#ffe763', 13);
    }
    setTimeout(() => spawnShape(s.type), 3000);
  }
}

/* ---------------- Update ---------------- */
function update(dt) {
  if (gameState !== 'playing' || !player) return;

  /* --- player movement --- */
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const len = Math.hypot(dx, dy) || 1;
  const spd = moveSpdOf(player);
  player.x = Math.max(player.radius, Math.min(WORLD.w - player.radius, player.x + dx / len * spd * dt));
  player.y = Math.max(player.radius, Math.min(WORLD.h - player.radius, player.y + dy / len * spd * dt));

  player.angle = Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);
  player.fireCd -= dt * 1000;
  if ((mouse.down || autoFire) && player.fireCd <= 0) fire(player);
  player.recoil = Math.max(0, player.recoil - dt * 45);
  player.flash = Math.max(0, player.flash - dt);
  player.hp = Math.min(maxHpOf(player), player.hp + regenOf(player) * dt);
  player.hitCd -= dt;

  /* --- enemy AI --- */
  for (const e of enemies) {
    const distP = Math.hypot(player.x - e.x, player.y - e.y);
    if (distP < 560 && !player.dead) {
      e.angle = Math.atan2(player.y - e.y, player.x - e.x) + (Math.random() - 0.5) * 0.12;
      const want = 260;
      const dir = distP > want ? 1 : -0.6;
      const espd = moveSpdOf(e) * 0.82;
      e.x += Math.cos(e.angle) * espd * dir * dt;
      e.y += Math.sin(e.angle) * espd * dir * dt;
      e.fireCd -= dt * 1000;
      if (e.fireCd <= 0) fire(e);
    } else {
      e.aiCd -= dt;
      if (e.aiCd <= 0) { e.aiAngle = Math.random() * Math.PI * 2; e.aiCd = 2 + Math.random() * 3; }
      e.angle = e.aiAngle;
      e.x += Math.cos(e.aiAngle) * moveSpdOf(e) * 0.4 * dt;
      e.y += Math.sin(e.aiAngle) * moveSpdOf(e) * 0.4 * dt;
      e.fireCd = Math.max(e.fireCd, 300);
    }
    e.recoil = Math.max(0, e.recoil - dt * 45);
    e.flash = Math.max(0, e.flash - dt);
    e.hp = Math.min(maxHpOf(e), e.hp + regenOf(e) * dt);
    e.hitCd -= dt;
    e.x = Math.max(e.radius, Math.min(WORLD.w - e.radius, e.x));
    e.y = Math.max(e.radius, Math.min(WORLD.h - e.radius, e.y));
  }

  /* --- missiles --- */
  for (let i = missiles.length - 1; i >= 0; i--) {
    const ms = missiles[i];
    ms.life -= dt;
    ms.x += Math.cos(ms.angle) * ms.speed * dt;
    ms.y += Math.sin(ms.angle) * ms.speed * dt;

    // engine flame particles
    ms.flameCd -= dt;
    if (ms.flameCd <= 0) {
      ms.flameCd = 0.03;
      const bx = ms.x - Math.cos(ms.angle) * ms.radius;
      const by = ms.y - Math.sin(ms.angle) * ms.radius;
      particles.push({
        x: bx, y: by,
        vx: -Math.cos(ms.angle) * 90 + (Math.random() - 0.5) * 50,
        vy: -Math.sin(ms.angle) * 90 + (Math.random() - 0.5) * 50,
        life: 0.22, maxLife: 0.22,
        color: ['#ff9a3d', '#ffd34d', '#ff5c2e'][Math.floor(Math.random() * 3)],
        size: 1.5 + Math.random() * 2.5
      });
    }

    // engine gun: sprays bullets backward
    ms.emitCd -= dt * 1000;
    if (ms.emitCd <= 0) {
      ms.emitCd = 95;
      const spread = (Math.random() - 0.5) * 0.5;
      const a = ms.angle + Math.PI + spread;
      bullets.push({
        x: ms.x - Math.cos(ms.angle) * ms.radius, y: ms.y - Math.sin(ms.angle) * ms.radius,
        vx: Math.cos(a) * 240, vy: Math.sin(a) * 240,
        radius: 5, dmg: bulletDmgOf(ms.owner) * 0.35, owner: ms.owner, life: 1.1,
        color: '#ff9a3d'
      });
    }

    let boom = ms.life <= 0 ||
               ms.x < 10 || ms.x > WORLD.w - 10 || ms.y < 10 || ms.y > WORLD.h - 10;

    // contact with opposing tanks
    if (!boom) {
      const targets = ms.owner.isPlayer ? enemies : [player];
      for (const t of targets) {
        if (!t.dead && Math.hypot(ms.x - t.x, ms.y - t.y) < ms.radius + t.radius) {
          damageTank(t, bulletDmgOf(ms.owner) * 1.2); boom = true; break;
        }
      }
    }
    // contact with shapes
    if (!boom) {
      for (let j = shapes.length - 1; j >= 0; j--) {
        const s = shapes[j];
        if (Math.hypot(ms.x - s.x, ms.y - s.y) < ms.radius + s.def.radius) {
          damageShape(s, bulletDmgOf(ms.owner) * 1.2, j); boom = true; break;
        }
      }
    }

    if (boom) { explodeMissile(ms); missiles.splice(i, 1); }
  }

  /* --- bullets --- */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < 0 || b.x > WORLD.w || b.y < 0 || b.y > WORLD.h) { bullets.splice(i, 1); continue; }

    let hit = false;
    for (let j = shapes.length - 1; j >= 0; j--) {
      const s = shapes[j];
      if (Math.hypot(b.x - s.x, b.y - s.y) < b.radius + s.def.radius) {
        damageShape(s, b.dmg, j); hit = true; break;
      }
    }
    if (hit) { bullets.splice(i, 1); continue; }

    const targets = b.owner.isPlayer ? enemies : [player];
    for (const t of targets) {
      if (!t.dead && Math.hypot(b.x - t.x, b.y - t.y) < b.radius + t.radius) {
        damageTank(t, b.dmg);
        spawnParticles(b.x, b.y, 4, ['#ffffff', b.color], 40, 140, 1, 3, 0.1, 0.3);
        if (t.isPlayer) { addShake(2.5); AudioFX.hit(); }
        hit = true; break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }

  /* --- body contact damage --- */
  function contact(t, other, dt) {
    if (Math.hypot(t.x - other.x, t.y - other.y) < t.radius + other.radius) {
      if (t.hitCd <= 0) { damageTank(other, bodyDmgOf(t)); t.hitCd = 0.4; }
      const a = Math.atan2(t.y - other.y, t.x - other.x);
      t.x += Math.cos(a) * 40 * dt; t.y += Math.sin(a) * 40 * dt;
    }
  }
  for (const e of enemies) { contact(player, e, dt); contact(e, player, dt); }
  for (let j = shapes.length - 1; j >= 0; j--) {
    const s = shapes[j];
    if (Math.hypot(player.x - s.x, player.y - s.y) < player.radius + s.def.radius) {
      if (player.hitCd <= 0) { damageTank(player, s.def.bodyDmg); player.hitCd = 0.4; }
    }
    for (const e of enemies) {
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.radius + s.def.radius) {
        if (e.hitCd <= 0) { damageTank(e, s.def.bodyDmg); e.hitCd = 0.4; }
      }
    }
  }

  for (const s of shapes) {
    s.hurtFlash = Math.max(0, s.hurtFlash - dt);
    s.spawnT = Math.min(1, s.spawnT + dt * 2.5);
    s.rot += s.spin * dt;
  }

  refreshUpgradeUI();
}

/* ---------------- FX update (runs even when dead/menu) ---------------- */
function updateFx(dt) {
  shake = Math.max(0, shake - dt * 26);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(0.02, dt); p.vy *= Math.pow(0.02, dt);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].life -= dt;
    if (explosions[i].life <= 0) explosions.splice(i, 1);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].life -= dt;
    if (flashes[i].life <= 0) flashes.splice(i, 1);
  }
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.y += f.vy * dt; f.life -= dt;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }
  for (const s of shapes) {
    s.spawnT = Math.min(1, s.spawnT + dt * 2.5);
    s.rot += s.spin * dt;
    s.hurtFlash = Math.max(0, s.hurtFlash - dt);
  }
}

/* ---------------- Drawing ---------------- */
function drawGrid(camX, camY) {
  // subtle gradient background
  const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, Math.max(canvas.width, canvas.height)*0.75);
  grad.addColorStop(0, '#c4c4c4');
  grad.addColorStop(1, '#a8a8a8');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const startX = Math.floor(camX / GRID) * GRID;
  const startY = Math.floor(camY / GRID) * GRID;
  ctx.strokeStyle = 'rgba(0,0,0,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = startX; x < camX + canvas.width; x += GRID) { ctx.moveTo(x, camY); ctx.lineTo(x, camY + canvas.height); }
  for (let y = startY; y < camY + canvas.height; y += GRID) { ctx.moveTo(camX, y); ctx.lineTo(camX + canvas.width, y); }
  ctx.stroke();
  // major lines
  ctx.strokeStyle = 'rgba(0,0,0,0.14)';
  ctx.beginPath();
  for (let x = Math.floor(camX / (GRID*5)) * GRID*5; x < camX + canvas.width; x += GRID*5) { ctx.moveTo(x, camY); ctx.lineTo(x, camY + canvas.height); }
  for (let y = Math.floor(camY / (GRID*5)) * GRID*5; y < camY + canvas.height; y += GRID*5) { ctx.moveTo(camX, y); ctx.lineTo(camX + canvas.width, y); }
  ctx.stroke();

  ctx.strokeStyle = '#222'; ctx.lineWidth = 6;
  ctx.strokeRect(-camX, -camY, WORLD.w, WORLD.h);
}

function drawShape(s, camX, camY) {
  const x = s.x - camX, y = s.y - camY;
  if (x < -80 || y < -80 || x > canvas.width + 80 || y > canvas.height + 80) return;
  const scale = 0.2 + 0.8 * s.spawnT;   // spawn-in pop
  ctx.save();
  ctx.translate(x, y); ctx.rotate(s.rot); ctx.scale(scale, scale);
  ctx.beginPath();
  for (let i = 0; i < s.def.sides; i++) {
    const a = i / s.def.sides * Math.PI * 2;
    const px = Math.cos(a) * s.def.radius, py = Math.sin(a) * s.def.radius;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = s.hurtFlash > 0 ? '#ffffff' : s.def.color;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 4;
  ctx.fill(); ctx.stroke();
  ctx.restore();
  if (s.hp < s.maxHp && s.spawnT >= 1) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 20, y - s.def.radius - 12, 40, 5);
    ctx.fillStyle = '#8abc3f'; ctx.fillRect(x - 20, y - s.def.radius - 12, 40 * (s.hp / s.maxHp), 5);
  }
}

function drawTank(t, camX, camY, c, showInfo) {
  c = c || ctx;
  if (showInfo === undefined) showInfo = true;
  const x = t.x - camX, y = t.y - camY;
  if (x < -90 || y < -90 || x > canvas.width + 90 || y > canvas.height + 90) return;
  const def = TANKS[t.typeKey];

  for (const b of def.barrels) {
    c.save();
    c.translate(x, y); c.rotate(t.angle + b.angle);
    c.translate(-t.recoil, b.offset);
    c.fillStyle = '#999';
    c.strokeStyle = 'rgba(0,0,0,0.55)';
    c.lineWidth = 3;
    const bl = b.length, bw = b.width;
    c.beginPath();
    c.rect(t.radius * 0.55 - bl * 0.45, -bw / 2, bl, bw);
    c.fill(); c.stroke();
    c.restore();
  }

  c.beginPath();
  c.arc(x, y, t.radius, 0, Math.PI * 2);
  c.fillStyle = t.color;
  c.strokeStyle = 'rgba(0,0,0,0.55)';
  c.lineWidth = 4;
  c.fill(); c.stroke();

  if (t.flash > 0) {
    c.beginPath();
    c.arc(x, y, t.radius, 0, Math.PI * 2);
    c.fillStyle = `rgba(255,60,60,${(t.flash / 0.15) * 0.45})`;
    c.fill();
  }

  if (showInfo) {
    c.fillStyle = '#fff'; c.font = 'bold 13px Arial'; c.textAlign = 'center';
    c.fillText(t.isPlayer ? 'You' : TANKS[t.typeKey].name + ' (Lv ' + t.level + ')', x, y - t.radius - 16);
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(x - 26, y - t.radius - 12, 52, 6);
    c.fillStyle = '#8abc3f'; c.fillRect(x - 26, y - t.radius - 12, 52 * Math.max(0, t.hp / maxHpOf(t)), 6);
  }
}

function drawMissile(ms, camX, camY) {
  const x = ms.x - camX, y = ms.y - camY;
  // engine gun at the back
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ms.angle);
  ctx.fillStyle = '#999';
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.rect(-ms.radius - 8, -4, 10, 8); ctx.fill(); ctx.stroke();
  ctx.restore();
  // body
  ctx.beginPath();
  ctx.arc(x, y, ms.radius, 0, Math.PI * 2);
  ctx.fillStyle = ms.owner.color;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 3;
  ctx.fill(); ctx.stroke();
  // nose dot
  ctx.beginPath();
  ctx.arc(x + Math.cos(ms.angle) * 5, y + Math.sin(ms.angle) * 5, 4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fill();
}

function drawMinimap() {
  const size = 140, pad = 12;
  const mx = canvas.width - size - pad, my = canvas.height - size - pad;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(mx, my, size, size);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(mx, my, size, size);
  const sx = size / WORLD.w, sy = size / WORLD.h;
  for (const s of shapes) {
    if (s.type === 'pentagon') { ctx.fillStyle = '#768cfc'; ctx.fillRect(mx + s.x * sx - 1, my + s.y * sy - 1, 3, 3); }
  }
  for (const e of enemies) { ctx.fillStyle = '#f14e54'; ctx.fillRect(mx + e.x * sx - 1.5, my + e.y * sy - 1.5, 3, 3); }
  for (const ms of missiles) { ctx.fillStyle = '#ff9a3d'; ctx.fillRect(mx + ms.x * sx - 1.5, my + ms.y * sy - 1.5, 3, 3); }
  if (player && !player.dead) { ctx.fillStyle = '#fff'; ctx.fillRect(mx + player.x * sx - 2, my + player.y * sy - 2, 4, 4); }
}

function refreshHud() {
  if (!player) return;
  const need = xpToNext(player.level);
  document.getElementById('levelbar').style.width = (player.xp / need * 100) + '%';
  document.getElementById('leveltext').textContent = `Level ${player.level}`;
  document.getElementById('score').textContent = 'Score: ' + player.score;
}

/* ---------------- Main loop ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  updateFx(dt);

  // camera (menu drifts slowly around the world)
  let camX, camY;
  if (player) {
    camX = player.x - canvas.width / 2;
    camY = player.y - canvas.height / 2;
  } else {
    camX = WORLD.w / 2 - canvas.width / 2 + Math.cos(now * 0.00008) * 500 - canvas.width * 0.1;
    camY = WORLD.h / 2 - canvas.height / 2 + Math.sin(now * 0.00011) * 400 - canvas.height * 0.1;
  }
  if (shake > 0) {
    camX += (Math.random() - 0.5) * shake;
    camY += (Math.random() - 0.5) * shake;
  }

  drawGrid(camX, camY);
  for (const s of shapes) drawShape(s, camX, camY);

  for (const ms of missiles) drawMissile(ms, camX, camY);

  for (const b of bullets) {
    const x = b.x - camX, y = b.y - camY;
    // trail
    for (let k = 1; k <= 3; k++) {
      ctx.beginPath();
      ctx.arc(x - b.vx * 0.022 * k, y - b.vy * 0.022 * k, b.radius * (1 - 0.22 * k), 0, Math.PI * 2);
      ctx.fillStyle = b.color + '';
      ctx.globalAlpha = 0.1;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.beginPath();
    ctx.arc(x, y, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 3;
    ctx.fill(); ctx.stroke();
  }

  for (const e of enemies) drawTank(e, camX, camY);
  if (player && !player.dead) drawTank(player, camX, camY);

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x - camX, p.y - camY, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // explosion shockwaves
  for (const ex of explosions) {
    const prog = 1 - ex.life / ex.maxLife;
    const r = ex.maxR * (0.2 + 0.8 * prog);
    ctx.beginPath();
    ctx.arc(ex.x - camX, ex.y - camY, r, 0, Math.PI * 2);
    ctx.strokeStyle = ex.color || '#ff9a3d';
    ctx.globalAlpha = (1 - prog) * 0.9;
    ctx.lineWidth = 6 * (1 - prog) + 1;
    ctx.stroke();
    ctx.globalAlpha = (1 - prog) * 0.25;
    ctx.fillStyle = ex.color || '#ff9a3d';
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // muzzle flashes
  for (const f of flashes) {
    const prog = 1 - f.life / f.maxLife;
    ctx.save();
    ctx.translate(f.x - camX, f.y - camY); ctx.rotate(f.angle);
    ctx.globalAlpha = 1 - prog;
    ctx.fillStyle = '#fff2ae';
    ctx.beginPath();
    ctx.moveTo(0, -7 * (1 - prog * 0.5));
    ctx.lineTo(20 * (1 - prog), 0);
    ctx.lineTo(0, 7 * (1 - prog * 0.5));
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // floating texts
  for (const f of floatTexts) {
    ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
    ctx.fillStyle = f.color;
    ctx.font = `bold ${f.size}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x - camX, f.y - camY);
  }
  ctx.globalAlpha = 1;

  drawMinimap();
  refreshHud();
  requestAnimationFrame(loop);
}

/* ---------------- Boot ---------------- */
initWorld();
buildClassSelect();
requestAnimationFrame(loop);
</script>
</body>
