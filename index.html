<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Neon Rocket League 2D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --orange: #ff6b00; --orange-glow: #ff9500;
      --blue: #00b4ff; --blue-glow: #00e5ff;
      --bg: #0a0e17; --neon: #00ffcc;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); font-family: 'Rajdhani', sans-serif;
      color: #fff; user-select: none; -webkit-user-select: none;
    }
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #111827 0%, #05070c 70%);
    }
    #gameCanvas {
      display: block; background: #0d1117;
      box-shadow: 0 0 40px rgba(0,180,255,0.15), 0 0 80px rgba(255,107,0,0.1);
      border-radius: 4px; max-width: 100%; max-height: 100%;
    }
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .scoreboard {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 24px;
      background: linear-gradient(180deg, rgba(10,14,23,0.85), rgba(10,14,23,0.6));
      padding: 10px 28px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .team { display: flex; align-items: center; gap: 12px; }
    .team.orange .score { color: var(--orange-glow); text-shadow: 0 0 12px var(--orange); }
    .team.blue .score { color: var(--blue-glow); text-shadow: 0 0 12px var(--blue); }
    .team-name { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 2px; opacity: 0.7; }
    .score { font-family: 'Orbitron', sans-serif; font-size: 36px; font-weight: 900; min-width: 40px; text-align: center; }
    .timer-box { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
    #timer { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    .mode-label { font-size: 10px; letter-spacing: 2px; opacity: 0.5; margin-top: 2px; }
    .boost-meters {
      position: absolute; bottom: 24px; left: 0; width: 100%;
      display: flex; justify-content: space-between; padding: 0 40px; pointer-events: none;
    }
    .boost-bar {
      width: 180px; height: 14px; background: rgba(0,0,0,0.5);
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden;
    }
    .boost-bar span { position: absolute; top: -18px; left: 0; font-size: 10px; letter-spacing: 1px; opacity: 0.6; }
    .boost-fill { height: 100%; width: 100%; border-radius: 7px; transition: width 0.1s linear; }
    .boost-bar.orange .boost-fill { background: linear-gradient(90deg, #ff4500, var(--orange-glow)); box-shadow: 0 0 12px var(--orange); }
    .boost-bar.blue .boost-fill { background: linear-gradient(90deg, #0088ff, var(--blue-glow)); box-shadow: 0 0 12px var(--blue); }
    .overlay {
      position: absolute; inset: 0; background: rgba(5,7,12,0.88);
      display: flex; align-items: center; justify-content: center; z-index: 50;
      backdrop-filter: blur(6px); transition: opacity 0.3s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .menu-content { text-align: center; max-width: 520px; padding: 20px; }
    .title {
      font-family: 'Orbitron', sans-serif; font-size: clamp(42px, 8vw, 72px); font-weight: 900; line-height: 0.95;
      background: linear-gradient(135deg, var(--orange-glow) 0%, #fff 40%, var(--blue-glow) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 20px rgba(0,180,255,0.3)); margin-bottom: 8px;
    }
    .subtitle { font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 6px; opacity: 0.6; margin-bottom: 36px; }
    .menu-buttons { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
    .menu-btn {
      font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px;
      padding: 16px 32px; border: none; border-radius: 8px; cursor: pointer;
      background: linear-gradient(135deg, var(--orange) 0%, #ff4500 100%); color: #fff;
      box-shadow: 0 4px 20px rgba(255,107,0,0.4); transition: transform 0.15s, box-shadow 0.15s; pointer-events: auto;
    }
    .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,107,0,0.55); }
    .menu-btn:active { transform: translateY(0); }
    .menu-btn.secondary {
      background: linear-gradient(135deg, #1a2332, #0d1520);
      border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .menu-btn.secondary:hover { border-color: var(--blue); box-shadow: 0 4px 20px rgba(0,180,255,0.25); }
    .controls-hint { display: flex; justify-content: center; gap: 48px; text-align: left; opacity: 0.75; font-size: 13px; }
    .ctrl-col h3 { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 2px; margin-bottom: 8px; color: var(--neon); }
    .ctrl-col p { margin: 3px 0; opacity: 0.85; }
    #goal-banner { background: rgba(0,0,0,0.7); }
    .goal-text {
      font-family: 'Orbitron', sans-serif; font-size: clamp(60px, 12vw, 120px); font-weight: 900;
      background: linear-gradient(90deg, var(--orange-glow), #fff, var(--blue-glow));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: goalPulse 0.6s ease-out; filter: drop-shadow(0 0 30px rgba(255,255,255,0.5));
    }
    .goal-scorer { font-family: 'Orbitron', sans-serif; font-size: 18px; letter-spacing: 3px; margin-top: 12px; opacity: 0.9; }
    @keyframes goalPulse {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .end-score { font-family: 'Orbitron', sans-serif; font-size: 28px; margin: 16px 0 28px; letter-spacing: 2px; }
    @media (max-width: 700px) {
      .scoreboard { gap: 12px; padding: 8px 16px; }
      .score { font-size: 28px; }
      .boost-meters { padding: 0 16px; }
      .boost-bar { width: 120px; }
      .controls-hint { flex-direction: column; gap: 20px; align-items: center; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div class="scoreboard">
        <div class="team orange">
          <span class="team-name">ORANGE</span>
          <span id="score-orange" class="score">0</span>
        </div>
        <div class="timer-box">
          <span id="timer">5:00</span>
          <span class="mode-label">LOCAL</span>
        </div>
        <div class="team blue">
          <span id="score-blue" class="score">0</span>
          <span class="team-name">BLUE</span>
        </div>
      </div>
      <div class="boost-meters">
        <div class="boost-bar orange">
          <div id="boost-p1" class="boost-fill"></div>
          <span>P1 BOOST</span>
        </div>
        <div class="boost-bar blue">
          <div id="boost-p2" class="boost-fill"></div>
          <span>P2 BOOST</span>
        </div>
      </div>
    </div>
    <div id="main-menu" class="overlay">
      <div class="menu-content">
        <h1 class="title">NEON<br/>ROCKET<br/>LEAGUE</h1>
        <p class="subtitle">2D CAR SOCCER</p>
        <div class="menu-buttons">
          <button id="btn-1v1" class="menu-btn">1 vs 1 LOCAL</button>
          <button id="btn-vs-ai" class="menu-btn">vs AI</button>
          <button id="btn-freeplay" class="menu-btn secondary">FREE PLAY</button>
        </div>
        <div class="controls-hint">
          <div class="ctrl-col">
            <h3>PLAYER 1 (ORANGE)</h3>
            <p>W A S D — Drive</p>
            <p>SHIFT — Boost</p>
            <p>SPACE — Jump / Dodge</p>
          </div>
          <div class="ctrl-col">
            <h3>PLAYER 2 (BLUE)</h3>
            <p>↑ ← ↓ → — Drive</p>
            <p>CTRL — Boost</p>
            <p>/ or . — Jump / Dodge</p>
          </div>
        </div>
      </div>
    </div>
    <div id="goal-banner" class="overlay hidden">
      <div class="goal-text">GOAL!</div>
      <div id="goal-scorer" class="goal-scorer"></div>
    </div>
    <div id="pause-menu" class="overlay hidden">
      <div class="menu-content">
        <h2>PAUSED</h2>
        <button id="btn-resume" class="menu-btn">RESUME</button>
        <button id="btn-restart" class="menu-btn secondary">RESTART</button>
        <button id="btn-menu" class="menu-btn secondary">MAIN MENU</button>
      </div>
    </div>
    <div id="end-screen" class="overlay hidden">
      <div class="menu-content">
        <h2 id="end-title">MATCH OVER</h2>
        <p id="end-score" class="end-score"></p>
        <button id="btn-play-again" class="menu-btn">PLAY AGAIN</button>
        <button id="btn-to-menu" class="menu-btn secondary">MAIN MENU</button>
      </div>
    </div>
  </div>

<script>
// ===================== AUDIO =====================
const AudioSys = (() => {
  let ctx = null, master = null, muted = false;
  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.35; master.connect(ctx.destination);
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function playTone(freq, type, duration, vol = 0.3, slide = 0) {
    if (!ctx || muted) return;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slide) osc.frequency.linearRampToValueAtTime(freq + slide, ctx.currentTime + duration);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain); gain.connect(master); osc.start(); osc.stop(ctx.currentTime + duration);
  }
  function noise(duration, vol = 0.2) {
    if (!ctx || muted) return;
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const gain = ctx.createGain(), filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 800;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    src.connect(filter); filter.connect(gain); gain.connect(master); src.start();
  }
  return {
    init, resume, setMuted(m) { muted = m; },
    boost() { playTone(90, 'sawtooth', 0.15, 0.12, 40); noise(0.12, 0.08); },
    hit(intensity = 1) { noise(0.08 + intensity * 0.05, 0.15 * intensity); playTone(120 + intensity * 80, 'square', 0.1, 0.1 * intensity, -60); },
    jump() { playTone(180, 'sine', 0.12, 0.2, 120); },
    goal() { playTone(440, 'sine', 0.2, 0.25); setTimeout(() => playTone(554, 'sine', 0.2, 0.25), 100); setTimeout(() => playTone(659, 'sine', 0.35, 0.3), 200); noise(0.4, 0.15); },
    boostPickup() { playTone(600, 'sine', 0.15, 0.2, 200); },
    whistle() { playTone(880, 'sine', 0.4, 0.2, -200); }
  };
})();

// ===================== PARTICLES =====================
class ParticleSystem {
  constructor() { this.particles = []; }
  emit(x, y, opts = {}) {
    const count = opts.count || 8, color = opts.color || '#fff', speed = opts.speed || 3;
    const life = opts.life || 0.6, size = opts.size || 3, spread = opts.spread || Math.PI * 2;
    const angle = opts.angle || 0, gravity = opts.gravity || 0, fade = opts.fade !== false;
    for (let i = 0; i < count; i++) {
      const a = angle + (Math.random() - 0.5) * spread, s = speed * (0.5 + Math.random() * 0.8);
      this.particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: life*(0.7+Math.random()*0.5), maxLife: life, size: size*(0.6+Math.random()*0.6), color, gravity, fade, alpha: 1 });
    }
  }
  boostTrail(x, y, angle, color) {
    this.emit(x, y, { count: 3, color, speed: 2+Math.random()*2, life: 0.35, size: 4, spread: 0.6, angle: angle+Math.PI });
  }
  explosion(x, y, color) {
    this.emit(x, y, { count: 40, color, speed: 6, life: 0.9, size: 5, spread: Math.PI*2, gravity: 40 });
    this.emit(x, y, { count: 20, color: '#fff', speed: 4, life: 0.5, size: 3, spread: Math.PI*2 });
  }
  spark(x, y) { this.emit(x, y, { count: 6, color: '#fff', speed: 4, life: 0.3, size: 2, spread: Math.PI*2 }); }
  update(dt) {
    for (let i = this.particles.length-1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx*dt*60; p.y += p.vy*dt*60; p.vy += p.gravity*dt; p.life -= dt;
      if (p.fade) p.alpha = Math.max(0, p.life/p.maxLife);
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }
  draw(ctx) {
    for (const p of this.particles) {
      ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*p.alpha, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// ===================== PHYSICS =====================
const Physics = {
  carBall(car, ball, restitution = 0.7) {
    const cos = Math.cos(car.angle), sin = Math.sin(car.angle);
    const hw = car.width/2, hh = car.height/2;
    const dx = ball.x - car.x, dy = ball.y - car.y;
    const localX = dx*cos + dy*sin, localY = -dx*sin + dy*cos;
    const closestX = Math.max(-hw, Math.min(hw, localX));
    const closestY = Math.max(-hh, Math.min(hh, localY));
    const distX = localX - closestX, distY = localY - closestY;
    const distSq = distX*distX + distY*distY;
    if (distSq >= ball.radius*ball.radius) return false;
    let nx, ny, overlap;
    if (distSq === 0) {
      const penX = hw - Math.abs(localX), penY = hh - Math.abs(localY);
      if (penX < penY) { nx = localX > 0 ? 1 : -1; ny = 0; overlap = penX + ball.radius; }
      else { nx = 0; ny = localY > 0 ? 1 : -1; overlap = penY + ball.radius; }
    } else {
      const dist = Math.sqrt(distSq); nx = distX/dist; ny = distY/dist; overlap = ball.radius - dist;
    }
    const worldNx = nx*cos - ny*sin, worldNy = nx*sin + ny*cos;
    const totalMass = car.mass + ball.mass;
    car.x -= worldNx * overlap * (ball.mass/totalMass) * 0.3;
    car.y -= worldNy * overlap * (ball.mass/totalMass) * 0.3;
    ball.x += worldNx * overlap * (car.mass/totalMass);
    ball.y += worldNy * overlap * (car.mass/totalMass);
    const rvx = ball.vx - car.vx, rvy = ball.vy - car.vy;
    const velN = rvx*worldNx + rvy*worldNy;
    if (velN > 0) return true;
    const j = -(1 + restitution) * velN / (1/car.mass + 1/ball.mass);
    const impulse = j * 1.4;
    car.vx -= (impulse * worldNx) / car.mass * 0.4;
    car.vy -= (impulse * worldNy) / car.mass * 0.4;
    ball.vx += (impulse * worldNx) / ball.mass;
    ball.vy += (impulse * worldNy) / ball.mass;
    const forwardBoost = (car.vx*cos + car.vy*sin) * 0.15;
    ball.vx += cos * forwardBoost; ball.vy += sin * forwardBoost;
    return true;
  },
  carCar(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 0.001;
    const minDist = (a.width + b.width) * 0.45;
    if (dist >= minDist) return false;
    const nx = dx/dist, ny = dy/dist, overlap = minDist - dist;
    a.x -= nx*overlap*0.5; a.y -= ny*overlap*0.5;
    b.x += nx*overlap*0.5; b.y += ny*overlap*0.5;
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    const velN = rvx*nx + rvy*ny;
    if (velN > 0) return true;
    const j = -(1+0.4)*velN / (1/a.mass + 1/b.mass);
    a.vx -= (j*nx)/a.mass; a.vy -= (j*ny)/a.mass;
    b.vx += (j*nx)/b.mass; b.vy += (j*ny)/b.mass;
    return true;
  }
};

// ===================== ENTITIES =====================
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
}

class Car {
  constructor(x, y, angle, color, team) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.angle = angle; this.angularVel = 0;
    this.width = 42; this.height = 26; this.radius = 22; this.mass = 12;
    this.color = color; this.team = team; this.boost = 100; this.maxBoost = 100;
    this.jumpTimer = 0; this.dodgeTimer = 0; this.dodgeDir = {x:0,y:0};
    this.supersonic = false; this.throttle = 0; this.steer = 0; this.boosting = false;
    this.jumpPressed = false; this.jumpWasPressed = false; this.jump = false;
  }
  reset(x, y, angle) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.angle = angle; this.angularVel = 0;
    this.boost = 33; this.jumpTimer = 0; this.dodgeTimer = 0; this.supersonic = false;
  }
  update(dt, keys, isAI = false) {
    const ACCEL = 520, REVERSE = 380, TURN_SPEED = 4.2, FRICTION = 3.8, BOOST_FORCE = 780, MAX_SPEED = 520;
    if (this.jumpTimer > 0) this.jumpTimer -= dt;
    if (this.dodgeTimer > 0) {
      this.dodgeTimer -= dt;
      this.vx += this.dodgeDir.x * 900 * dt; this.vy += this.dodgeDir.y * 900 * dt;
    }
    if (!isAI) {
      this.throttle = 0; this.steer = 0; this.boosting = false;
      if (keys.up) this.throttle = 1; if (keys.down) this.throttle = -1;
      if (keys.left) this.steer = -1; if (keys.right) this.steer = 1;
      if (keys.boost && this.boost > 0) this.boosting = true;
    }
    const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    if (Math.abs(this.throttle) > 0.1 || this.boosting || speed > 30) {
      this.angle += this.steer * TURN_SPEED * dt * (this.throttle < 0 ? -1 : 1);
    }
    const cos = Math.cos(this.angle), sin = Math.sin(this.angle);
    if (this.throttle > 0) { this.vx += cos*ACCEL*this.throttle*dt; this.vy += sin*ACCEL*this.throttle*dt; }
    else if (this.throttle < 0) { this.vx += cos*REVERSE*this.throttle*dt; this.vy += sin*REVERSE*this.throttle*dt; }
    if (this.boosting && this.boost > 0) {
      this.vx += cos*BOOST_FORCE*dt; this.vy += sin*BOOST_FORCE*dt;
      this.boost = Math.max(0, this.boost - 28*dt);
      if (window.particles) window.particles.boostTrail(this.x - cos*18, this.y - sin*18, this.angle, this.team === 'orange' ? '#ff6b00' : '#00b4ff');
    }
    const drag = this.boosting ? 1.2 : FRICTION;
    this.vx *= Math.max(0, 1 - drag*dt); this.vy *= Math.max(0, 1 - drag*dt);
    const newSpeed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
    if (newSpeed > MAX_SPEED) { this.vx = (this.vx/newSpeed)*MAX_SPEED; this.vy = (this.vy/newSpeed)*MAX_SPEED; }
    this.supersonic = newSpeed > 480;
    const jumpJustPressed = (keys.jump || this.jump) && !this.jumpWasPressed;
    this.jumpWasPressed = keys.jump || this.jump;
    if (jumpJustPressed && this.jumpTimer <= 0) {
      this.jumpTimer = 0.35; AudioSys.jump();
      this.vx += cos*80; this.vy += sin*80;
      if (this.steer !== 0 || this.throttle !== 0) {
        this.dodgeTimer = 0.28;
        const dodgeAngle = this.angle + Math.atan2(this.steer, this.throttle);
        this.dodgeDir.x = Math.cos(dodgeAngle); this.dodgeDir.y = Math.sin(dodgeAngle);
        this.angularVel = this.steer * 12;
      }
    }
    this.angle += this.angularVel * dt; this.angularVel *= 0.9;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (!this.boosting) this.boost = Math.min(this.maxBoost, this.boost + 4*dt);
  }
  draw(ctx) {
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
    ctx.shadowBlur = 18; ctx.shadowColor = this.color;
    const gradient = ctx.createLinearGradient(-20, 0, 20, 0);
    if (this.team === 'orange') { gradient.addColorStop(0,'#ff4500'); gradient.addColorStop(0.5,'#ff8c00'); gradient.addColorStop(1,'#ffaa00'); }
    else { gradient.addColorStop(0,'#0066ff'); gradient.addColorStop(0.5,'#00b4ff'); gradient.addColorStop(1,'#00e5ff'); }
    ctx.fillStyle = gradient; roundRect(ctx, -this.width/2, -this.height/2, this.width, this.height, 5); ctx.fill();
    ctx.fillStyle = 'rgba(20,25,35,0.85)'; roundRect(ctx, -6, -8, 16, 16, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-16, -this.height/2+3); ctx.lineTo(14, -this.height/2+3);
    ctx.moveTo(-16, this.height/2-3); ctx.lineTo(14, this.height/2-3); ctx.stroke();
    if (this.boosting && this.boost > 0) {
      ctx.shadowBlur = 25; ctx.shadowColor = this.color;
      const flicker = 0.7 + Math.random()*0.5;
      ctx.fillStyle = this.team === 'orange' ? `rgba(255,150,0,${flicker})` : `rgba(0,200,255,${flicker})`;
      ctx.beginPath(); ctx.moveTo(-this.width/2, -6); ctx.lineTo(-this.width/2-14-Math.random()*10, 0); ctx.lineTo(-this.width/2, 6); ctx.closePath(); ctx.fill();
    }
    if (this.supersonic) {
      ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-this.width/2-4, 0); ctx.lineTo(-this.width/2-22, 0); ctx.stroke();
    }
    ctx.shadowBlur = 0; ctx.restore();
  }
}

class Ball {
  constructor(x, y) {
    this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.radius = 16; this.mass = 4; this.spin = 0; this.trail = [];
  }
  reset(x, y) { this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.spin = 0; this.trail = []; }
  update(dt) {
    this.vx *= 0.998; this.vy *= 0.998;
    this.x += this.vx*dt; this.y += this.vy*dt;
    this.spin += (this.vx*0.02)*dt;
    this.trail.push({x: this.x, y: this.y, life: 0.35});
    if (this.trail.length > 18) this.trail.shift();
    for (const t of this.trail) t.life -= dt;
    this.trail = this.trail.filter(t => t.life > 0);
  }
  draw(ctx) {
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i]; ctx.globalAlpha = Math.min(0.4, t.life*1.5); ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(t.x, t.y, this.radius*0.5*(t.life/0.35), 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = '#ffffff';
    const grad = ctx.createRadialGradient(this.x-5, this.y-5, 2, this.x, this.y, this.radius);
    grad.addColorStop(0,'#ffffff'); grad.addColorStop(0.4,'#e0e0e0'); grad.addColorStop(1,'#888');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
    ctx.translate(this.x, this.y); ctx.rotate(this.spin);
    for (let i = 0; i < 6; i++) { ctx.rotate(Math.PI/3); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0, -this.radius+2); ctx.stroke(); }
    ctx.restore();
  }
}

class BoostPad {
  constructor(x, y, big = false) {
    this.x = x; this.y = y; this.big = big; this.radius = big ? 22 : 12;
    this.active = true; this.respawnTimer = 0; this.pulse = 0;
  }
  update(dt) {
    this.pulse += dt*4;
    if (!this.active) { this.respawnTimer -= dt; if (this.respawnTimer <= 0) this.active = true; }
  }
  tryCollect(car) {
    if (!this.active) return false;
    const dx = car.x - this.x, dy = car.y - this.y;
    if (dx*dx + dy*dy < (this.radius+18)**2) {
      this.active = false; this.respawnTimer = this.big ? 10 : 4;
      car.boost = Math.min(car.maxBoost, car.boost + (this.big ? 100 : 12));
      AudioSys.boostPickup();
      if (window.particles) window.particles.emit(this.x, this.y, { count: this.big?20:8, color:'#00ffcc', speed:3, life:0.5, size:3 });
      return true;
    }
    return false;
  }
  draw(ctx) {
    if (!this.active) ctx.globalAlpha = 0.15;
    const pulse = 0.7 + Math.sin(this.pulse)*0.3;
    ctx.shadowBlur = 15*pulse; ctx.shadowColor = '#00ffcc';
    ctx.strokeStyle = `rgba(0,255,200,${pulse})`; ctx.lineWidth = this.big ? 3 : 2;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.stroke();
    if (this.big) {
      ctx.fillStyle = `rgba(0,255,200,${0.15*pulse})`; ctx.fill();
      ctx.font = 'bold 11px Orbitron'; ctx.fillStyle = `rgba(0,255,200,${pulse})`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('BOOST', this.x, this.y);
    } else {
      ctx.fillStyle = `rgba(0,255,200,${0.3*pulse})`;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.radius*0.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}

// ===================== AI =====================
const AI = {
  update(car, ball, arena, dt) {
    const dx = ball.x - car.x, dy = ball.y - car.y, dist = Math.sqrt(dx*dx+dy*dy)||1;
    const predX = ball.x + ball.vx*0.25, predY = ball.y + ball.vy*0.25;
    const pdx = predX - car.x, pdy = predY - car.y;
    const targetAngle = Math.atan2(pdy, pdx);
    let angleDiff = targetAngle - car.angle;
    while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
    const isOrange = car.team === 'orange';
    const ownGoalX = isOrange ? arena.x : arena.x + arena.w;
    car.throttle = 0; car.steer = 0; car.boosting = false; car.jump = false;
    if (Math.abs(angleDiff) > 0.08) car.steer = angleDiff > 0 ? 1 : -1;
    if (Math.abs(angleDiff) < 0.6) car.throttle = 1;
    else if (Math.abs(angleDiff) > 1.8) car.throttle = -0.4;
    else car.throttle = 0.5;
    if (dist > 120 && Math.abs(angleDiff) < 0.35 && car.boost > 15) car.boosting = true;
    if (dist > 280 && car.boost > 30) car.boosting = true;
    if (dist < 55 && Math.abs(angleDiff) < 0.4 && Math.random() < 0.04) car.jump = true;
    const ballToOwn = Math.abs(ball.x - ownGoalX);
    if (ballToOwn < 200 && dist > 100) {
      const defendX = (ball.x + ownGoalX)/2, defendY = ball.y;
      const defAngle = Math.atan2(defendY - car.y, defendX - car.x);
      let defDiff = defAngle - car.angle;
      while (defDiff > Math.PI) defDiff -= Math.PI*2;
      while (defDiff < -Math.PI) defDiff += Math.PI*2;
      car.steer = defDiff > 0 ? 1 : -1; car.throttle = 1;
      if (Math.abs(defDiff) < 0.3 && car.boost > 10) car.boosting = true;
    }
    if (Math.abs(car.vx)+Math.abs(car.vy) < 20 && dist > 50) car.throttle = 1;
  }
};

// ===================== MAIN GAME =====================
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const ARENA_W = 1100, ARENA_H = 650, GOAL_HEIGHT = 160;
  let state = 'menu', mode = '1v1', scoreOrange = 0, scoreBlue = 0, matchTime = 300, goalTimer = 0, shake = 0;
  let car1, car2, ball, boostPads = [];
  const particles = new ParticleSystem(); window.particles = particles;
  const keys = {
    p1: { up:false, down:false, left:false, right:false, boost:false, jump:false },
    p2: { up:false, down:false, left:false, right:false, boost:false, jump:false }
  };
  const elScoreO = document.getElementById('score-orange');
  const elScoreB = document.getElementById('score-blue');
  const elTimer = document.getElementById('timer');
  const elBoostP1 = document.getElementById('boost-p1');
  const elBoostP2 = document.getElementById('boost-p2');
  const mainMenu = document.getElementById('main-menu');
  const goalBanner = document.getElementById('goal-banner');
  const goalScorer = document.getElementById('goal-scorer');
  const pauseMenu = document.getElementById('pause-menu');
  const endScreen = document.getElementById('end-screen');
  const endTitle = document.getElementById('end-title');
  const endScore = document.getElementById('end-score');

  function resize() {
    const maxW = window.innerWidth - 20, maxH = window.innerHeight - 20;
    const scale = Math.min(maxW / ARENA_W, maxH / ARENA_H);
    canvas.width = ARENA_W * scale; canvas.height = ARENA_H * scale;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }

  function createBoostPads() {
    boostPads = [
      new BoostPad(ARENA_W/2, 80, true), new BoostPad(ARENA_W/2, ARENA_H-80, true),
      new BoostPad(200, 120), new BoostPad(200, ARENA_H-120),
      new BoostPad(ARENA_W-200, 120), new BoostPad(ARENA_W-200, ARENA_H-120),
      new BoostPad(ARENA_W/2-180, ARENA_H/2), new BoostPad(ARENA_W/2+180, ARENA_H/2),
      new BoostPad(120, ARENA_H/2), new BoostPad(ARENA_W-120, ARENA_H/2)
    ];
  }

  function resetPositions() {
    car1.reset(220, ARENA_H/2, 0);
    car2.reset(ARENA_W-220, ARENA_H/2, Math.PI);
    ball.reset(ARENA_W/2, ARENA_H/2);
    car1.boost = 33; car2.boost = 33;
  }

  function startGame(selectedMode) {
    mode = selectedMode; scoreOrange = 0; scoreBlue = 0;
    matchTime = mode === 'freeplay' ? 9999 : 300; state = 'playing';
    mainMenu.classList.add('hidden'); endScreen.classList.add('hidden');
    pauseMenu.classList.add('hidden'); goalBanner.classList.add('hidden');
    car1 = new Car(220, ARENA_H/2, 0, '#ff6b00', 'orange');
    car2 = new Car(ARENA_W-220, ARENA_H/2, Math.PI, '#00b4ff', 'blue');
    ball = new Ball(ARENA_W/2, ARENA_H/2); createBoostPads(); resetPositions();
    document.querySelector('.mode-label').textContent = mode === '1v1' ? '1v1 LOCAL' : mode === 'ai' ? 'VS AI' : 'FREE PLAY';
    elScoreO.textContent = '0'; elScoreB.textContent = '0';
    AudioSys.init(); AudioSys.resume(); AudioSys.whistle();
  }

  function checkGoals() {
    const goalTop = (ARENA_H - GOAL_HEIGHT)/2, goalBot = goalTop + GOAL_HEIGHT;
    if (ball.x + ball.radius > ARENA_W - 8 && ball.y > goalTop && ball.y < goalBot) return 'orange';
    if (ball.x - ball.radius < 8 && ball.y > goalTop && ball.y < goalBot) return 'blue';
    return null;
  }

  function onGoal(team) {
    state = 'goal'; goalTimer = 2.2;
    if (team === 'orange') scoreOrange++; else scoreBlue++;
    elScoreO.textContent = scoreOrange; elScoreB.textContent = scoreBlue;
    goalScorer.textContent = team === 'orange' ? 'ORANGE SCORES!' : 'BLUE SCORES!';
    goalBanner.classList.remove('hidden'); AudioSys.goal();
    particles.explosion(ball.x, ball.y, team === 'orange' ? '#ff6b00' : '#00b4ff');
    shake = 18;
  }

  function endMatch() {
    state = 'end'; endScreen.classList.remove('hidden');
    if (scoreOrange > scoreBlue) { endTitle.textContent = 'ORANGE WINS!'; endTitle.style.color = '#ff9500'; }
    else if (scoreBlue > scoreOrange) { endTitle.textContent = 'BLUE WINS!'; endTitle.style.color = '#00e5ff'; }
    else { endTitle.textContent = 'DRAW!'; endTitle.style.color = '#fff'; }
    endScore.textContent = `${scoreOrange}  -  ${scoreBlue}`; AudioSys.whistle();
  }

  function drawArena() {
    const bgGrad = ctx.createLinearGradient(0, 0, 0, ARENA_H);
    bgGrad.addColorStop(0, '#0b1220'); bgGrad.addColorStop(0.5, '#0d1525'); bgGrad.addColorStop(1, '#0b1220');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, ARENA_W, ARENA_H);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ARENA_W/2, ARENA_H/2, 90, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(ARENA_W/2, ARENA_H/2, 6, 0, Math.PI*2); ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(ARENA_W/2, 0); ctx.lineTo(ARENA_W/2, ARENA_H); ctx.stroke();
    ctx.setLineDash([12, 10]); ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.moveTo(40,40); ctx.lineTo(ARENA_W-40,40); ctx.lineTo(ARENA_W-40,ARENA_H-40); ctx.lineTo(40,ARENA_H-40); ctx.closePath(); ctx.stroke();
    ctx.setLineDash([]);
    const goalTop = (ARENA_H - GOAL_HEIGHT)/2;
    ctx.fillStyle = 'rgba(255,100,0,0.12)'; ctx.fillRect(0, goalTop, 18, GOAL_HEIGHT);
    ctx.strokeStyle = '#ff6b00'; ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = '#ff6b00';
    ctx.strokeRect(0, goalTop, 18, GOAL_HEIGHT); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,100,0,0.25)'; ctx.lineWidth = 1;
    for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(0, goalTop+(GOAL_HEIGHT/6)*i); ctx.lineTo(18, goalTop+(GOAL_HEIGHT/6)*i); ctx.stroke(); }
    ctx.fillStyle = 'rgba(0,180,255,0.12)'; ctx.fillRect(ARENA_W-18, goalTop, 18, GOAL_HEIGHT);
    ctx.strokeStyle = '#00b4ff'; ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = '#00b4ff';
    ctx.strokeRect(ARENA_W-18, goalTop, 18, GOAL_HEIGHT); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(0,180,255,0.25)'; ctx.lineWidth = 1;
    for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(ARENA_W-18, goalTop+(GOAL_HEIGHT/6)*i); ctx.lineTo(ARENA_W, goalTop+(GOAL_HEIGHT/6)*i); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(0,255,200,0.08)'; ctx.lineWidth = 6; ctx.strokeRect(4, 4, ARENA_W-8, ARENA_H-8);
  }

  function update(dt) {
    if (state !== 'playing' && state !== 'goal') return;
    if (state === 'goal') {
      goalTimer -= dt; particles.update(dt);
      if (goalTimer <= 0) {
        goalBanner.classList.add('hidden');
        if (mode !== 'freeplay' && (scoreOrange >= 5 || scoreBlue >= 5)) { endMatch(); return; }
        resetPositions(); state = 'playing'; AudioSys.whistle();
      }
      ball.update(dt * 0.3); return;
    }
    if (mode !== 'freeplay') {
      matchTime -= dt;
      if (matchTime <= 0) { matchTime = 0; endMatch(); return; }
    }
    const p1Keys = { up: keys.p1.up, down: keys.p1.down, left: keys.p1.left, right: keys.p1.right, boost: keys.p1.boost, jump: keys.p1.jump };
    const p2Keys = { up: keys.p2.up, down: keys.p2.down, left: keys.p2.left, right: keys.p2.right, boost: keys.p2.boost, jump: keys.p2.jump };
    if (mode === 'ai') {
      AI.update(car2, ball, { x:0, y:0, w:ARENA_W, h:ARENA_H }, dt);
      p2Keys.up = car2.throttle > 0.3; p2Keys.down = car2.throttle < -0.3;
      p2Keys.left = car2.steer < -0.3; p2Keys.right = car2.steer > 0.3;
      p2Keys.boost = car2.boosting; p2Keys.jump = car2.jump;
    }
    if (mode === 'freeplay') { car2.vx *= 0.95; car2.vy *= 0.95; }
    else car2.update(dt, p2Keys, mode === 'ai');
    car1.update(dt, p1Keys);
    ball.update(dt);
    for (const pad of boostPads) { pad.update(dt); pad.tryCollect(car1); if (mode !== 'freeplay') pad.tryCollect(car2); }
    const goalTop = (ARENA_H - GOAL_HEIGHT)/2, goalBot = goalTop + GOAL_HEIGHT;
    if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy = Math.abs(ball.vy)*0.75; }
    if (ball.y + ball.radius > ARENA_H) { ball.y = ARENA_H - ball.radius; ball.vy = -Math.abs(ball.vy)*0.75; }
    if (ball.x - ball.radius < 0) { if (ball.y < goalTop || ball.y > goalBot) { ball.x = ball.radius; ball.vx = Math.abs(ball.vx)*0.75; } }
    if (ball.x + ball.radius > ARENA_W) { if (ball.y < goalTop || ball.y > goalBot) { ball.x = ARENA_W - ball.radius; ball.vx = -Math.abs(ball.vx)*0.75; } }
    for (const car of [car1, car2]) {
      if (car.x - car.width/2 < 0) { car.x = car.width/2; car.vx *= -0.3; }
      if (car.x + car.width/2 > ARENA_W) { car.x = ARENA_W - car.width/2; car.vx *= -0.3; }
      if (car.y - car.height/2 < 0) { car.y = car.height/2; car.vy *= -0.3; }
      if (car.y + car.height/2 > ARENA_H) { car.y = ARENA_H - car.height/2; car.vy *= -0.3; }
    }
    if (Physics.carBall(car1, ball)) { AudioSys.hit(Math.min(1.5, Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)/300)); particles.spark(ball.x, ball.y); shake = Math.min(12, shake+4); }
    if (mode !== 'freeplay' && Physics.carBall(car2, ball)) { AudioSys.hit(Math.min(1.5, Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy)/300)); particles.spark(ball.x, ball.y); shake = Math.min(12, shake+4); }
    if (mode !== 'freeplay') Physics.carCar(car1, car2);
    const scored = checkGoals(); if (scored) onGoal(scored);
    particles.update(dt); shake *= 0.9; if (shake < 0.3) shake = 0;
    elBoostP1.style.width = `${Math.max(0, car1.boost)}%`;
    elBoostP2.style.width = `${Math.max(0, car2.boost)}%`;
    const mins = Math.floor(matchTime/60), secs = Math.floor(matchTime%60);
    elTimer.textContent = mode === 'freeplay' ? '∞' : `${mins}:${secs.toString().padStart(2,'0')}`;
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    drawArena();
    for (const pad of boostPads) pad.draw(ctx);
    if (mode !== 'freeplay') car2.draw(ctx);
    car1.draw(ctx); ball.draw(ctx); particles.draw(ctx);
    const vig = ctx.createRadialGradient(ARENA_W/2, ARENA_H/2, ARENA_H*0.3, ARENA_W/2, ARENA_H/2, ARENA_W*0.7);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, ARENA_W, ARENA_H);
    ctx.restore();
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime)/1000); lastTime = now;
    update(dt); draw(); requestAnimationFrame(loop);
  }

  const keyMap = {
    KeyW:['p1','up'], KeyS:['p1','down'], KeyA:['p1','left'], KeyD:['p1','right'],
    ShiftLeft:['p1','boost'], ShiftRight:['p1','boost'], Space:['p1','jump'],
    ArrowUp:['p2','up'], ArrowDown:['p2','down'], ArrowLeft:['p2','left'], ArrowRight:['p2','right'],
    ControlLeft:['p2','boost'], ControlRight:['p2','boost'],
    Period:['p2','jump'], Slash:['p2','jump'], Numpad0:['p2','jump']
  };
  window.addEventListener('keydown', e => {
    if (e.code === 'Escape') {
      if (state === 'playing') { state = 'paused'; pauseMenu.classList.remove('hidden'); }
      else if (state === 'paused') { state = 'playing'; pauseMenu.classList.add('hidden'); }
      return;
    }
    const map = keyMap[e.code]; if (map) { keys[map[0]][map[1]] = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    const map = keyMap[e.code]; if (map) { keys[map[0]][map[1]] = false; e.preventDefault(); }
  });
  document.getElementById('btn-1v1').addEventListener('click', () => startGame('1v1'));
  document.getElementById('btn-vs-ai').addEventListener('click', () => startGame('ai'));
  document.getElementById('btn-freeplay').addEventListener('click', () => startGame('freeplay'));
  document.getElementById('btn-resume').addEventListener('click', () => { state = 'playing'; pauseMenu.classList.add('hidden'); });
  document.getElementById('btn-restart').addEventListener('click', () => { pauseMenu.classList.add('hidden'); startGame(mode); });
  document.getElementById('btn-menu').addEventListener('click', () => { pauseMenu.classList.add('hidden'); endScreen.classList.add('hidden'); state = 'menu'; mainMenu.classList.remove('hidden'); });
  document.getElementById('btn-play-again').addEventListener('click', () => startGame(mode));
  document.getElementById('btn-to-menu').addEventListener('click', () => { endScreen.classList.add('hidden'); state = 'menu'; mainMenu.classList.remove('hidden'); });
  window.addEventListener('keydown', e => { if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
  window.addEventListener('resize', resize); resize();
  requestAnimationFrame(loop);
  window.addEventListener('click', () => { AudioSys.init(); AudioSys.resume(); }, { once: true });
})();
</script>
