<script>

let W=0,H=0;function rs(){C.width=W=innerWidth;C.height=H=innerHeight}addEventListener('resize',rs);rs();
const R=Math.random,rr=(a,b)=>a+R()*(b-a),pick=a=>a[R()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v)),hyp=Math.hypot,TAU=6.2832;

const WW=3400; // compact arena

/* classes */

const T={

sniper:D('Sniper','#3ecfcf',24,'Long range.',[{l:58,w:11}],{rel:1.65,dmg:1.45,siz:.7,spd:1.5,life:1.6,rc:1.5},['rail','assassin'],25),
pounder:D('Pounder','#ff8c42',28,'Heavy shells.',[{l:46,w:28}],{rel:2.1,dmg:2.2,siz:1.65,rc:2.2},['destroyer','howitzer'],25),

hexflank:D('Hexa-Flank','#a04010',28,'Hexa.',[{l:38,w:12},{a:1.05,l:34,w:11},{a:2.09,l:34,w:11},{a:Math.PI,l:36,w:12},{a:-2.09,l:34,w:11},{a:-1.05,l:34,w:11}],{rc:1.25}),
scatter:D('Scatter','#ffcf5c',27,'Scatter.',[{l:44,w:28}],{rel:1.9,dmg:.48,siz:.58,life:.48,pel:10,spr:.75,rc:2.1}),
minigun:D('Minigun','#3fe08a',27,'Minigun.',[{l:38,w:26}],{rel:.26,dmg:.38,siz:.52,spr:.42,rc:.75,heat:2.4}),
lockon:D('Lock-On','#d48cff',26,'Lock-on.',[{l:50,w:24}],{missile:1,lock:1,rel:3.4,rc:1.7}),
swarm:D('Swarm','#a66bff',27,'Swarm.',[{l:46,w:26}],{missile:1,swarm:1,rel:3.8,rc:1.8}),
spinner:D('Spinner','#c77dff',26,'Spinner.',[{l:48,w:20}],{missile:1,spin:1,rel:3.1,rc:1.5},['auto'],40),
auto:D('Auto Missile','#e0a0ff',27,'Auto.',[{l:50,w:22}],{missile:1,auto:1,rel:3.3,rc:1.6}),
megaTrap:D('Mega Trapper','#f0b0d0',28,'Mega traps.',[{l:30,w:28,trapGun:1}],{trap:1,trapSize:1.4,trapLife:1.35,rel:1.8,rc:1.1}),
hexaTrap:D('Hexa Trapper','#d888b0',27,'Hex traps.',[
  {l:24,w:16,a:0,trapGun:1},{l:24,w:16,a:1.047,trapGun:1},{l:24,w:16,a:2.094,trapGun:1},
  {l:24,w:16,a:Math.PI,trapGun:1},{l:24,w:16,a:-2.094,trapGun:1},{l:24,w:16,a:-1.047,trapGun:1}
],{trap:1,rel:2.0,rc:1.0})
};
const STARTERS=['basic','twin','sniper','pounder','flank','shotgun','missile','trapper'];
const S=[['regen','Regen'],['hp','Max HP'],['body','Body'],['bspd','B.Spd'],['bdmg','B.Dmg'],['rel','Reload'],['mov','Speed']];
const PS={aggr:{pd:120,ap:1.4,rt:0,rg:580,st:.6},snip:{pd:420,ap:.45,rt:-1.1,rg:760,st:.8},flnk:{pd:200,ap:1.15,rt:-.5,rg:520,st:1.4},tank:{pd:70,ap:1.5,rt:.4,rg:440,st:.4},trapper:{pd:250,ap:.55,rt:-.25,rg:460,st:.9,block:1}};
const NAMES=['Vortex','Blitz','Nova','Rusty','Havoc','Mochi','Zeta','Gunner','Pixel','Tango','Ghost','Bolt','Comet','Sarge','Echo','Rook','Ace','Viper'];
const TEAM_PAL=[['#3b82f6','#60a5fa'],['#22c55e','#4ade80'],['#ef4444','#f87171'],['#a855f7','#c084fc'],['#f59e0b','#fbbf24'],['#06b6d4','#22d3ee']];
const SHT=[['sq',4,20,24,7,'#ffe763',4],['tr',3,18,48,15,'#fc7677',6],['pe',5,28,160,90,'#768cfc',11],['hx',6,34,360,220,'#c77dff',18]];
const PU={heal:['#58e06a','+'],rapid:['#ffd34d','»'],shield:['#4db8ff','◈']};

/* state */
let MODE='ffa',state='menu',P=null,cur=null,shake=0,DBG=false,auto=false,autoSpin=false,bossT=50,streak=0,streakT=0,lbT=0;
let teamCols=null,teamWin=null;
const cam={x:WW/2,y:WW/2,z:1,kx:0,ky:0},keys={},ms={x:0,y:0,d:0};
let bl=[],msl=[],sh=[],bt=[],pt=[],rg=[],ft=[],pu=[],nests=[],drones=[],traps=[],walls=[],bases=[];
let now=0;

/* math */
const sz=t=>1+Math.min(1.4,Math.pow(Math.max(0,t.sc)/90000,.45));
const rad=t=>(t.bossR||T[t.k]?.r||28)*sz(t);
const M=t=>t.bossM||T[t.k]?.m||{};
const mx=t=>(100+t.st.hp*20)*(.88+sz(t)*.12)*(t.boss?3.2:1);
const dmgOf=t=>(7.5+t.st.bdmg*4.2)*(M(t).dmg||1)*(.92+sz(t)*.08);
const relOf=t=>Math.max(90,520*Math.pow(.89,t.st.rel)*(M(t).rel||1)*(t.bf.rapid>0?.6:1));
const bspd=t=>(350+t.st.bspd*25)*(M(t).spd||1);
const movOf=t=>(148+t.st.mov*10)/Math.pow(sz(t),.14);
const bodyOf=t=>(8.5+t.st.body*4.1)*(.92+sz(t)*.1);
const need=l=>Math.round(14*Math.pow(l,1.65));
function mk(x,y,k,pl,team){
  const st={};S.forEach(s=>st[s[0]]=0);
  const col=team!=null&&teamCols?teamCols[team][0]:(pl?T[k].c:pick(['#f14e54','#e67e22','#9b59b6','#3498db','#1abc9c']));
  const isTrap=k==='trapper'||k==='megaTrap'||k==='hexaTrap';
  return{x,y,vx:0,vy:0,ang:rr(0,TAU),k,pl,team:team!=null?team:null,col,st,hp:100,hpv:100,lv:1,xp:0,sc:0,pts:0,cd:0,rc:0,fl:0,bi:0,bf:{rapid:0,shield:0},dash:0,name:pl?'You':pick(NAMES),ps:isTrap?'trapper':pick(Object.keys(PS)),dead:0,ai:0,aim:rr(0,TAU),sd:R()<.5?1:-1,heat:0,spawn:0,blockCd:0,blockSpot:null,pathT:0};
}

/* fx */
function spark(x,y,n,cols,s0,s1,z0,z1,l0,l1){for(let i=0;i<n;i++){const a=rr(0,TAU),s=rr(s0,s1),l=rr(l0,l1);pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l,m:l,c:pick(cols),s:rr(z0,z1)})}if(pt.length>900)pt.splice(0,pt.length-900)}
const ring=(x,y,mr,c,l)=>rg.push({x,y,r:0,mr,l:l||.35,m:l||.35,c});
const flt=(x,y,t,c,s)=>{if(ft.length<60)ft.push({x,y,t,c,s:s||12,l:.8})};
function ban(t,c){const b=$('ban');b.textContent=t;b.style.color=c||'#fff';b.classList.remove('s');void b.offsetWidth;b.classList.add('s')}

/* ========== COMPACT THICK-WALL HALL MAZE ==========
   Layout: left base | hall corridors | right base
   Only a few long thick walls creating 3 lanes with openings
*/
function buildMaze(){
  walls=[];
  const T=70; // thick walls
  const cx=WW/2;
  // outer boundary is the map edge already

  // LEFT side vertical barrier (separates left base from hall) with 3 big openings
  // openings at y: 400-750, 1300-1750, 2200-2550
  walls.push({x:900, y:0,    w:T, h:380});
  walls.push({x:900, y:780,  w:T, h:480});
  walls.push({x:900, y:1780, w:T, h:380});
  walls.push({x:900, y:2580, w:T, h:WW-2580});

  // RIGHT side vertical barrier
  walls.push({x:WW-900-T, y:0,    w:T, h:380});
  walls.push({x:WW-900-T, y:780,  w:T, h:480});
  walls.push({x:WW-900-T, y:1780, w:T, h:380});
  walls.push({x:WW-900-T, y:2580, w:T, h:WW-2580});

  // CENTER long horizontal thick walls creating 3 fighting lanes
  // top lane separator
  walls.push({x:900+T, y:700, w:WW-1800-T*2, h:T});
  // bottom lane separator  
  walls.push({x:900+T, y:2000, w:WW-1800-T*2, h:T});

  // middle vertical stubs for cover (not full barriers — bots can go around)
  walls.push({x:cx-T/2, y:900,  w:T, h:280});
  walls.push({x:cx-T/2, y:1600, w:T, h:280});

  // small side cover blocks in hall
  walls.push({x:1300, y:1100, w:180, h:T});
  walls.push({x:WW-1480, y:1100, w:180, h:T});
  walls.push({x:1300, y:1700, w:180, h:T});
  walls.push({x:WW-1480, y:1700, w:180, h:T});
}
function wallHit(x,y,r){
  for(const w of walls){const nx=cl(x,w.x,w.x+w.w),ny=cl(y,w.y,w.y+w.h);if(hyp(x-nx,y-ny)<r)return{nx,ny,w}}
  return null;
}
function resolveWall(t){
  const hit=wallHit(t.x,t.y,rad(t));if(!hit)return;
  const dx=t.x-hit.nx,dy=t.y-hit.ny,d=hyp(dx,dy)||1;
  t.x=hit.nx+dx/d*(rad(t)+2);t.y=hit.ny+dy/d*(rad(t)+2);t.vx*=.2;t.vy*=.2;
}
/* simple steering around walls for bots */
function steerAround(b,tx,ty){
  const ang=Math.atan2(ty-b.y,tx-b.x);
  // probe ahead
  const look=90;
  const fx=b.x+Math.cos(ang)*look, fy=b.y+Math.sin(ang)*look;
  if(!wallHit(fx,fy,rad(b)+8))return ang;
  // try left and right offsets
  for(const off of [0.7,-0.7,1.3,-1.3,1.9,-1.9]){
    const a2=ang+off;
    const px=b.x+Math.cos(a2)*look, py=b.y+Math.sin(a2)*look;
    if(!wallHit(px,py,rad(b)+8))return a2;
  }
  return ang+1.2; // last resort spin
}

function spawnBases(){
  bases=[
    {x:320,y:WW/2,r:85,team:0,hp:3200,mh:3200,cd:0,col:teamCols[0][0]},
    {x:WW-320,y:WW/2,r:85,team:1,hp:3200,mh:3200,cd:0,col:teamCols[1][0]}
  ];
}

/* combat */
function fire(t){
  if(t.heat>=1){t.cd=280;return}
  const guns=t.bossGuns||T[t.k].b,m=M(t),s=sz(t),n=guns.length;
  const bs=m.alt?[guns[t.bi++%n]]:guns,r=rad(t);
  if(m.trap){
    for(const b of bs){
      const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.5*s),ty=t.y+Math.sin(a)*(r+b.l*.5*s);
      const life=5.2*(m.trapLife||1);
      traps.push({x:tx,y:ty,vx:Math.cos(a)*(190+t.st.bspd*12),vy:Math.sin(a)*(190+t.st.bspd*12),r:12*(m.trapSize||1)*s,rot:rr(0,TAU),spin:8+rr(0,4),life,maxLife:life,o:t,team:t.team,col:t.col,settled:0,hp:20*(m.trapSize||1),mh:20*(m.trapSize||1)});
      spark(tx,ty,3,[t.col,'#fff'],30,100,.9,2,.06,.14);
    }
  } else if(m.missile){
    for(const b of bs){
      const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.52*s),ty=t.y+Math.sin(a)*(r+b.l*.52*s);
      if(m.swarm){for(let i=-1;i<=1;i++)msl.push({x:tx,y:ty,ang:a+i*.18,spd:bspd(t)*.65,l:1.8,o:t,r:7*s,lock:0,spin:0,auto:0,swarm:1,c:t.col,emit:0,flame:0,spinA:0,gCd:0})}
      else msl.push({x:tx,y:ty,ang:a,spd:bspd(t)*.72,l:2.2,o:t,r:10*s,lock:!!m.lock,spin:!!m.spin,auto:!!m.auto,swarm:0,c:t.col,emit:0,flame:0,spinA:0,gCd:0});
      spark(tx,ty,2,['#fff2ae','#ffd34d'],35,120,.9,2,.05,.12);
    }
  } else {
    for(const b of bs){
      const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.55*s)-Math.sin(t.ang)*(b.o||0)*s,ty=t.y+Math.sin(a)*(r+b.l*.55*s)+Math.cos(t.ang)*(b.o||0)*s;
      for(let i=0;i<1+(m.pel||0);i++){
        const aa=a+(m.spr?(R()-.5)*m.spr:0),sp=bspd(t)*(m.pel?rr(.75,1.2):1);
        bl.push({x:tx,y:ty,px:tx,py:ty,vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp,r:(6.2+t.st.bdmg*.36)*(m.siz||1)*s*(m.pel?.85:1),dm:dmgOf(t),o:t,l:1.25*(m.life||1),c:t.pl?'#00e0ff':t.col,team:t.team});
      }
      spark(tx,ty,2,['#fff2ae','#ffd34d'],28,100,.8,1.8,.05,.12);
    }
  }
  const heatGain=(m.heat||0)*0.06*(m.pel?1.3:1);
  if(heatGain>0)t.heat=Math.min(1.15,t.heat+heatGain);
  const k=(m.rc||1)*120*(.5+Math.min(2,m.dmg||1)*.18)*(m.pel?1.2:1)*(bs.length>1?1.08:1);
  t.vx-=Math.cos(t.ang)*k;t.vy-=Math.sin(t.ang)*k;t.rc=Math.min(14,t.rc+k*.07);
  if(t.pl){shake=Math.min(11,shake+k*.02);cam.kx-=Math.cos(t.ang)*k*.035;cam.ky-=Math.sin(t.ang)*k*.035}
  t.cd=relOf(t)/(m.alt?n:1);
}
function explodeMs(ms){
  if(ms.spin||ms.auto){spark(ms.x,ms.y,5,[ms.c,'#fff'],22,90,1,2.2,.1,.28);return}

function ai(b,dt,all){

    b.blockCd-=dt;
    if(!b.blockSpot||b.blockCd<=0){
      // openings in the vertical walls
      const spots=b.team===0
        ?[[950,550],[950,1500],[950,2350],[1200,WW/2]]

    } else {

    return;

  for(let i=bl.length-1;i>=0;i--){const b=bl[i];b.px=b.x;b.py=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;let hit=0;
    if(b.l<=0||b.x<-10||b.x>WW+10||b.y<-10||b.y>WW+10){bl.splice(i,1);continue}
    if(MODE==='bd'&&wallHit(b.x,b.y,b.r)){spark(b.x,b.y,1,['#fff',b.c],10,40,.5,1.3,.03,.08);bl.splice(i,1);continue}
    for(const s of sh)if(!s.dead&&hyp(b.x-s.x,b.y-s.y)<b.r+s.r){hurtShape(s,b.dm,b.o);hit=1;break}
    if(!hit)for(let ti=traps.length-1;ti>=0;ti--){const tr=traps[ti];if(hyp(b.x-tr.x,b.y-tr.y)<b.r+tr.r){tr.hp-=b.dm;hit=1;if(tr.hp<=0){spark(tr.x,tr.y,4,[tr.col,'#fff'],20,70,.9,2.2,.1,.25);traps.splice(ti,1)}break}}
    if(!hit&&MODE==='bd')for(const base of bases)if(base.team!==(b.team??b.o?.team)&&hyp(b.x-base.x,b.y-base.y)<b.r+base.r){damageBase(base,b.dm,b.o);hit=1;break}
    if(!hit)for(const t of all){if(t===b.o||t.dead)continue;if(MODE==='bd'&&t.team===(b.team??b.o?.team))continue;if(hyp(b.x-t.x,b.y-t.y)<b.r+rad(t)){hurt(t,b.dm,b.o);hit=1;if(t.pl)shake=Math.min(9,shake+1.1);break}}
    if(hit){spark(b.x,b.y,1,['#fff',b.c],12,50,.5,1.4,.03,.1);bl.splice(i,1)}}

  /* body coll */
  for(let i=0;i<all.length;i++){const a=all[i],ra=rad(a);
    for(let j=i+1;j<all.length;j++){const c=all[j];if(MODE==='bd'&&a.team!=null&&a.team===c.team)continue;const m=ra+rad(c),dx=a.x-c.x,dy=a.y-c.y,d=hyp(dx,dy)||1;if(d<m){const o=(m-d)/2;a.x+=dx/d*o;a.y+=dy/d*o;c.x-=dx/d*o;c.y-=dy/d*o;hurt(a,bodyOf(c)*dt*2.5,c);hurt(c,bodyOf(a)*dt*2.5,a)}}
    for(const s of sh){if(s.dead)continue;const m=ra+s.r,dx=a.x-s.x,dy=a.y-s.y,d=hyp(dx,dy)||1;if(d<m){a.x+=dx/d*(m-d);a.y+=dy/d*(m-d);hurtShape(s,bodyOf(a)*dt*2.5,a);hurt(a,s.bd*dt*2,null)}}
    if(MODE==='bd')for(const base of bases){if(base.team===a.team)continue;const m=ra+base.r,dx=a.x-base.x,dy=a.y-base.y,d=hyp(dx,dy)||1;if(d<m){a.x+=dx/d*(m-d);a.y+=dy/d*(m-d);hurt(a,6*dt,null);damageBase(base,bodyOf(a)*dt*1.6,a)}}}

  sh=sh.filter(s=>!s.dead);bt=bt.filter(b=>!b.dead);
  for(const s of sh){s.rot+=s.sp*dt;s.fl=Math.max(0,s.fl-dt);s.sp0=Math.min(1,s.sp0+dt*2)}
}
function fxUpdate(dt){shake=Math.max(0,shake-dt*15);cam.kx*=Math.pow(.0003,dt);cam.ky*=Math.pow(.0003,dt);
 for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.05,dt);p.vy*=Math.pow(.05,dt);p.vy-=16*dt;if((p.l-=dt)<=0)pt.splice(i,1)}
 for(let i=rg.length-1;i>=0;i--){const r=rg[i];r.l-=dt;r.r=r.mr*(1-Math.pow(r.l/r.m,2));if(r.l<=0)rg.splice(i,1)}
 for(let i=ft.length-1;i>=0;i--){const f=ft[i];f.y-=38*dt;if((f.l-=dt)<=0)ft.splice(i,1)}}

/* draw */
function body(c,k,col,r,ang,rc,s,fl,heat){
  c.save();c.rotate(ang);c.lineJoin='round';const guns=T[k]?T[k].b:[];
  for(const b of guns){c.save();c.rotate(b.a||0);const ht=heat||0;
    if(b.trapGun){
      c.fillStyle=ht>.5?`rgb(${155+ht*90|0},${55-ht*35|0},${12})`:'#b0a0a8';c.strokeStyle='#0009';c.lineWidth=2;
      const bl=b.l*s,bw=b.w*s;
      c.beginPath();c.moveTo(r*.32,-bw*.32);c.lineTo(r*.32+bl*.5,-bw*.48);c.lineTo(r*.32+bl,-bw*.22);c.lineTo(r*.32+bl,bw*.22);c.lineTo(r*.32+bl*.5,bw*.48);c.lineTo(r*.32,bw*.32);c.closePath();c.fill();c.stroke();
      c.translate(r*.32+bl*.88,0);c.beginPath();for(let i=0;i<8;i++){const a=i/8*TAU-1.57,rr=i%2?bw*.2:bw*.38;i?c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):c.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fillStyle=col;c.fill();c.stroke();
    } else {
      c.fillStyle=ht>.5?`rgb(${150+ht*95|0},${60-ht*40|0},${15})`:'#999';c.strokeStyle='#0008';c.lineWidth=2;
      c.beginPath();c.rect(r*.42-b.l*s*.3-rc,(b.o||0)*s-b.w*s/2,b.l*s,b.w*s);c.fill();c.stroke();
    }
    c.restore()}
  c.beginPath();c.arc(0,0,r,0,TAU);c.fillStyle=fl>0?'#fff':col;c.strokeStyle='#0008';c.lineWidth=2.8;c.fill();c.stroke();c.restore()}
const on=(x,y,m)=>Math.abs(x-cam.x)<W/2/cam.z+m&&Math.abs(y-cam.y)<H/2/cam.z+m;
function draw(tnow){now=tnow;
  const tz=P?1/(1+(sz(P)-1)*.42):1;cam.z+=(tz-cam.z)*.07;
  if(P&&!P.dead){cam.x+=(P.x-cam.x)*.14;cam.y+=(P.y-cam.y)*.14}else if(!P){cam.x=WW/2;cam.y=WW/2}
  X.setTransform(1,0,0,1,0,0);X.fillStyle='#9a9a9a';X.fillRect(0,0,W,H);
  const sx=shake?rr(-shake,shake):0,sy=shake?rr(-shake,shake):0;
  X.setTransform(cam.z,0,0,cam.z,W/2-(cam.x+cam.kx)*cam.z+sx,H/2-(cam.y+cam.ky)*cam.z+sy);
  const l=cam.x-W/2/cam.z-50,r=cam.x+W/2/cam.z+50,t=cam.y-H/2/cam.z-50,b=cam.y+H/2/cam.z+50;
  X.fillStyle='#b0b0b0';X.fillRect(0,0,WW,WW);X.lineWidth=1;X.strokeStyle='#00000010';X.beginPath();
  for(let x=Math.max(0,Math.floor(l/45)*45);x<Math.min(WW,r);x+=45){X.moveTo(x,Math.max(0,t));X.lineTo(x,Math.min(WW,b))}
  for(let y=Math.max(0,Math.floor(t/45)*45);y<Math.min(WW,b);y+=45){X.moveTo(Math.max(0,l),y);X.lineTo(Math.min(WW,r),y)}X.stroke();
  X.strokeStyle='#111';X.lineWidth=10;X.strokeRect(0,0,WW,WW);
  // thick maze walls
  if(MODE==='bd'){X.fillStyle='#3d3d3d';X.strokeStyle='#222';X.lineWidth=3;for(const w of walls){if(w.x+w.w<l-5||w.x>r+5||w.y+w.h<t-5||w.y>b+5)continue;X.fillRect(w.x,w.y,w.w,w.h);X.strokeRect(w.x,w.y,w.w,w.h)}}
  // bases
  if(MODE==='bd')for(const base of bases){if(!on(base.x,base.y,120))continue;
    X.beginPath();X.arc(base.x,base.y,base.r+12,0,TAU);X.fillStyle=base.col+'28';X.fill();
    X.beginPath();X.arc(base.x,base.y,base.r,0,TAU);X.fillStyle=base.col;X.strokeStyle='#000a';X.lineWidth=4;X.fill();X.stroke();
    X.beginPath();X.arc(base.x,base.y,base.r*.35,0,TAU);X.fillStyle='#111';X.fill();
    X.fillStyle='#0008';X.fillRect(base.x-40,base.y-base.r-16,80,5);X.fillStyle='#fff';X.fillRect(base.x-40,base.y-base.r-16,80*(base.hp/base.mh),5);
    X.fillStyle='#fff';X.font='bold 10px Arial';X.textAlign='center';X.fillText(teamName(base.team),base.x,base.y-base.r-20);
    X.fillStyle=base.col;X.font='9px Arial';X.fillText(Math.ceil(base.hp)+' HP',base.x,base.y+3)}
  // traps
  for(const tr of traps){if(!on(tr.x,tr.y,30))continue;const lifeA=Math.min(1,tr.life/tr.maxLife);X.save();X.translate(tr.x,tr.y);X.rotate(tr.rot);
    X.globalAlpha=(tr.settled?.88:.5)*lifeA;X.beginPath();for(let i=0;i<10;i++){const a=i/10*TAU-1.57,rr=i%2?tr.r*.36:tr.r;i?X.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):X.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}X.closePath();
    X.fillStyle=tr.col;X.strokeStyle='#0008';X.lineWidth=1.6;X.fill();X.stroke();X.globalAlpha=1;X.restore()}
  for(const o of pu){if(!on(o.x,o.y,28))continue;const rd=10+Math.sin(tnow/280+o.x)*1.5;X.beginPath();X.arc(o.x,o.y,rd,0,TAU);X.fillStyle=PU[o.k][0];X.fill();X.fillStyle='#fff';X.font='bold 11px Arial';X.textAlign='center';X.fillText(PU[o.k][1],o.x,o.y+3.5)}
  for(const s of sh){if(!on(s.x,s.y,45))continue;const sc=.3+.7*s.sp0;X.save();X.translate(s.x,s.y);X.rotate(s.rot);X.scale(sc,sc);X.beginPath();for(let i=0;i<s.sides;i++){const a=i/s.sides*TAU-1.57;i?X.lineTo(Math.cos(a)*s.r,Math.sin(a)*s.r):X.moveTo(Math.cos(a)*s.r,Math.sin(a)*s.r)}X.closePath();X.fillStyle=s.fl>0?'#fff':s.col;X.strokeStyle='#0008';X.lineWidth=2;X.fill();X.stroke();X.restore()}
  for(const m of msl){if(!on(m.x,m.y,35))continue;X.beginPath();X.arc(m.x,m.y,m.r,0,TAU);X.fillStyle=m.c;X.strokeStyle='#0008';X.lineWidth=1.6;X.fill();X.stroke()}
  for(const q of bl){if(!on(q.x,q.y,28))continue;X.globalAlpha=Math.min(1,q.l/.16);X.beginPath();X.arc(q.x,q.y,q.r,0,TAU);X.fillStyle=q.c;X.fill();X.globalAlpha=1}
  // TANKS with HP bars
  const allT=P&&!P.dead?[...bt,P]:bt;
  for(const o of allT){if(!on(o.x,o.y,120))continue;const rd=rad(o),s=sz(o),sc=.45+.55*Math.min(1,o.spawn||1);
    X.save();X.translate(o.x,o.y);X.scale(sc,sc);body(X,o.k,o.col,rd,o.ang,o.rc,s,o.fl,o.heat);X.restore();
    if(o.heat>.4){X.beginPath();X.arc(o.x,o.y,rd+4+o.heat*3,0,TAU);X.strokeStyle=`rgba(255,${45-o.heat*30|0},0,${.2+o.heat*.3})`;X.lineWidth=1.5+o.heat*2;X.stroke()}
    if(o.bf.shield>0){X.beginPath();X.arc(o.x,o.y,rd+5,0,TAU);X.strokeStyle='rgba(77,184,255,.48)';X.lineWidth=2.2;X.stroke()}
    // name
    X.textAlign='center';X.fillStyle=MODE==='bd'?o.col:'#fff';X.font='bold 9px Arial';
    X.fillText(o.pl?'You':o.name+' · '+(T[o.k]?T[o.k].n:''),o.x,o.y-rd-14);
    // HP BAR (always visible)
    const barW=42,barH=4;
    X.fillStyle='#0009';X.fillRect(o.x-barW/2,o.y-rd-10,barW,barH);
    X.fillStyle='#ffffff44';X.fillRect(o.x-barW/2,o.y-rd-10,barW*Math.max(0,o.hpv/mx(o)),barH);
    X.fillStyle=o.hp/mx(o)<.3?'#e0453f':'#8abc3f';X.fillRect(o.x-barW/2,o.y-rd-10,barW*Math.max(0,o.hp/mx(o)),barH)}
  for(const p of pt){X.globalAlpha=Math.max(0,p.l/p.m);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.s,0,TAU);X.fill()}X.globalAlpha=1;
  for(const g of rg){X.globalAlpha=Math.max(0,g.l/g.m)*.6;X.strokeStyle=g.c;X.lineWidth=2.5*(g.l/g.m)+1;X.beginPath();X.arc(g.x,g.y,g.r,0,TAU);X.stroke()}X.globalAlpha=1;
  for(const f of ft){X.globalAlpha=Math.max(0,f.l/.8);X.fillStyle=f.c;X.font='bold '+f.s+'px Arial';X.textAlign='center';X.fillText(f.t,f.x,f.y)}X.globalAlpha=1;
  X.setTransform(1,0,0,1,0,0);mini()}
function mini(){const z=120,x0=W-z-8,y0=H-z-8,k=z/WW;X.fillStyle='#0008';X.fillRect(x0,y0,z,z);X.strokeStyle='#111';X.lineWidth=1.5;X.strokeRect(x0,y0,z,z);
  if(MODE==='bd'){for(const w of walls){X.fillStyle='#444';X.fillRect(x0+w.x*k,y0+w.y*k,Math.max(1.5,w.w*k),Math.max(1.5,w.h*k))}
    for(const b of bases){X.fillStyle=b.col;X.beginPath();X.arc(x0+b.x*k,y0+b.y*k,4.5,0,TAU);X.fill()}}
  for(const b of bt){X.fillStyle=b.col;X.fillRect(x0+b.x*k-1.2,y0+b.y*k-1.2,2.4,2.4)}
  if(P&&!P.dead){X.fillStyle='#fff';X.fillRect(x0+P.x*k-2,y0+P.y*k-2,4,4)}}

/* hud */
const fs=s=>s>=1e6?(s/1e6).toFixed(1)+'M':s>=1e3?(s/1e3).toFixed(1)+'k':''+(s|0);
function buildUps(){const b=$('ups');b.innerHTML='';S.forEach((s,i)=>{const d=document.createElement('div');d.className='u';d.id='u'+i;d.onclick=()=>spend(i);b.appendChild(d)})}
function hudUps(){if(!P)return;S.forEach((s,i)=>{const d=$('u'+i),v=P.st[s[0]];if(d){d.innerHTML='<span style="color:#ffd34d">['+(i+1)+']</span> <b>'+s[1]+'</b><br><span style="color:#8abc3f">'+'●'.repeat(v)+'○'.repeat(8-v)+'</span>';d.style.opacity=P.pts>0&&v<8?1:.48}})}
function spend(i){if(!P||state!=='play'||P.pts<=0||P.st[S[i][0]]>=8)return;P.pts--;P.st[S[i][0]]++;if(i===1)P.hp+=16;hudUps()}
function hud(){if(!P)return;$('xp').style.width=(P.xp/need(P.lv)*100)+'%';$('lv').textContent='Lv '+P.lv+(P.pts?' · '+P.pts+' pts':'');$('sc').textContent='Score: '+fs(P.sc);
  $('cn').textContent=(T[P.k]?T[P.k].n:'?')+(MODE==='bd'?' · '+teamName(P.team):'');
  const b=[];if(P.bf.rapid>0)b.push('⚡'+P.bf.rapid.toFixed(1));if(P.bf.shield>0)b.push('◈'+P.bf.shield.toFixed(1));
  if(P.heat>.2)b.push(P.heat>=1?'🔥 OVERHEAT':'♨ '+(P.heat*100|0)+'%');
  if(autoSpin)b.push('🔄 SPIN');
  b.push(P.dash>0?'DASH '+P.dash.toFixed(1):'DASH');$('bf').textContent=b.join(' · ');
  $('vg').classList.toggle('l',!P.dead&&P.hp/mx(P)<.28);hudUps()}
function lbd(){const l=[];if(P&&!P.dead)l.push({n:'You',s:P.sc,c:T[P.k]?T[P.k].n:'?',y:1,col:P.col});for(const b of bt)l.push({n:b.name,s:b.sc,c:T[b.k]?T[b.k].n:'?',col:b.col});l.sort((a,b)=>b.s-a.s);
  $('lb').innerHTML='<div style="text-align:center;color:#ffd34d;font-weight:700;margin-bottom:2px">LEADERBOARD</div>'+l.slice(0,10).map((r,i)=>'<div style="display:flex;gap:2px;padding:1px 0;'+(r.y?'font-weight:700':'')+'"><span style="width:12px;color:#aaa">'+(i+1)+'</span><span style="flex:1;color:'+(r.col||'#fff')+'">'+r.n+'</span><span style="color:#ffd34d;width:36px;text-align:right">'+fs(r.s)+'</span></div>').join('')}

/* input */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==='tab'||k===' ')e.preventDefault();
  if(k==='`'){DBG=!DBG;$('dbg').textContent=DBG?'DEBUG Shift+L/U/H/K':''}
  if(k==='tab')$('lb').style.display=$('lb').style.display==='none'?'':'none';
  if(k==='e')auto=!auto;if(k==='q')autoSpin=!autoSpin;
  const n=parseInt(e.key);
  if(cur&&(state==='menu'||state==='pick')&&n>=1&&n<=cur.items.length){cur.cb(cur.items[n-1]);return}
  if(e.key==='Enter'&&state==='dead'&&cur){cur.cb(cur.items[0]);return}
  if(state!=='play'||!P)return;
  if(n>=1&&n<=7)spend(n-1);
  if(k===' '&&P.dash<=0){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(!dx&&!dy){dx=Math.cos(P.ang);dy=Math.sin(P.ang)}const l=hyp(dx,dy);P.vx+=dx/l*850;P.vy+=dy/l*850;P.dash=3.6;spark(P.x,P.y,8,['#fff',P.col],35,140,1.2,2.8,.1,.28);ring(P.x,P.y,38,'#fff',.16)}
  if(DBG&&e.shiftKey){if(k==='l')for(let i=0;i<5;i++)addXp(P,need(P.lv));if(k==='u')P.pts+=5;if(k==='h')P.hp=mx(P);
    if(k==='k')for(const b of bt)if(hyp(b.x-P.x,b.y-P.y)<500)hurt(b,99999,P)}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
C.addEventListener('mousemove',e=>{ms.x=e.clientX;ms.y=e.clientY});C.addEventListener('mousedown',()=>ms.d=1);addEventListener('mouseup',()=>ms.d=0);C.addEventListener('contextmenu',e=>e.preventDefault());

/* boot */
for(let i=0;i<50;i++)spawnShape();for(let i=0;i<10;i++)spawnBot();
let last=performance.now();
function loop(tnow){const dt=Math.min(.05,(tnow-last)/1000);last=tnow;
  if(state==='play')update(dt);fxUpdate(dt);draw(tnow);hud();lbT+=dt;if(lbT>.5){lbT=0;lbd()}requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
