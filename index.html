function pickRarity(c){if(forceR!==null&&forceR<(c.hi||10)){const f=forceR;forceR=null;return f}const hi=c.hi||10,b=boost>0?1.25:1;const W=R.map((r,i)=>r[2]*Math.pow(c.l*b,i)).slice(0,hi);let lo=(pity>=14&&!c.cd)?4:0;const T=W.slice(lo).reduce((a,b)=>a+b,0);let x=Math.random()*T;for(let i=lo;i<hi;i++){if(x<W[i])return i;x-=W[i]}return lo}

 $('ovb').style.display='flex';
 const flip=el=>{if(el.classList.contains('f'))return;el.classList.add('f');const x=res[el.dataset.n];tone(300+x.r*90,.3);setTimeout(()=>fx(x.r,el),320)};

 res.forEach(x=>{inv.push({id:Date.now()+Math.random(),s:x.i.s,n:x.i.n,r:x.r,sn:x.sn,vr:x.vr,v:x.v});seen[x.i.s]=1});stats()};

const P=["Nova","Kairo","Blitz","Mira","Zed","Lux","Orion","Vex","Juno","Ash"];
setInterval(()=>{const c=CR[1+Math.floor(Math.random()*(CR.length-1))],r=Math.random()<.7?5+Math.floor(Math.random()*3):8,p=c.it.filter(i=>i.r===r&&!i.t)[0]||c.it[0],f=$('feed');f.style.opacity=0;setTimeout(()=>{f.innerHTML=`<span style="color:${R[p.r][1]}">●</span> ${P[Math.floor(Math.random()*10)]} unboxed ${p.e} ${p.n} <i>(simulated)</i>`;f.style.opacity=1},400)},6000);

$('bTrade').onclick=()=>{$('m1t').textContent='Trade-up: 5 items → 1 of the next rarity (limited excluded)';const g=$('m1g');g.innerHTML='';

 $('m1').classList.add('on')};

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

async function shine(mx){const c=R[mx][1],w=document.createElement('div'),s=document.createElement('div');w.className='shw';s.className='shine';w.style.setProperty('--c',c);w.appendChild(s);$('ov').insertBefore(w,$('ov').firstChild);document.querySelectorAll('.oc').forEach(o=>o.style.filter=`drop-shadow(0 0 32px ${c}) drop-shadow(0 0 10px ${c})`);requestAnimationFrame(()=>s.style.opacity=.9);
 for(let k=0;k<=mx;k++){tone(200*Math.pow(1.1,k*2),.3,'triangle');await sl(150)}flash(c,.5);tone(110,.7,'sawtooth',.12);if(mx>=5)tone(880,1,'sine',.1);await sl(800+mx*130);s.style.opacity=0;setTimeout(()=>w.remove(),700)}
function burst(el,c,n,d){const b=el.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;for(let i=0;i<n;i++){const p=document.createElement('i'),a=Math.random()*6.28,k=d*(.4+Math.random()),z=4+Math.random()*6;p.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:${z}px;height:${z}px;border-radius:50%;background:${c};box-shadow:0 0 10px ${c};z-index:130;pointer-events:none`;document.body.appendChild(p);p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*k}px,${Math.sin(a)*k}px) scale(.2)`,opacity:0}],{duration:700+Math.random()*700,easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish=()=>p.remove()}}
function ring(el,c,sc){const b=el.getBoundingClientRect(),r=document.createElement('div');r.style.cssText=`position:fixed;left:${b.left+b.width/2-50}px;top:${b.top+b.height/2-50}px;width:100px;height:100px;border:5px solid ${c};border-radius:50%;box-shadow:0 0 30px ${c};z-index:130;pointer-events:none`;document.body.appendChild(r);r.animate([{transform:'scale(.2)',opacity:1},{transform:`scale(${sc})`,opacity:0}],{duration:900,easing:'ease-out'}).onfinish=()=>r.remove()}
