<script>

const R=Math.random,rr=(a,b)=>a+R()*(b-a),pick=a=>a[R()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v)),hyp=Math.hypot,TAU=6.2832;

/* ---------- classes ---------- */

const T={

scatter:D('Scatter','#ffcf5c',28,'Huge cloud.',[{l:46,w:30}],{rel:2,dmg:.5,siz:.6,life:.5,pel:11,spr:.8,rc:2.2}),
minigun:D('Minigun','#3fe08a',28,'Insane rate.',[{l:40,w:28}],{rel:.28,dmg:.4,siz:.55,spr:.45,rc:.8,heat:2.5}),
lockon:D('Lock-On','#d48cff',27,'Aim-assist missiles.',[{l:54,w:26}],{missile:1,lock:1,rel:3.6,rc:1.8}),
swarm:D('Swarm','#a66bff',28,'Missile fan.',[{l:48,w:28}],{missile:1,swarm:1,rel:4.0,rc:1.9}),

auto:D('Auto Missile','#e0a0ff',28,'Missile+minigun.',[{l:52,w:24}],{missile:1,auto:1,rel:3.5,rc:1.7}),
megaTrap:D('Mega Trapper','#f0b0d0',29,'Bigger lasting traps.',[{l:32,w:30,trapGun:1}],{trap:1,trapSize:1.45,trapLife:1.4,rel:1.85,rc:1.15}),
hexaTrap:D('Hexa Trapper','#d888b0',28,'Six trap launchers.',[
  {l:26,w:18,a:0,trapGun:1},{l:26,w:18,a:1.047,trapGun:1},{l:26,w:18,a:2.094,trapGun:1},
  {l:26,w:18,a:Math.PI,trapGun:1},{l:26,w:18,a:-2.094,trapGun:1},{l:26,w:18,a:-1.047,trapGun:1}
],{trap:1,rel:2.1,rc:1.05})
};
const STARTERS=['basic','twin','sniper','pounder','flank','shotgun','missile','trapper'];
const S=[['regen','Regen'],['hp','Max HP'],['body','Body'],['bspd','B.Spd'],['bdmg','B.Dmg'],['rel','Reload'],['mov','Speed']];
const PS={aggr:{pd:130,ap:1.35,rt:0,rg:620,st:.55},snip:{pd:460,ap:.4,rt:-1.15,rg:820,st:.75},flnk:{pd:220,ap:1.1,rt:-.5,rg:560,st:1.35},tank:{pd:80,ap:1.45,rt:.4,rg:480,st:.35},trapper:{pd:280,ap:.6,rt:-.3,rg:500,st:.8,block:1}};
const NAMES=['Vortex','Blitz','Nova','Rusty','Havoc','Mochi','Zeta','Gunner','Pixel','Tango','Ghost','Bolt','Comet','Sarge','Echo','Rook'];
const TEAM_PAL=[['#3b82f6','#60a5fa'],['#22c55e','#4ade80'],['#ef4444','#f87171'],['#a855f7','#c084fc'],['#f59e0b','#fbbf24'],['#06b6d4','#22d3ee']];
const SHT=[['sq',4,22,26,8,'#ffe763',5],['tr',3,20,55,18,'#fc7677',7],['pe',5,30,180,100,'#768cfc',12],['hx',6,36,400,250,'#c77dff',20]];
const PU={heal:['#58e06a','+'],rapid:['#ffd34d','»'],shield:['#4db8ff','◈']};
const BOSSES=[
  {name:'Ironclad',col:'#ff3b5c',shape:'hex',r:48,drones:5,guns:[{l:44,w:14},{l:34,w:11,a:.9},{l:34,w:11,a:-.9},{l:32,w:10,a:2.4},{l:32,w:10,a:-2.4}],m:{rel:1.2,dmg:1.15,rc:1.4}},
  {name:'Behemoth',col:'#c0392b',shape:'oct',r:54,drones:7,guns:[{l:42,w:16},{l:36,w:12,a:.75},{l:36,w:12,a:-.75},{l:34,w:11,a:1.7},{l:34,w:11,a:-1.7},{l:32,w:11,a:Math.PI}],m:{rel:1.45,dmg:1.4,siz:1.1,rc:1.8}}
];

/* ---------- state ---------- */
let MODE='ffa', state='menu', P=null, cur=null, shake=0, DBG=false, auto=false, autoSpin=false, bossT=45, streak=0, streakT=0, lbT=0;
let teamCols=null, teamWin=null;
const cam={x:WW/2,y:WW/2,z:1,kx:0,ky:0}, keys={}, ms={x:0,y:0,d:0};
let bl=[], msl=[], sh=[], bt=[], pt=[], rg=[], ft=[], pu=[], nests=[], drones=[], traps=[], walls=[], bases=[];

/* ---------- math ---------- */
const sz=t=>1+Math.min(1.5,Math.pow(Math.max(0,t.sc)/100000,.45));
const rad=t=>(t.bossR||T[t.k]?.r||30)*sz(t);
const M=t=>t.bossM||T[t.k]?.m||{};
const mx=t=>(100+t.st.hp*22)*(.85+sz(t)*.15)*(t.boss?3.5:1);
const dmgOf=t=>(8+t.st.bdmg*4.4)*(M(t).dmg||1)*(.9+sz(t)*.1);
const relOf=t=>Math.max(85,530*Math.pow(.89,t.st.rel)*(M(t).rel||1)*(t.bf.rapid>0?.62:1));
const bspd=t=>(360+t.st.bspd*26)*(M(t).spd||1);
const movOf=t=>(150+t.st.mov*11)/Math.pow(sz(t),.15);
const bodyOf=t=>(9+t.st.body*4.3)*(.9+sz(t)*.12);
const need=l=>Math.round(15*Math.pow(l,1.68));
function mk(x,y,k,pl,team){
  const st={};S.forEach(s=>st[s[0]]=0);
  const col=team!=null&&teamCols?teamCols[team][0]:(pl?T[k].c:pick(['#f14e54','#e67e22','#9b59b6','#3498db','#1abc9c']));
  // trapper bots get trapper personality
  const isTrap=k==='trapper'||k==='megaTrap'||k==='hexaTrap';
  return{x,y,vx:0,vy:0,ang:rr(0,TAU),k,pl,team:team!=null?team:null,col,st,hp:100,hpv:100,lv:1,xp:0,sc:0,pts:0,cd:0,rc:0,fl:0,bi:0,bf:{rapid:0,shield:0},dash:0,name:pl?'You':pick(NAMES),ps:isTrap?'trapper':pick(Object.keys(PS)),dead:0,ai:0,aim:rr(0,TAU),sd:R()<.5?1:-1,heat:0,spawn:0,blockCd:0,blockSpot:null};
}

/* ---------- fx ---------- */
function spark(x,y,n,cols,s0,s1,z0,z1,l0,l1){for(let i=0;i<n;i++){const a=rr(0,TAU),s=rr(s0,s1),l=rr(l0,l1);pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l,m:l,c:pick(cols),s:rr(z0,z1)})}if(pt.length>1000)pt.splice(0,pt.length-1000)}
const ring=(x,y,mr,c,l)=>rg.push({x,y,r:0,mr,l:l||.4,m:l||.4,c});
const flt=(x,y,t,c,s)=>{if(ft.length<70)ft.push({x,y,t,c,s:s||12,l:.85})};
function ban(t,c){const b=$('ban');b.textContent=t;b.style.color=c||'#fff';b.classList.remove('s');void b.offsetWidth;b.classList.add('s')}

/* ---------- denser maze ---------- */
function buildMaze(){
  walls=[];
  const cx=WW/2, t=42;
  // thick central wall with 3 staggered openings
  const gaps=[[cx-320,cx-140],[cx-40,cx+140],[cx+200,cx+380]];
  let y=0;
  const segs=[[0,cx-320],[cx-140,cx-40],[cx+140,cx+200],[cx+380,WW]];
  for(const [a,b] of segs)walls.push({x:cx-t/2,y:a,w:t,h:b-a});
  // many cross walls creating corridors
  const rows=[700,1200,1700,2200,2700,3200,3700,4200];
  for(const ry of rows){
    // left side corridors
    walls.push({x:200,y:ry,w:700,h:t});
    walls.push({x:1100,y:ry+80,w:500,h:t});
    walls.push({x:200,y:ry+400,w:400,h:t});
    // right side
    walls.push({x:WW-900,y:ry,w:700,h:t});
    walls.push({x:WW-1600,y:ry+80,w:500,h:t});
    walls.push({x:WW-600,y:ry+400,w:400,h:t});
  }
  // vertical blockers creating chokepoints
  const cols=[900,1500,WW-1500,WW-900];
  for(const cx2 of cols){
    walls.push({x:cx2,y:400,w:t,h:600});
    walls.push({x:cx2,y:1600,w:t,h:500});
    walls.push({x:cx2,y:2800,w:t,h:500});
    walls.push({x:cx2,y:4000,w:t,h:600});
  }
  // angled-feel blocks near center openings
  walls.push({x:cx-600,y:cx-500,w:280,h:t});
  walls.push({x:cx+320,y:cx-500,w:280,h:t});
  walls.push({x:cx-600,y:cx+450,w:280,h:t});
  walls.push({x:cx+320,y:cx+450,w:280,h:t});
  walls.push({x:cx-450,y:cx-250,w:t,h:200});
  walls.push({x:cx+410,y:cx-250,w:t,h:200});
  walls.push({x:cx-450,y:cx+50,w:t,h:200});
  walls.push({x:cx+410,y:cx+50,w:t,h:200});
}
function wallHit(x,y,r){
  for(const w of walls){const nx=cl(x,w.x,w.x+w.w),ny=cl(y,w.y,w.y+w.h);if(hyp(x-nx,y-ny)<r)return{nx,ny,w}}
  return null;
}
function resolveWall(t){
  const hit=wallHit(t.x,t.y,rad(t));if(!hit)return;
  const dx=t.x-hit.nx,dy=t.y-hit.ny,d=hyp(dx,dy)||1;
  t.x=hit.nx+dx/d*(rad(t)+1);t.y=hit.ny+dy/d*(rad(t)+1);t.vx*=.25;t.vy*=.25;
}

/* ---------- bases ---------- */
function spawnBases(){
  bases=[
    {x:380,y:WW/2,r:95,team:0,hp:3500,mh:3500,cd:0,col:teamCols[0][0]},
    {x:WW-380,y:WW/2,r:95,team:1,hp:3500,mh:3500,cd:0,col:teamCols[1][0]}
  ];
}

/* ---------- combat ---------- */
function fire(t){
  if(t.heat>=1){t.cd=300;return}
  const guns=t.bossGuns||T[t.k].b, m=M(t), s=sz(t), n=guns.length;
  const bs=m.alt?[guns[t.bi++%n]]:guns, r=rad(t);
  if(m.trap){
    for(const b of bs){
      const a=t.ang+(b.a||0), tx=t.x+Math.cos(a)*(r+b.l*.55*s), ty=t.y+Math.sin(a)*(r+b.l*.55*s);
      const spd=200+t.st.bspd*14;
      // lifetime 5–9s depending on upgrade
      const life=5.5*(m.trapLife||1);
      traps.push({x:tx,y:ty,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:13*(m.trapSize||1)*s,rot:rr(0,TAU),spin:9+rr(0,5),life,maxLife:life,o:t,team:t.team,col:t.col,settled:0,hp:22*(m.trapSize||1),mh:22*(m.trapSize||1)});
      spark(tx,ty,3,[t.col,'#fff'],35,120,1,2.2,.07,.16);
    }
  } else if(m.missile){
    for(const b of bs){
      const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.55*s),ty=t.y+Math.sin(a)*(r+b.l*.55*s);
      if(m.swarm){for(let i=-1;i<=1;i++)msl.push({x:tx,y:ty,ang:a+i*.2,spd:bspd(t)*.68,l:1.9,o:t,r:7.5*s,lock:0,spin:0,auto:0,swarm:1,c:t.col,emit:0,flame:0,spinA:0,gCd:0})}
      else msl.push({x:tx,y:ty,ang:a,spd:bspd(t)*.75,l:2.3,o:t,r:11*s,lock:!!m.lock,spin:!!m.spin,auto:!!m.auto,swarm:0,c:t.col,emit:0,flame:0,spinA:0,gCd:0});
      spark(tx,ty,2,['#fff2ae','#ffd34d'],40,140,1,2,.06,.14);
    }
  } else {
    for(const b of bs){
      const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.58*s)-Math.sin(t.ang)*(b.o||0)*s,ty=t.y+Math.sin(a)*(r+b.l*.58*s)+Math.cos(t.ang)*(b.o||0)*s;
      for(let i=0;i<1+(m.pel||0);i++){
        const aa=a+(m.spr?(R()-.5)*m.spr:0),sp=bspd(t)*(m.pel?rr(.75,1.2):1);
        bl.push({x:tx,y:ty,px:tx,py:ty,vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp,r:(6.5+t.st.bdmg*.38)*(m.siz||1)*s*(m.pel?.85:1),dm:dmgOf(t),o:t,l:1.3*(m.life||1),c:t.pl?'#00e0ff':t.col,team:t.team});
      }
    }
  }
  const heatGain=(m.heat||0)*0.065*(m.pel?1.35:1);
  if(heatGain>0)t.heat=Math.min(1.2,t.heat+heatGain);
  const k=(m.rc||1)*130*(.5+Math.min(2.2,m.dmg||1)*.2)*(m.pel?1.25:1)*(bs.length>1?1.1:1);
  t.vx-=Math.cos(t.ang)*k;t.vy-=Math.sin(t.ang)*k;t.rc=Math.min(15,t.rc+k*.08);
  if(t.pl){shake=Math.min(12,shake+k*.02);cam.kx-=Math.cos(t.ang)*k*.04;cam.ky-=Math.sin(t.ang)*k*.04}
  t.cd=relOf(t)/(m.alt?n:1);
}

  for(const p of pt){X.globalAlpha=Math.max(0,p.l/p.m);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.s,0,TAU);X.fill()}X.globalAlpha=1;
  for(const g of rg){X.globalAlpha=Math.max(0,g.l/g.m)*.65;X.strokeStyle=g.c;X.lineWidth=2.8*(g.l/g.m)+1;X.beginPath();X.arc(g.x,g.y,g.r,0,TAU);X.stroke()}X.globalAlpha=1;
  for(const f of ft){X.globalAlpha=Math.max(0,f.l/.85);X.fillStyle=f.c;X.font='bold '+f.s+'px Arial';X.textAlign='center';X.fillText(f.t,f.x,f.y)}X.globalAlpha=1;
  X.setTransform(1,0,0,1,0,0);mini()}
function mini(){const z=135,x0=W-z-8,y0=H-z-8,k=z/WW;X.fillStyle='#0007';X.fillRect(x0,y0,z,z);X.strokeStyle='#111';X.lineWidth=1.8;X.strokeRect(x0,y0,z,z);
  if(MODE==='bd'){for(const w of walls){X.fillStyle='#555';X.fillRect(x0+w.x*k,y0+w.y*k,Math.max(1,w.w*k),Math.max(1,w.h*k))}
    for(const b of bases){X.fillStyle=b.col;X.beginPath();X.arc(x0+b.x*k,y0+b.y*k,5,0,TAU);X.fill()}}
  for(const n of nests){X.fillStyle='#8b1a2b';X.beginPath();X.arc(x0+n.x*k,y0+n.y*k,3.5,0,TAU);X.fill()}
  for(const b of bt){X.fillStyle=b.boss?'#ffd34d':b.col;X.fillRect(x0+b.x*k-1.3,y0+b.y*k-1.3,b.boss?4:2.2,b.boss?4:2.2)}
  if(P&&!P.dead){X.fillStyle='#fff';X.fillRect(x0+P.x*k-2,y0+P.y*k-2,4,4)}}

/* ---------- hud ---------- */
const fs=s=>s>=1e6?(s/1e6).toFixed(1)+'M':s>=1e3?(s/1e3).toFixed(1)+'k':''+(s|0);
function buildUps(){const b=$('ups');b.innerHTML='';S.forEach((s,i)=>{const d=document.createElement('div');d.className='u';d.id='u'+i;d.onclick=()=>spend(i);b.appendChild(d)})}
function hudUps(){if(!P)return;S.forEach((s,i)=>{const d=$('u'+i),v=P.st[s[0]];if(d){d.innerHTML='<span style="color:#ffd34d">['+(i+1)+']</span> <b>'+s[1]+'</b><br><span style="color:#8abc3f">'+'●'.repeat(v)+'○'.repeat(8-v)+'</span>';d.style.opacity=P.pts>0&&v<8?1:.5}})}
function spend(i){if(!P||state!=='play'||P.pts<=0||P.st[S[i][0]]>=8)return;P.pts--;P.st[S[i][0]]++;if(i===1)P.hp+=18;hudUps()}
function hud(){if(!P)return;$('xp').style.width=(P.xp/need(P.lv)*100)+'%';$('lv').textContent='Lv '+P.lv+(P.pts?' · '+P.pts+' pts':'');$('sc').textContent='Score: '+fs(P.sc);
  $('cn').textContent=(T[P.k]?T[P.k].n:'?')+(MODE==='bd'?' · '+teamName(P.team):'')+(sz(P)>1.1?' ×'+sz(P).toFixed(1):'');
  const b=[];if(P.bf.rapid>0)b.push('⚡'+P.bf.rapid.toFixed(1));if(P.bf.shield>0)b.push('◈'+P.bf.shield.toFixed(1));
  if(P.heat>.2)b.push(P.heat>=1?'🔥 OVERHEAT':'♨ '+(P.heat*100|0)+'%');
  if(autoSpin)b.push('🔄 SPIN');
  b.push(P.dash>0?'DASH '+P.dash.toFixed(1):'DASH');$('bf').textContent=b.join(' · ');
  $('vg').classList.toggle('l',!P.dead&&P.hp/mx(P)<.28);hudUps()}
function lbd(){const l=[];if(P&&!P.dead)l.push({n:'You',s:P.sc,c:T[P.k]?T[P.k].n:'?',y:1,col:P.col});for(const b of bt)l.push({n:(b.boss?'★':'')+b.name,s:b.sc,c:b.boss?b.name:(T[b.k]?T[b.k].n:'?'),col:b.col});l.sort((a,b)=>b.s-a.s);
  $('lb').innerHTML='<div style="text-align:center;color:#ffd34d;font-weight:700;margin-bottom:2px">LEADERBOARD</div>'+l.slice(0,10).map((r,i)=>'<div style="display:flex;gap:2px;padding:1px 0;'+(r.y?'font-weight:700':'')+'"><span style="width:12px;color:#aaa">'+(i+1)+'</span><span style="flex:1;color:'+(r.col||'#fff')+'">'+r.n+'</span><span style="color:#8abc3f;font-size:8px">'+r.c+'</span><span style="color:#ffd34d;width:38px;text-align:right">'+fs(r.s)+'</span></div>').join('')}

/* ---------- input ---------- */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==='tab'||k===' ')e.preventDefault();
  if(k==='`'){DBG=!DBG;$('dbg').textContent=DBG?'DEBUG Shift+L/U/H/K/B':''}
  if(k==='tab')$('lb').style.display=$('lb').style.display==='none'?'':'none';
  if(k==='e')auto=!auto;if(k==='q')autoSpin=!autoSpin;
  const n=parseInt(e.key);
  if(cur&&(state==='menu'||state==='pick')&&n>=1&&n<=cur.items.length){cur.cb(cur.items[n-1]);return}
  if(e.key==='Enter'&&state==='dead'&&cur){cur.cb(cur.items[0]);return}
  if(state!=='play'||!P)return;
  if(n>=1&&n<=7)spend(n-1);
  if(k===' '&&P.dash<=0){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(!dx&&!dy){dx=Math.cos(P.ang);dy=Math.sin(P.ang)}const l=hyp(dx,dy);P.vx+=dx/l*880;P.vy+=dy/l*880;P.dash=3.8;spark(P.x,P.y,8,['#fff',P.col],40,160,1.4,3,.12,.3);ring(P.x,P.y,42,'#fff',.18)}
  if(DBG&&e.shiftKey){if(k==='l')for(let i=0;i<5;i++)addXp(P,need(P.lv));if(k==='u')P.pts+=5;if(k==='h')P.hp=mx(P);if(k==='b')spawnBoss();
    if(k==='k'){for(const b of bt)if(hyp(b.x-P.x,b.y-P.y)<600)hurt(b,99999,P)}}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
C.addEventListener('mousemove',e=>{ms.x=e.clientX;ms.y=e.clientY});C.addEventListener('mousedown',()=>ms.d=1);addEventListener('mouseup',()=>ms.d=0);C.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- boot ---------- */
for(let i=0;i<70;i++)spawnShape();for(let i=0;i<12;i++)spawnBot();for(let i=0;i<2;i++)spawnNest();
let last=performance.now();
function loop(tnow){const dt=Math.min(.05,(tnow-last)/1000);last=tnow;
  if(state==='play')update(dt);fxUpdate(dt);draw(tnow);hud();lbT+=dt;if(lbT>.5){lbT=0;lbd()}requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
