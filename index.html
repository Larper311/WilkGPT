<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cratebound</title>
<style>
:root{--bg:#03050c;--card:#0f172a;--tx:#f1f5f9;--mu:#94a3b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:inherit}
body{font-family:system-ui,Segoe UI,sans-serif;background:radial-gradient(ellipse at top,#0f172a,var(--bg) 70%);background-color:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
h1{font-family:Impact,Orbitron,sans-serif;text-align:center;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:4px;padding-top:1.4rem;background:linear-gradient(90deg,#a5b4fc,#e879f9,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bar{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:1rem}
.pill,.btn{background:#1e293b;border:1px solid #334155;border-radius:999px;padding:.5rem 1.1rem;color:var(--tx);font-weight:600;font-size:.9rem}
.btn{cursor:pointer;border-radius:10px}.btn:hover{background:#334155}.pill b{color:#fbbf24}
#feed{text-align:center;color:var(--mu);font-size:.85rem;height:1.3rem;transition:opacity .4s}
.wrap{max-width:1100px;margin:0 auto;padding:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.2rem}
.crate{background:var(--card);border:1px solid #1e293b;border-radius:16px;padding:1.3rem;text-align:center;cursor:pointer;transition:.25s}
.crate:hover{transform:translateY(-6px);border-color:#6366f1}.crate.sel{border-color:#a5b4fc;box-shadow:0 0 0 2px #a5b4fc,0 12px 34px #6366f166}
.crate .e{font-size:3.4rem}.crate small{color:var(--mu);display:block;margin:.3rem 0 .6rem}.price{color:#fbbf24;font-weight:700;margin-bottom:.6rem}
.open{text-align:center;margin:1.8rem 0;display:flex;flex-direction:column;align-items:center;gap:.9rem}
#openBtn{background:linear-gradient(135deg,#6366f1,#c026d3);color:#fff;border:0;padding:1rem 3rem;font-size:1.15rem;font-weight:700;border-radius:14px;cursor:pointer;box-shadow:0 10px 30px #6366f180}
#openBtn:disabled{opacity:.4;cursor:not-allowed}
.pity{width:260px;font-size:.78rem;color:var(--mu)}.pity div{height:6px;background:#1e293b;border-radius:9px;margin-top:4px;overflow:hidden}.pity i{display:block;height:100%;background:linear-gradient(90deg,#a855f7,#fbbf24);width:0}
.modal{position:fixed;inset:0;background:#000c;z-index:50;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(6px)}.modal.on{display:flex}
.mc{background:var(--card);border:1px solid #1e293b;border-radius:18px;max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:1.4rem}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.7rem}
.it{background:#1e293b;border-left:4px solid;border-radius:10px;padding:.7rem;display:flex;gap:.6rem;align-items:center;font-size:.85rem}
.it .em{font-size:1.6rem}.it b{display:block;font-size:.88rem}.gold{color:#fbbf24}.lim{color:#c4b5fd;font-size:.72rem}.dim{opacity:.35;filter:grayscale(1)}
#ov{position:fixed;inset:0;background:#010309;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:1rem}#ov.on{display:flex}
#fl{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:120}
.oc{font-size:6rem;display:inline-block;margin:0 .6rem}.shake{animation:sh .35s infinite}
@keyframes sh{25%{transform:translate(-9px,5px) rotate(-4deg)}50%{transform:translate(10px,-6px) rotate(4deg)}75%{transform:translate(-6px,6px)}}
#cards{display:none;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.9rem;max-width:900px;width:100%;margin:1rem 0}
.fc{perspective:700px;height:190px;cursor:pointer}.fi{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}.fc.f .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.6rem}
.fa{background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid #334155;font-size:3rem}.fb{background:#1e293b;border:3px solid;transform:rotateY(180deg)}
.fb .em{font-size:2.6rem}.fb b{font-size:.88rem}.fb span{font-size:.75rem;font-weight:700}
.v-Shiny{box-shadow:0 0 22px #fde68a}.v-Holo .fb,.v-Holo.it{background:linear-gradient(120deg,#1e293b,#312e81,#0e7490,#1e293b);background-size:300% 300%;animation:ho 3s infinite}
.v-Glitched .fb{background:#3b0764;animation:gl .4s infinite}.v-Golden .fb{background:linear-gradient(135deg,#78350f,#fbbf24,#78350f);color:#111}
@keyframes ho{50%{background-position:100% 50%}}@keyframes gl{50%{transform:rotateY(180deg) skewX(4deg);filter:hue-rotate(90deg)}}
.tag{font-size:.7rem;color:#fbbf24;font-weight:800}
</style></head><body>
<h1>CRATEBOUND</h1>
<div class="bar"><div class="pill">🪙 <b id="coins">0</b></div><div class="pill">Wealth <b id="wealth">0</b></div><div class="pill">Items <b id="cnt">0</b></div>
<button class="btn" id="bInv">Inventory</button><button class="btn" id="bBook">Collection</button><button class="btn" id="bDaily">Daily reward</button><button class="btn" id="bSnd">🔊</button></div>
<div id="feed"></div>
<div class="wrap"><div class="grid" id="crates"></div>
<div class="open"><div class="bar" style="margin:0"><button class="btn" id="qm">−</button><div class="pill" id="qv">1</div><button class="btn" id="qp">+</button></div>
<button id="openBtn" disabled>SELECT A CRATE</button>
<div class="pity"><span id="pt"></span><div><i id="pb"></i></div></div><div id="net" style="font-size:.75rem;color:var(--mu)"></div></div></div>
<div class="modal" id="m1"><div class="mc"><div class="mh"><h2 id="m1t"></h2><button class="btn" data-x="m1">×</button></div><div class="items" id="m1g"></div></div></div>
<div id="ov"><div id="crow"></div><div id="cards"></div><div id="ovb" style="display:none;gap:.6rem"><button class="btn" id="revAll">Reveal all</button><button class="btn" id="done">Continue</button></div></div><div id="fl"></div>
<script>
const R=[["Common","#9ca3af",4200],["Uncommon","#22c55e",2400],["Rare","#3b82f6",1500],["Super Rare","#60a5fa",850],["Epic","#a855f7",480],["Legendary","#fbbf24",220],["Mythic","#f97316",100],["Divine","#f8fafc",40],["Chroma","#ec4899",15],["Transcendent","#e879f9",5]];
const BV=[15,45,120,280,650,1800,4500,12000,35000,100000];
const VAR=[["Golden",20,.001],["Glitched",8,.006],["Holo",3,.026],["Shiny",1.5,.106]];
const I=(n,e,r,t)=>({n,e,r,t,s:n.toLowerCase().replace(/[^a-z0-9]/g,'-')});
const CR=[
{id:"starter",n:"Starter Crate",e:"📦",p:100,l:1,d:"Essential gear for beginners",it:[I("Rusty Dagger","🗡️",0),I("Cloth Bandana","🧣",0),I("Worn Boots","👢",0),I("Old Lantern","🏮",0),I("Wooden Buckler","🛡️",1),I("Leather Vest","🥋",1),I("Hunter's Horn","📯",1),I("Health Vial","🧪",2),I("Short Bow","🏹",2),I("Traveler's Map","🗺️",2),I("Iron Gauntlets","🥊",3),I("Steel Longsword","⚔️",3),I("Shadow Cloak","🧥",4),I("Storm Ring","💍",4),I("Phoenix Feather","🪶",5),I("Dragonbone Axe","🪓",5),I("Void Shard","💎",6),I("Champion's Crown","🏆",6),I("Celestial Key","🔑",7),I("Prism Core","🔮",8),I("Origin Fragment","✨",9),I("Founder's Blade","🗡️",5,50),I("First Light Candle","🕯️",4,100),I("Genesis Coin","🪙",8,10)]},
{id:"mystic",n:"Mystic Crate",e:"🔮",p:300,l:1.35,d:"Arcane relics and forgotten knowledge",it:[I("Mana Dust","✨",0),I("Faded Grimoire","📖",0),I("Ink Vial","🖋️",0),I("Rune Scroll","📜",1),I("Crystal Fragment","💠",1),I("Owl Familiar","🦉",1),I("Scrying Orb","🔮",2),I("Spirit Charm","🧿",2),I("Potion Set","⚗️",2),I("Echo Blade","⚔️",3),I("Arcane Staff","🪄",3),I("Astral Robes","👘",4),I("Moonstone Amulet","🌙",4),I("Dragon Scale","🐉",5),I("Elder Tome","📚",5),I("Chrono Hourglass","⏳",6),I("Philosopher's Stone","🔶",6),I("Godslayer Edge","🗡️",7),I("Rainbow Anomaly","🌈",8),I("The First Spark","⚡",9),I("Archmage's Seal","🔏",6,25),I("Eternal Ink Quill","🪶",5,75),I("Merlin's Eye","👁️",8,8)]},
{id:"void",n:"Void Crate",e:"🌑",p:800,l:1.7,d:"Dangerous artifacts from the abyss",it:[I("Black Dust","🌫️",0),I("Torn Veil","🕸️",0),I("Bone Chime","🦴",0),I("Whisper Mask","🎭",1),I("Cursed Coin","🪙",1),I("Shadow Bat","🦇",1),I("Abyss Fang","🦷",2),I("Night Dagger","🗡️",2),I("Hollow Lantern","🏮",3),I("Null Ring","💍",3),I("Horror Relic","👁️",4),I("Soul Chain","⛓️",4),I("Oblivion Crown","👑",5),I("Reaper's Hourglass","⌛",5),I("Endless Hunger","🕳️",6),I("Devourer's Eye","🧿",6),I("Silent God","🤫",7),I("Chromatic Void","🌀",8),I("The End of All","💀",9),I("Abyssal Heart","🖤",7,15),I("Last Whisper","👄",6,40),I("Void Emperor","👾",9,3)]},
{id:"celestial",n:"Celestial Crate",e:"🌌",p:1600,l:2.1,d:"Gifts from the stars themselves",it:[I("Stardust","🌟",0),I("Meteor Fragment","☄️",0),I("Moon Pebble","🪨",0),I("Comet Tail","💫",1),I("Nebula Shard","🪐",1),I("Star Map","🔭",1),I("Solar Flare","☀️",2),I("Lunar Mirror","🪞",2),I("Rocket Core","🚀",2),I("Gravity Well","🌀",3),I("Pulsar Core","💥",3),I("Aurora Cloak","👘",4),I("Event Horizon","⚫",4),I("Supernova Ember","🔥",5),I("Zodiac Wheel","♈",5),I("Quasar Heart","💖",6),I("Dyson Sphere","🛰️",6),I("Cosmic Crown","👑",7),I("Galaxy Prism","🌈",8),I("The Big Bang","🌌",9),I("Starforged Crown","👑",8,10),I("Genesis Seed","🌱",9,5),I("Comet Rider","🌠",6,30)]}];
const $=id=>document.getElementById(id),sl=ms=>new Promise(r=>setTimeout(r,ms));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let coins=ld('cb_coins',500),inv=ld('cb_inv',[]),seen=ld('cb_seen',{}),pity=ld('cb_pity',0),daily=ld('cb_daily',{d:'',s:0}),sel=null,qty=1,busy=false,snd=true,db=null,stock={},localStock=ld('cb_lstock',{});
if(window.claude&&claude.use)claude.use('db').then(d=>{if(!d)return;db=d;$('net').textContent='🌐 Limited stock is shared with all players';
 try{db.collection('stock').onSnapshot(s=>{const a=s.docs||[];a.forEach(x=>{const v=typeof x.data==='function'?x.data():x.data;stock[x.id]=(v&&v.n)||0});},()=>{})}catch(e){}}).catch(()=>{});
const rem=i=>i.t-(db?stock[i.s]||0:localStock[i.s]||0);
async function claim(i){
 if(!db){const n=(localStock[i.s]||0)+1;if(n>i.t)return null;localStock[i.s]=n;sv('cb_lstock',localStock);return n}
 const ref=db.doc('stock/'+i.s);
 for(let k=0;k<6;k++){try{const a=await ref.acquire({ttlMs:4000});
  if(a.acquired){const s=await ref.get();const v=s.exists?(typeof s.data==='function'?s.data():s.data):{};const n=((v&&v.n)||0);
   if(n>=i.t){stock[i.s]=n;return null}await ref.set({n:n+1});stock[i.s]=n+1;return n+1}}catch(e){}
  await sl(250+Math.random()*450)}
 return null}
// audio
let ac;function tone(f,d=.15,t='sine',v=.08){if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
$('bSnd').onclick=e=>{snd=!snd;e.target.textContent=snd?'🔊':'🔇'};
function flash(c,a=.4){const f=$('fl');f.style.background=c;f.style.transition='none';f.style.opacity=a;setTimeout(()=>{f.style.transition='opacity .5s';f.style.opacity=0},50);document.body.style.transform=`translate(${(Math.random()-.5)*16}px,${(Math.random()-.5)*10}px)`;setTimeout(()=>document.body.style.transform='',70)}
// ui
function stats(){$('coins').textContent=coins.toLocaleString();$('wealth').textContent=inv.reduce((s,i)=>s+i.v,0).toLocaleString();$('cnt').textContent=inv.length;$('pt').textContent=`Pity: guaranteed Epic+ in ${Math.max(0,15-pity)} opens`;$('pb').style.width=Math.min(100,pity/15*100)+'%';sv('cb_coins',coins);sv('cb_inv',inv);sv('cb_pity',pity);sv('cb_seen',seen)}
CR.forEach(c=>{const d=document.createElement('div');d.className='crate';d.innerHTML=`<div class="e">${c.e}</div><b>${c.n}</b><small>${c.d}</small><div class="price">🪙 ${c.p}</div><button class="btn">Inspect</button>`;
 d.querySelector('button').onclick=e=>{e.stopPropagation();inspect(c)};d.onclick=()=>{if(busy)return;sel=c;document.querySelectorAll('.crate').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');upd()};$('crates').appendChild(d)});
function upd(){const b=$('openBtn');if(!sel){return}const cost=sel.p*qty;b.disabled=busy||coins<cost;b.textContent=coins<cost?`NEED 🪙 ${cost}`:`OPEN ${qty>1?qty+'× ':''}${sel.n.toUpperCase()} (🪙 ${cost})`}
$('qm').onclick=()=>{if(qty>1){qty--;$('qv').textContent=qty;upd()}};$('qp').onclick=()=>{if(qty<5){qty++;$('qv').textContent=qty;upd()}};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>$(b.dataset.x).classList.remove('on'));
function card(i,o={}){const r=R[i.r];return `<div class="it ${o.vc||''}" style="border-color:${r[1]}"><div class="em">${i.e}</div><div><b>${i.n}${o.sn?` #${o.sn}`:''}</b><span style="color:${r[1]};font-size:.75rem;font-weight:700">${o.v?o.v+' ':''}${r[0]}</span>${o.val!=null?`<div class="gold">${o.val.toLocaleString()} 🪙</div>`:''}${i.t&&!o.sn?`<div class="lim">LIMITED · ${Math.max(0,rem(i))}/${i.t} left</div>`:''}${o.sn?`<div class="lim">Serial ${o.sn}/${i.t}</div>`:''}</div></div>`}
function inspect(c){$('m1t').textContent=c.n+' — Drops';$('m1g').innerHTML=[...c.it].sort((a,b)=>a.r-b.r).map(i=>card(i,{val:null})).join('');$('m1').classList.add('on')}
$('bInv').onclick=()=>{$('m1t').innerHTML=`Inventory <button class="btn" id="sAll">Sell all ≤ Rare</button>`;const g=$('m1g');g.innerHTML='';
 if(!inv.length)g.innerHTML='<p style="color:var(--mu)">Nothing yet.</p>';
 [...inv].reverse().forEach(e=>{const it=findItem(e.s),w=document.createElement('div');w.innerHTML=card(it,{sn:e.sn,v:e.vr,val:e.v,vc:'v-'+e.vr});const x=w.firstChild;x.style.cursor='pointer';x.title='Click to sell for '+sell(e);x.onclick=()=>{if(confirm(`Sell ${e.n} for ${sell(e)} coins?`)){coins+=sell(e);inv=inv.filter(y=>y.id!==e.id);stats();$('bInv').click()}};g.appendChild(x)});
 setTimeout(()=>{const b=$('sAll');if(b)b.onclick=()=>{const k=inv.filter(e=>e.r<=2);if(!k.length)return;coins+=k.reduce((s,e)=>s+sell(e),0);inv=inv.filter(e=>e.r>2);stats();$('bInv').click()}});$('m1').classList.add('on')};
const sell=e=>Math.floor(e.v*.25),findItem=s=>{for(const c of CR)for(const i of c.it)if(i.s===s)return i};
$('bBook').onclick=()=>{$('m1t').textContent='Collection';const g=$('m1g');g.innerHTML='';CR.forEach(c=>{const n=c.it.filter(i=>seen[i.s]).length;const h=document.createElement('h3');h.style.cssText='grid-column:1/-1;margin-top:.6rem';h.textContent=`${c.e} ${c.n} — ${n}/${c.it.length}`+(n===c.it.length?' ✅':'');g.appendChild(h);
 c.it.forEach(i=>{const w=document.createElement('div');w.innerHTML=seen[i.s]?card(i):`<div class="it dim"><div class="em">❔</div><b>???</b></div>`;g.appendChild(w.firstChild)})});$('m1').classList.add('on')};
$('bDaily').onclick=()=>{const t=new Date().toDateString();if(daily.d===t)return alert('Come back tomorrow!');const y=new Date(Date.now()-864e5).toDateString();daily.s=daily.d===y?Math.min(daily.s+1,7):1;daily.d=t;const g=200+daily.s*50;coins+=g;sv('cb_daily',daily);stats();upd();alert(`+${g} coins! Streak: ${daily.s} day(s)`)};
// opening
function pickRarity(c){const W=R.map((r,i)=>r[2]*Math.pow(c.l,i));let lo=0;if(pity>=14)lo=4;const T=W.slice(lo).reduce((a,b)=>a+b,0);let x=Math.random()*T;for(let i=lo;i<10;i++){if(x<W[i])return i;x-=W[i]}return lo}
function pickItem(c,r){const p=c.it.filter(i=>i.r===r&&(!i.t||rem(i)>0));const w=p.map(i=>i.t?.3:1);let x=Math.random()*w.reduce((a,b)=>a+b,0);for(let k=0;k<p.length;k++){if(x<w[k])return p[k];x-=w[k]}return p[0]}
function value(i,vm,sn){let v=BV[i.r]*(.9+Math.random()*.2)*vm;if(i.t)v*=1+4*(1-(sn-1)/Math.max(1,i.t-1));return Math.round(v)}
$('openBtn').onclick=async()=>{if(!sel||busy||coins<sel.p*qty)return;busy=true;coins-=sel.p*qty;$('openBtn').disabled=true;const res=[];
 for(let k=0;k<qty;k++){let r=pickRarity(sel),it=pickItem(sel,r),sn=null;if(it.t){sn=await claim(it);if(!sn){it=sel.it.find(i=>i.r===r&&!i.t)||it;sn=null}}
  const rr=Math.random();let vn='',vm=1;for(const v of VAR)if(rr<v[2]){vn=v[0];vm=v[1];break}
  pity=r>=4?0:pity+1;res.push({i:it,r,sn,vr:vn,v:value(it,vm,sn)})}
 const mx=Math.max(...res.map(x=>x.r));$('crow').innerHTML=res.map(()=>`<span class="oc shake" style="font-size:${qty>3?4:6}rem">${sel.e}</span>`).join('');$('cards').style.display='none';$('ovb').style.display='none';$('ov').classList.add('on');
 await sl(800);for(let k=0;k<=mx;k++){tone(220*Math.pow(1.12,k*2),.25,'triangle');flash(R[k][1],.12+k*.05);await sl(230+k*25)}
 if(mx>=7)await sl(700);flash(R[mx][1],.6);tone(110,.6,'sawtooth',.12);if(mx>=5)tone(880,.9,'sine',.1);
 $('crow').innerHTML='';$('cards').style.display='grid';$('cards').innerHTML=res.map((x,n)=>`<div class="fc v-${x.vr}" data-n="${n}"><div class="fi"><div class="fa">❓</div><div class="fb" style="border-color:${R[x.r][1]}"><div class="em">${x.i.e}</div><b>${x.i.n}${x.sn?' #'+x.sn:''}</b><span style="color:${R[x.r][1]}">${x.vr?x.vr+' ':''}${R[x.r][0]}</span><div class="gold">${x.v.toLocaleString()} 🪙</div>${x.sn?`<div class="lim">Serial ${x.sn}/${x.i.t}</div>`:''}</div></div></div>`).join('');
 $('ovb').style.display='flex';
 const flip=el=>{if(el.classList.contains('f'))return;el.classList.add('f');const x=res[el.dataset.n];tone(300+x.r*90,.3);if(x.r>=5)flash(R[x.r][1],.35)};
 document.querySelectorAll('.fc').forEach(el=>el.onclick=()=>flip(el));
 $('revAll').onclick=async()=>{const e=[...document.querySelectorAll('.fc')].sort((a,b)=>res[a.dataset.n].r-res[b.dataset.n].r);for(const el of e){flip(el);await sl(350)}};
 res.forEach(x=>{inv.push({id:Date.now()+Math.random(),s:x.i.s,n:x.i.n,r:x.r,sn:x.sn,vr:x.vr,v:x.v});seen[x.i.s]=1});stats()};
$('done').onclick=()=>{$('ov').classList.remove('on');busy=false;upd()};
// simulated live feed
const P=["Nova","Kairo","Blitz","Mira","Zed","Lux","Orion","Vex","Juno","Ash"];
setInterval(()=>{const c=CR[Math.floor(Math.random()*4)],r=Math.random()<.7?5+Math.floor(Math.random()*3):8,p=c.it.filter(i=>i.r===r&&!i.t)[0]||c.it[0],f=$('feed');f.style.opacity=0;setTimeout(()=>{f.innerHTML=`<span style="color:${R[p.r][1]}">●</span> ${P[Math.floor(Math.random()*10)]} unboxed ${p.e} ${p.n} <i>(simulated)</i>`;f.style.opacity=1},400)},6000);
stats();
</script></body></html>
