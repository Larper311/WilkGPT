<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cratebound — Unboxing Simulator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@500;700;900&display=swap');

    :root {
      --bg: #03050c;
      --card: #0f172a;
      --accent: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #0f172a 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 2.4rem 1rem 1.2rem;
    }
    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.1rem, 5.8vw, 3.4rem);
      font-weight: 900;
      background: linear-gradient(90deg, #a5b4fc, #e879f9, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 3px;
    }
    header p {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 1.05rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }

    .crates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.6rem;
      margin: 2.2rem 0;
    }

    .crate-card {
      background: var(--card);
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 1.7rem;
      text-align: center;
      transition: all 0.25s ease;
      position: relative;
    }
    .crate-card:hover {
      transform: translateY(-8px);
      border-color: #6366f1;
      box-shadow: 0 16px 42px rgba(99, 102, 241, 0.28);
    }
    .crate-card.selected {
      border-color: #a5b4fc;
      box-shadow: 0 0 0 2px #a5b4fc, 0 16px 42px rgba(99, 102, 241, 0.4);
    }
    .crate-emoji {
      font-size: 4rem;
      margin-bottom: 0.9rem;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5));
    }
    .crate-name {
      font-weight: 700;
      font-size: 1.25rem;
      margin-bottom: 0.35rem;
    }
    .crate-desc {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1.15rem;
    }
    .crate-price {
      display: inline-block;
      background: #020617;
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #fbbf24;
      margin-bottom: 1rem;
    }
    .crate-actions {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
    }
    .btn-inspect {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-inspect:hover {
      background: #334155;
      border-color: #64748b;
    }
    .btn-select {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-select:hover {
      filter: brightness(1.15);
    }

    /* Quantity + Open */
    .open-section {
      text-align: center;
      margin: 3rem 0 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }
    .quantity-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #0f172a;
      padding: 0.6rem 1.2rem;
      border-radius: 14px;
      border: 1px solid #1e293b;
    }
    .quantity-row span {
      font-size: 0.95rem;
      color: var(--muted);
    }
    .qty-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .qty-btn:hover {
      background: #334155;
    }
    #qtyValue {
      font-size: 1.3rem;
      font-weight: 700;
      min-width: 30px;
      text-align: center;
    }
    #openBtn {
      background: linear-gradient(135deg, #6366f1, #c026d3);
      color: white;
      border: none;
      padding: 1.15rem 3.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 1.5px;
      transition: all 0.2s;
      box-shadow: 0 12px 35px rgba(99, 102, 241, 0.5);
    }
    #openBtn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 16px 45px rgba(99, 102, 241, 0.65);
    }
    #openBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* ========== INSPECT MODAL ========== */
    #inspectModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      backdrop-filter: blur(6px);
    }
    #inspectModal.active { display: flex; }
    .modal-content {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      max-width: 720px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .modal-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
    }
    .modal-close {
      background: #1e293b;
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 1.3rem;
      cursor: pointer;
    }
    .drops-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.9rem;
    }
    .drop-item {
      background: #1e293b;
      border-radius: 12px;
      padding: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-left: 4px solid;
    }
    .drop-emoji { font-size: 1.7rem; }
    .drop-info { flex: 1; }
    .drop-name { font-weight: 600; font-size: 0.95rem; }
    .drop-rarity { font-size: 0.78rem; font-weight: 600; margin-top: 2px; }

    /* ========== OPENING OVERLAY ========== */
    #openingOverlay {
      position: fixed;
      inset: 0;
      background: #010309;
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #openingOverlay.active { display: flex; }

    .crate-visual {
      font-size: 8.5rem;
      z-index: 40;
      filter: drop-shadow(0 0 50px rgba(255,255,255,0.15));
    }
    .crate-visual.shake {
      animation: hardShake 0.38s infinite;
    }
    @keyframes hardShake {
      0%, 100% { transform: translate(0,0) rotate(0); }
      15% { transform: translate(-12px, 7px) rotate(-3.5deg); }
      30% { transform: translate(14px, -9px) rotate(3.5deg); }
      45% { transform: translate(-9px, -6px) rotate(-2.5deg); }
      60% { transform: translate(11px, 8px) rotate(2.5deg); }
      75% { transform: translate(-7px, 5px) rotate(-1.5deg); }
    }

    .wave-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }
    .wave {
      position: absolute;
      top: 50%;
      left: 110%;
      width: 160%;
      height: 28px;
      transform: translateY(-50%) rotate(-18deg);
      border-radius: 40px;
      opacity: 0;
      filter: blur(0.5px);
    }
    .wave::before {
      content: '';
      position: absolute;
      inset: -45px 0;
      background: inherit;
      filter: blur(50px);
      opacity: 0.75;
      border-radius: 60px;
    }
    .wave::after {
      content: '';
      position: absolute;
      inset: -90px 0;
      background: inherit;
      filter: blur(100px);
      opacity: 0.4;
      border-radius: 80px;
    }

    #particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .screen-flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      z-index: 50;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* Multi counter */
    .multi-counter {
      position: absolute;
      top: 8%;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #a5b4fc;
      z-index: 45;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .multi-counter.show { opacity: 1; }

    /* Final reveal (single) */
    #revealScreen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 60;
      background: radial-gradient(circle at center, #0f172a 0%, #010309 75%);
    }
    #revealScreen.show { display: flex; }

    .item-emoji {
      font-size: 7.5rem;
      margin-bottom: 1.3rem;
      animation: megaPop 0.75s cubic-bezier(0.34, 1.7, 0.64, 1);
      filter: drop-shadow(0 0 60px rgba(255,255,255,0.4));
    }
    .item-name {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.9rem, 4.8vw, 3rem);
      font-weight: 900;
      margin-bottom: 0.55rem;
      text-align: center;
    }
    .item-rarity {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 5px;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      text-shadow: 0 0 35px currentColor;
    }
    .item-odds {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 1.9rem;
    }
    .item-desc {
      max-width: 460px;
      text-align: center;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 3rem;
      padding: 0 1.3rem;
      font-size: 1.08rem;
    }

    /* Multi results screen */
    #multiResults {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 70;
      background: radial-gradient(circle at center, #0f172a 0%, #010309 80%);
      padding: 2rem;
      overflow-y: auto;
    }
    #multiResults.show { display: flex; }
    .multi-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 1.8rem;
      text-align: center;
    }
    .multi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      max-width: 900px;
      width: 100%;
      margin-bottom: 2.5rem;
    }
    .multi-card {
      background: #1e293b;
      border-radius: 14px;
      padding: 1.1rem;
      text-align: center;
      border-top: 4px solid;
      animation: megaPop 0.5s cubic-bezier(0.34, 1.6, 0.64, 1) backwards;
    }
    .multi-card .emoji { font-size: 2.8rem; margin-bottom: 0.5rem; }
    .multi-card .name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.3rem; }
    .multi-card .rarity { font-size: 0.8rem; font-weight: 600; }

    .btn-continue {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      padding: 0.95rem 2.6rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-continue:hover {
      background: #334155;
      border-color: #64748b;
    }

    @keyframes megaPop {
      0% { transform: scale(0.15); opacity: 0; }
      70% { transform: scale(1.18); }
      100% { transform: scale(1); opacity: 1; }
    }

    .history {
      margin-top: 3.8rem;
      padding-top: 2.2rem;
      border-top: 1px solid #1e293b;
    }
    .history h2 {
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      color: var(--muted);
    }
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
    }
    .history-item {
      background: #1e293b;
      border-radius: 12px;
      padding: 0.6rem 1.05rem;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-left: 4px solid;
    }
  </style>
</head>
<body>
  <header>
    <h1>CRATEBOUND</h1>
    <p>Unboxing Simulator — Open crates. Chase the impossible.</p>
  </header>

  <div class="container">
    <div class="crates-grid" id="cratesGrid"></div>

    <div class="open-section">
      <div class="quantity-row">
        <span>Open</span>
        <button class="qty-btn" id="qtyMinus">−</button>
        <div id="qtyValue">1</div>
        <button class="qty-btn" id="qtyPlus">+</button>
        <span>crate(s)</span>
      </div>
      <button id="openBtn" disabled>SELECT A CRATE</button>
    </div>

    <div class="history">
      <h2>Recent Unboxings</h2>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <!-- Inspect Modal -->
  <div id="inspectModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Crate Drops</h2>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="drops-grid" id="dropsGrid"></div>
    </div>
  </div>

  <!-- Opening Overlay -->
  <div id="openingOverlay">
    <canvas id="particles"></canvas>
    <div class="wave-container" id="waveContainer"></div>
    <div class="screen-flash" id="screenFlash"></div>
    <div class="multi-counter" id="multiCounter"></div>
    <div class="crate-visual" id="crateVisual">📦</div>

    <!-- Single reveal -->
    <div id="revealScreen">
      <div class="item-emoji" id="itemEmoji"></div>
      <div class="item-name" id="itemName"></div>
      <div class="item-rarity" id="itemRarity"></div>
      <div class="item-odds" id="itemOdds"></div>
      <div class="item-desc" id="itemDesc"></div>
      <button class="btn-continue" id="closeReveal">Continue</button>
    </div>

    <!-- Multi results -->
    <div id="multiResults">
      <div class="multi-title">You received</div>
      <div class="multi-grid" id="multiGrid"></div>
      <button class="btn-continue" id="closeMulti">Continue</button>
    </div>
  </div>

  <script>
    // ====================== DATA ======================
    const RARITIES = [
      { name: "Common",       color: "#9ca3af", weight: 4500 },
      { name: "Uncommon",     color: "#22c55e", weight: 2500 },
      { name: "Rare",         color: "#3b82f6", weight: 1400 },
      { name: "Super Rare",   color: "#60a5fa", weight: 800  },
      { name: "Epic",         color: "#a855f7", weight: 450  },
      { name: "Legendary",    color: "#fbbf24", weight: 200  },
      { name: "Mythic",       color: "#f97316", weight: 90   },
      { name: "Divine",       color: "#f8fafc", weight: 40   },
      { name: "Chroma",       color: "#ec4899", weight: 15   },
      { name: "Transcendent", color: "#e879f9", weight: 5    }
    ];

    const TOTAL_WEIGHT = RARITIES.reduce((s, r) => s + r.weight, 0);

    const CRATES = [
      {
        id: "starter",
        name: "Starter Crate",
        emoji: "📦",
        desc: "Basic gear for new explorers",
        price: "Free",
        items: [
          { name: "Rusty Dagger", emoji: "🗡️", rarity: "Common", desc: "Barely sharp. Still better than fists." },
          { name: "Cloth Bandana", emoji: "🧣", rarity: "Common", desc: "Keeps the dust out of your eyes." },
          { name: "Worn Boots", emoji: "👢", rarity: "Common", desc: "They've seen better days." },
          { name: "Wooden Shield", emoji: "🛡️", rarity: "Uncommon", desc: "Cracks under pressure, but holds." },
          { name: "Leather Vest", emoji: "🥋", rarity: "Uncommon", desc: "Light protection, lighter regret." },
          { name: "Spark Potion", emoji: "🧪", rarity: "Rare", desc: "A tiny burst of energy." },
          { name: "Hunter's Bow", emoji: "🏹", rarity: "Rare", desc: "Quiet and deadly at range." },
          { name: "Iron Gauntlets", emoji: "🥊", rarity: "Super Rare", desc: "Heavy, reliable, slightly cold." },
          { name: "Steel Longsword", emoji: "⚔️", rarity: "Super Rare", desc: "A proper weapon at last." },
          { name: "Shadow Cloak", emoji: "🧥", rarity: "Epic", desc: "Blends into darkness a little too well." },
          { name: "Storm Ring", emoji: "💍", rarity: "Epic", desc: "Crackles when danger is near." },
          { name: "Phoenix Feather", emoji: "🪶", rarity: "Legendary", desc: "Warm to the touch. Never cools." },
          { name: "Dragonbone Axe", emoji: "🪓", rarity: "Legendary", desc: "Still carries ancient heat." },

          { name: "Origin Fragment", emoji: "✨", rarity: "Transcendent", desc: "A piece of the first light." }
        ]
      },
      {
        id: "mystic",
        name: "Mystic Crate",
        emoji: "🔮",
        desc: "Arcane relics from forgotten realms",
        price: "150 Coins",
        items: [
          { name: "Mana Dust", emoji: "✨", rarity: "Common", desc: "Faintly glows at night." },
          { name: "Faded Tome", emoji: "📖", rarity: "Common", desc: "Most pages are blank now." },
          { name: "Rune Scroll", emoji: "📜", rarity: "Uncommon", desc: "Words that shift when you look away." },
          { name: "Crystal Shard", emoji: "💠", rarity: "Uncommon", desc: "Hums with residual power." },
          { name: "Crystal Orb", emoji: "🔮", rarity: "Rare", desc: "Shows glimpses of parallel paths." },
          { name: "Spirit Charm", emoji: "🧿", rarity: "Rare", desc: "Protects against unseen things." },
          { name: "Echo Blade", emoji: "⚔️", rarity: "Super Rare", desc: "Every swing leaves a ghostly afterimage." },
          { name: "Arcane Staff", emoji: "🪄", rarity: "Super Rare", desc: "Channels raw magic." },
          { name: "Astral Robe", emoji: "👘", rarity: "Epic", desc: "Stars move across the fabric." },
          { name: "Moonstone Amulet", emoji: "🌙", rarity: "Epic", desc: "Grows brighter under moonlight." },
          { name: "Dragon Scale", emoji: "🐉", rarity: "Legendary", desc: "Still radiates residual heat." },
          { name: "Time Hourglass", emoji: "⏳", rarity: "Mythic", desc: "Sand flows both ways." },
          { name: "Godslayer Edge", emoji: "🗡️", rarity: "Divine", desc: "Forged to end immortality." },
          { name: "Rainbow Anomaly", emoji: "🌈", rarity: "Chroma", desc: "Doesn't obey the laws of color." },
          { name: "The First Spark", emoji: "⚡", rarity: "Transcendent", desc: "The moment existence began." }
        ]
      },
      {
        id: "void",

          { name: "Abyss Fang", emoji: "🦷", rarity: "Rare", desc: "Never stops dripping shadow." },
          { name: "Night Dagger", emoji: "🗡️", rarity: "Rare", desc: "Silent. Permanent." },
          { name: "Null Ring", emoji: "💍", rarity: "Super Rare", desc: "Removes one memory at a time." },
          { name: "Hollow Lantern", emoji: "🏮", rarity: "Super Rare", desc: "Lights the way into darkness." },
          { name: "Horror Relic", emoji: "👁️", rarity: "Epic", desc: "It blinks when you don't look." },
          { name: "Soul Chain", emoji: "⛓️", rarity: "Epic", desc: "Binds more than just the body." },

          { name: "Chromatic Void", emoji: "🌀", rarity: "Chroma", desc: "All colors collapse into one." },
          { name: "The End of All", emoji: "💀", rarity: "Transcendent", desc: "There is nothing after this." }
        ]
      }
    ];

    // ====================== STATE ======================
    let selectedCrate = null;
    let isOpening = false;
    let quantity = 1;
    const history = [];
    let multiResults = [];

    // ====================== UI ======================
    const cratesGrid = document.getElementById('cratesGrid');
    const openBtn = document.getElementById('openBtn');
    const qtyValue = document.getElementById('qtyValue');
    const openingOverlay = document.getElementById('openingOverlay');
    const crateVisual = document.getElementById('crateVisual');
    const waveContainer = document.getElementById('waveContainer');
    const screenFlash = document.getElementById('screenFlash');
    const multiCounter = document.getElementById('multiCounter');
    const revealScreen = document.getElementById('revealScreen');
    const multiResultsEl = document.getElementById('multiResults');
    const multiGrid = document.getElementById('multiGrid');
    const historyList = document.getElementById('historyList');
    const inspectModal = document.getElementById('inspectModal');
    const dropsGrid = document.getElementById('dropsGrid');
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Render crates
    CRATES.forEach(crate => {
      const card = document.createElement('div');
      card.className = 'crate-card';
      card.innerHTML = `
        <div class="crate-emoji">${crate.emoji}</div>
        <div class="crate-name">${crate.name}</div>
        <div class="crate-desc">${crate.desc}</div>
        <div class="crate-price">${crate.price}</div>
        <div class="crate-actions">
          <button class="btn-inspect">Inspect Drops</button>
          <button class="btn-select">Select</button>
        </div>
      `;
      card.querySelector('.btn-inspect').addEventListener('click', (e) => {
        e.stopPropagation();
        openInspect(crate);
      });
      card.querySelector('.btn-select').addEventListener('click', (e) => {
        e.stopPropagation();
        selectCrate(crate, card);
      });
      card.addEventListener('click', () => selectCrate(crate, card));
      cratesGrid.appendChild(card);
    });

    function selectCrate(crate, cardEl) {
      if (isOpening) return;
      selectedCrate = crate;
      document.querySelectorAll('.crate-card').forEach(c => c.classList.remove('selected'));
      cardEl.classList.add('selected');
      openBtn.disabled = false;
      updateOpenButton();
    }

    function updateOpenButton() {
      if (!selectedCrate) return;
      openBtn.textContent = quantity === 1 
        ? `OPEN ${selectedCrate.name.toUpperCase()}`
        : `OPEN ${quantity}× ${selectedCrate.name.toUpperCase()}`;
    }

    // Quantity controls
    document.getElementById('qtyMinus').addEventListener('click', () => {
      if (quantity > 1) {
        quantity--;
        qtyValue.textContent = quantity;
        updateOpenButton();
      }
    });
    document.getElementById('qtyPlus').addEventListener('click', () => {
      if (quantity < 5) {
        quantity++;
        qtyValue.textContent = quantity;
        updateOpenButton();
      }
    });

    openBtn.addEventListener('click', () => {
      if (!selectedCrate || isOpening) return;
      startOpening();
    });

    // Inspect
    function openInspect(crate) {
      document.getElementById('modalTitle').textContent = `${crate.name} — Possible Drops`;
      dropsGrid.innerHTML = '';
      
      // Sort by rarity order
      const sorted = [...crate.items].sort((a, b) => {
        return RARITIES.findIndex(r => r.name === a.rarity) - RARITIES.findIndex(r => r.name === b.rarity);
      });

      sorted.forEach(item => {
        const rarity = RARITIES.find(r => r.name === item.rarity);
        const el = document.createElement('div');
        el.className = 'drop-item';
        el.style.borderColor = rarity.color;
        el.innerHTML = `
          <div class="drop-emoji">${item.emoji}</div>
          <div class="drop-info">
            <div class="drop-name">${item.name}</div>
            <div class="drop-rarity" style="color:${rarity.color}">${item.rarity}</div>
          </div>
        `;
        dropsGrid.appendChild(el);
      });
      inspectModal.classList.add('active');
    }
    document.getElementById('modalClose').addEventListener('click', () => {
      inspectModal.classList.remove('active');
    });
    inspectModal.addEventListener('click', (e) => {
      if (e.target === inspectModal) inspectModal.classList.remove('active');
    });

    // Close handlers
    document.getElementById('closeReveal').addEventListener('click', finishOpening);
    document.getElementById('closeMulti').addEventListener('click', finishOpening);

    function finishOpening() {
      openingOverlay.classList.remove('active');
      revealScreen.classList.remove('show');
      multiResultsEl.classList.remove('show');
      multiCounter.classList.remove('show');
      isOpening = false;
      openBtn.disabled = false;
      updateOpenButton();
      waveContainer.innerHTML = '';
    }

    // ====================== CORE ======================
    function rollRarity() {
      let roll = Math.random() * TOTAL_WEIGHT;
      for (const r of RARITIES) {
        if (roll < r.weight) return r;
        roll -= r.weight;
      }
      return RARITIES[0];
    }

    function getItemForRarity(crate, rarityName) {
      const pool = crate.items.filter(i => i.rarity === rarityName);
      if (pool.length === 0) return crate.items[Math.floor(Math.random() * crate.items.length)];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function getOddsText(rarityName) {
      const r = RARITIES.find(x => x.name === rarityName);
      if (!r) return "";
      const oneIn = Math.round(TOTAL_WEIGHT / r.weight);
      return `1 in ${oneIn.toLocaleString()}`;
    }

    // ====================== WAVE SYSTEM ======================
    function createWave(color, intensity) {
      const wave = document.createElement('div');
      wave.className = 'wave';
      wave.style.background = color;
      const height = 22 + intensity * 9;
      wave.style.height = `${height}px`;
      wave.style.boxShadow = `0 0 ${50 + intensity * 40}px ${color}`;
      waveContainer.appendChild(wave);
      return wave;
    }

    function fireWave(color, intensity) {
      return new Promise(resolve => {
        const wave = createWave(color, intensity);
        wave.offsetHeight;
        const duration = 0.85 + intensity * 0.12;
        wave.style.transition = `left ${duration}s cubic-bezier(0.25, 0.7, 0.3, 1), opacity 0.2s`;
        wave.style.left = '-60%';
        wave.style.opacity = '1';

        spawnWaveParticles(color, 22 + intensity * 14, intensity >= 4);

        if (intensity >= 4) {
          flashScreen(color, 0.18 + intensity * 0.05);
          hardShake(intensity);
        }
        if (intensity >= 7) {
          setTimeout(() => flashScreen(color, 0.35), 180);
        }

        setTimeout(() => {
          wave.style.opacity = '0';
          setTimeout(() => wave.remove(), 350);
          resolve();
        }, duration * 1000 + 80);
      });
    }

    function flashScreen(color, strength = 0.3) {
      screenFlash.style.background = color;
      screenFlash.style.opacity = strength;
      screenFlash.style.transition = 'opacity 0.07s';
      setTimeout(() => {
        screenFlash.style.transition = 'opacity 0.55s';
        screenFlash.style.opacity = '0';
      }, 70);
    }

    function hardShake(intensity) {
      const amount = 8 + intensity * 4;
      document.body.style.transition = 'none';
      document.body.style.transform = `translate(${(Math.random()-0.5)*amount*2}px, ${(Math.random()-0.5)*amount}px) rotate(${(Math.random()-0.5)*1.2}deg)`;
      setTimeout(() => {
        document.body.style.transition = 'transform 0.1s';
        document.body.style.transform = '';
      }, 70);
    }

    // ====================== OPENING SEQUENCE ======================
    async function startOpening() {
      isOpening = true;
      openBtn.disabled = true;
      openBtn.textContent = "OPENING...";
      multiResults = [];

      waveContainer.innerHTML = '';
      revealScreen.classList.remove('show');
      multiResultsEl.classList.remove('show');
      crateVisual.textContent = selectedCrate.emoji;
      openingOverlay.classList.add('active');

      const total = quantity;

      for (let n = 0; n < total; n++) {
        // Show counter if multi
        if (total > 1) {
          multiCounter.textContent = `${n + 1} / ${total}`;
          multiCounter.classList.add('show');
        }

        crateVisual.classList.add('shake');
        await sleep(total > 1 ? 700 : 1100);

        const finalRarity = rollRarity();
        const finalItem = getItemForRarity(selectedCrate, finalRarity.name);
        const finalIndex = RARITIES.findIndex(r => r.name === finalRarity.name);

        // Waves
        for (let i = 0; i <= finalIndex; i++) {
          const r = RARITIES[i];
          await fireWave(r.color, i);

          if (i === finalIndex) {
            await sleep(250);
            spawnWaveParticles(r.color, 90 + i * 25, true);
            if (i >= 7) {
              for (let k = 0; k < 5; k++) {
                setTimeout(() => {
                  spawnWaveParticles(r.color, 50, true);
                  flashScreen(r.color, 0.3);
                }, k * 100);
              }
            }
          } else {
            await sleep(180 + i * 15);
          }
        }

        crateVisual.classList.remove('shake');
        await sleep(600);

        spawnWaveParticles(finalRarity.color, 120 + finalIndex * 20, true);
        flashScreen(finalRarity.color, 0.55);
        hardShake(finalIndex + 3);

        await sleep(500);

        // Store result
        multiResults.push({ item: finalItem, rarity: finalRarity });
        history.unshift({ item: finalItem, rarity: finalRarity, crate: selectedCrate.name });
        if (history.length > 20) history.pop();
      }

      multiCounter.classList.remove('show');
      renderHistory();

      // Show results
      if (total === 1) {
        showSingleReveal(multiResults[0]);
      } else {
        showMultiResults();
      }
    }

    function showSingleReveal(result) {
      document.getElementById('itemEmoji').textContent = result.item.emoji;
      document.getElementById('itemName').textContent = result.item.name;
      document.getElementById('itemRarity').textContent = result.rarity.name;
      document.getElementById('itemRarity').style.color = result.rarity.color;
      document.getElementById('itemOdds').textContent = getOddsText(result.rarity.name);
      document.getElementById('itemDesc').textContent = result.item.desc;
      revealScreen.classList.add('show');
    }

    function showMultiResults() {
      multiGrid.innerHTML = '';
      multiResults.forEach((res, idx) => {
        const card = document.createElement('div');
        card.className = 'multi-card';
        card.style.borderColor = res.rarity.color;
        card.style.animationDelay = `${idx * 0.08}s`;
        card.innerHTML = `
          <div class="emoji">${res.item.emoji}</div>
          <div class="name">${res.item.name}</div>
          <div class="rarity" style="color:${res.rarity.color}">${res.rarity.name}</div>
        `;
        multiGrid.appendChild(card);
      });
      multiResultsEl.classList.add('show');
    }

    function renderHistory() {
      historyList.innerHTML = history.map(h => `
        <div class="history-item" style="border-color: ${h.rarity.color}">
          <span>${h.item.emoji}</span>
          <span>${h.item.name}</span>
          <span style="color:${h.rarity.color}; font-size:0.8rem; font-weight:600">${h.rarity.name}</span>
        </div>
      `).join('');
    }

    // ====================== PARTICLES ======================
    const particles = [];

    function spawnWaveParticles(color, count = 30, big = false) {
      const cy = canvas.height * 0.5;
      for (let i = 0; i < count; i++) {
        const x = canvas.width * (0.05 + Math.random() * 0.9);
        const angle = (Math.random() - 0.5) * Math.PI * 1.5;
        const speed = (big ? 6 : 3) + Math.random() * (big ? 13 : 6);
        particles.push({
          x, y: cy + (Math.random() - 0.5) * 60,
          vx: Math.cos(angle) * speed * (Math.random() > 0.5 ? 1 : -1),
          vy: Math.sin(angle) * speed - (big ? 4 : 1.5),
          life: 1,
          decay: 0.007 + Math.random() * 0.012,
          size: (big ? 4 : 2) + Math.random() * (big ? 7 : 3.5),
          color,
          glow: big
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.065;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.life * 0.92;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.glow ? 28 : 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
</body>
</html>
