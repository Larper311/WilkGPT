<script>
'use strict';
const C=document.getElementById('c'),X=C.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0;function rs(){C.width=W=innerWidth;C.height=H=innerHeight}addEventListener('resize',rs);rs();
const R=Math.random,rr=(a,b)=>a+R()*(b-a),pick=a=>a[R()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v)),hyp=Math.hypot,TAU=6.2832;
const ad=(a,b)=>{let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
const WW=10000;

/* ---------- classes ---------- */
const D=(n,c,r,d,b,m,up,lv)=>({n,c,r,d,b,m,up:up||[],lv:lv||0});
const T={
basic:D('Basic','#00b2e1',26,'Balanced.',[{l:40,w:18}],{},['twin','sniper','pounder','flank','shotgun','machine','missile','trapper'],10),
twin:D('Twin','#8abc3f',26,'Alternating twins.',[{l:40,w:14,o:-11},{l:40,w:14,o:11}],{alt:1,rc:1.1,heat:1.2},['triplet','quad'],25),
sniper:D('Sniper','#3ecfcf',25,'Long range.',[{l:62,w:12}],{rel:1.7,dmg:1.5,siz:.7,spd:1.5,life:1.7,rc:1.6},['rail','assassin'],25),
pounder:D('Pounder','#ff8c42',29,'Huge shells.',[{l:50,w:30}],{rel:2.2,dmg:2.3,siz:1.7,rc:2.4},['destroyer','howitzer'],25),
flank:D('Flank','#e67e22',27,'Front+rear.',[{l:42,w:16},{a:Math.PI,l:36,w:14}],{rc:1.1},['triflank','quadflank'],25),
shotgun:D('Shotgun','#e6b84c',27,'Pellet blast.',[{l:42,w:26}],{rel:1.8,dmg:.55,siz:.6,life:.5,pel:6,spr:.55,rc:1.6},['scatter'],25),
machine:D('Machine Gun','#5ad45a',27,'Rapid spray.',[{l:36,w:22}],{rel:.45,dmg:.5,siz:.65,spr:.3,rc:.9,heat:1.6},['minigun'],40),
missile:D('Missile','#bf7ff5',26,'Explosive missiles.',[{l:52,w:24}],{missile:1,rel:3.4,rc:1.7},['lockon','swarm','spinner'],25),
trapper:D('Trapper','#e8a0c0',27,'Lays spinning star traps.',[{l:36,w:20}],{trap:1,rel:1.6,rc:1.0},['megaTrap','hexaTrap'],25),
triplet:D('Triplet','#7dcf3a',26,'Three barrels.',[{l:42,w:12,o:-16},{l:46,w:14},{l:42,w:12,o:16}],{rel:1.1,dmg:.8,rc:1.4,heat:.9},['penta'],40),
quad:D('Quadriplet','#6abf2f',27,'Four barrels.',[{l:40,w:11,o:-20},{l:44,w:12,o:-7},{l:44,w:12,o:7},{l:40,w:11,o:20}],{rel:1.2,dmg:.7,rc:1.5,heat:1.1},['penta'],40),
penta:D('Penta Shot','#5aaf20',28,'Five barrels.',[{l:38,w:10,o:-22},{l:42,w:11,o:-11},{l:46,w:13},{l:42,w:11,o:11},{l:38,w:10,o:22}],{rel:1.25,dmg:.62,rc:1.6,heat:1.3}),
rail:D('Railgun','#5ff0ff',25,'Long slug.',[{l:76,w:10}],{rel:2.8,dmg:3,siz:.55,spd:2.3,life:2,rc:2.6},['hyper'],40),
hyper:D('Hyper Rail','#7affff',24,'Extreme rail.',[{l:82,w:9}],{rel:3.2,dmg:3.6,siz:.5,spd:2.8,life:2.2,rc:2.9}),
assassin:D('Assassin','#2fbfae',24,'Fast sniper.',[{l:68,w:11}],{rel:1.2,dmg:1.2,siz:.6,spd:1.8,life:1.8,rc:1.2},['stalker'],40),
stalker:D('Stalker','#1a9a8a',24,'Predator shots.',[{l:70,w:10}],{rel:1.0,dmg:1.35,siz:.55,spd:1.9,life:1.9,rc:1.1}),
destroyer:D('Destroyer','#e05a2b',31,'Heavy shell.',[{l:55,w:34}],{rel:2.9,dmg:3,siz:1.9,rc:3},['annihilator'],40),
annihilator:D('Annihilator','#c0392b',33,'Devastating.',[{l:62,w:40}],{rel:3.4,dmg:4.0,siz:2.2,rc:3.5}),
howitzer:D('Howitzer','#ff6b1a',32,'Colossal kick.',[{l:60,w:40}],{rel:3.6,dmg:4.2,siz:2.3,rc:3.6}),
triflank:D('Tri-Flank','#d35400',28,'Front+2 rear.',[{l:44,w:15},{a:2.4,l:36,w:13},{a:-2.4,l:36,w:13}],{rc:1.3},['hexflank'],40),
quadflank:D('Quad-Flank','#c0521a',28,'4 directions.',[{l:44,w:15},{a:Math.PI,l:40,w:14},{a:1.57,l:36,w:13},{a:-1.57,l:36,w:13}],{rc:1.2},['hexflank'],40),
hexflank:D('Hexa-Flank','#a04010',29,'6 directions.',[{l:40,w:13},{a:1.05,l:36,w:12},{a:2.09,l:36,w:12},{a:Math.PI,l:38,w:13},{a:-2.09,l:36,w:12},{a:-1.05,l:36,w:12}],{rc:1.3}),
scatter:D('Scatter','#ffcf5c',28,'Huge cloud.',[{l:46,w:30}],{rel:2,dmg:.5,siz:.6,life:.5,pel:11,spr:.8,rc:2.2}),
minigun:D('Minigun','#3fe08a',28,'Insane rate.',[{l:40,w:28}],{rel:.28,dmg:.4,siz:.55,spr:.45,rc:.8,heat:2.5}),
lockon:D('Lock-On','#d48cff',27,'Aim-assist missiles.',[{l:54,w:26}],{missile:1,lock:1,rel:3.6,rc:1.8}),
swarm:D('Swarm','#a66bff',28,'Missile fan.',[{l:48,w:28}],{missile:1,swarm:1,rel:4.0,rc:1.9}),
spinner:D('Spinner','#c77dff',27,'Spinning gun missile.',[{l:50,w:22}],{missile:1,spin:1,rel:3.3,rc:1.6},['auto'],40),
auto:D('Auto Missile','#e0a0ff',28,'Missile+minigun.',[{l:52,w:24}],{missile:1,auto:1,rel:3.5,rc:1.7}),
megaTrap:D('Mega Trapper','#f0b0d0',29,'Bigger lasting traps.',[{l:40,w:24}],{trap:1,trapSize:1.4,trapLife:1.5,rel:1.9,rc:1.2}),
hexaTrap:D('Hexa Trapper','#d888b0',28,'Six trap launchers.',[{l:32,w:14,a:0},{l:32,w:14,a:1.047},{l:32,w:14,a:2.094},{l:32,w:14,a:Math.PI},{l:32,w:14,a:-2.094},{l:32,w:14,a:-1.047}],{trap:1,rel:2.2,rc:1.1})
};
const STARTERS=['basic','twin','sniper','pounder','flank','shotgun','missile','trapper'];
const S=[['regen','Regen'],['hp','Max HP'],['body','Body'],['bspd','B.Spd'],['bdmg','B.Dmg'],['rel','Reload'],['mov','Speed']];
const PS={aggr:{pd:140,ap:1.3,rt:0,rg:660,st:.5},snip:{pd:500,ap:.4,rt:-1.1,rg:880,st:.7},flnk:{pd:240,ap:1.05,rt:-.45,rg:600,st:1.3},tank:{pd:85,ap:1.4,rt:.35,rg:520,st:.3}};
const NAMES=['Vortex','Blitz','Nova','Rusty','Havoc','Mochi','Zeta','Gunner','Pixel','Tango','Ghost','Bolt','Comet','Sarge','Echo','Rook'];
const TEAM_PAL=[['#3b82f6','#60a5fa'],['#22c55e','#4ade80'],['#ef4444','#f87171'],['#a855f7','#c084fc'],['#f59e0b','#fbbf24'],['#06b6d4','#22d3ee']];
const SHT=[['sq',4,24,28,9,'#ffe763',5],['tr',3,22,60,20,'#fc7677',8],['pe',5,32,200,110,'#768cfc',14],['hx',6,40,450,280,'#c77dff',22],['oc',8,46,850,520,'#ff9f43',28]];
const PU={heal:['#58e06a','+'],rapid:['#ffd34d','»'],shield:['#4db8ff','◈']};
const BOSSES=[
  {name:'Ironclad',col:'#ff3b5c',shape:'hex',r:52,drones:6,guns:[{l:48,w:15},{l:38,w:12,a:.85},{l:38,w:12,a:-.85},{l:36,w:11,a:2.3},{l:36,w:11,a:-2.3},{l:34,w:11,a:Math.PI}],m:{rel:1.15,dmg:1.2,rc:1.5}},
  {name:'Behemoth',col:'#c0392b',shape:'oct',r:58,drones:8,guns:[{l:46,w:18},{l:40,w:13,a:.7},{l:40,w:13,a:-.7},{l:38,w:12,a:1.6},{l:38,w:12,a:-1.6},{l:36,w:12,a:Math.PI}],m:{rel:1.4,dmg:1.5,siz:1.1,rc:1.9}},
  {name:'Apex',col:'#ff6348',shape:'star',r:54,drones:9,guns:[{l:42,w:12,o:-18},{l:46,w:13,o:-6},{l:46,w:13,o:6},{l:42,w:12,o:18},{l:34,w:11,a:Math.PI}],m:{rel:1.0,dmg:1.15,rc:1.4}}
];

/* ---------- state ---------- */
let MODE='ffa', state='menu', P=null, cur=null, shake=0, DBG=false, auto=false, autoSpin=false, bossT=40, streak=0, streakT=0, lbT=0;
let teamCols=null, teamWin=null;
const cam={x:WW/2,y:WW/2,z:1,kx:0,ky:0}, keys={}, ms={x:0,y:0,d:0};
let bl=[], msl=[], sh=[], bt=[], pt=[], rg=[], ft=[], pu=[], nests=[], drones=[], traps=[], walls=[], bases=[];

/* ---------- math ---------- */
const sz=t=>1+Math.min(1.6,Math.pow(Math.max(0,t.sc)/130000,.45));
const rad=t=>(t.bossR||T[t.k]?.r||30)*sz(t);
const M=t=>t.bossM||T[t.k]?.m||{};
const mx=t=>(100+t.st.hp*22)*(.85+sz(t)*.15)*(t.boss?3.8:1);
const dmgOf=t=>(8+t.st.bdmg*4.5)*(M(t).dmg||1)*(.9+sz(t)*.1);
const relOf=t=>Math.max(85,530*Math.pow(.89,t.st.rel)*(M(t).rel||1)*(t.bf.rapid>0?.62:1));
const bspd=t=>(370+t.st.bspd*27)*(M(t).spd||1);
const movOf=t=>(152+t.st.mov*11)/Math.pow(sz(t),.15);
const bodyOf=t=>(9+t.st.body*4.4)*(.9+sz(t)*.12);
const need=l=>Math.round(15*Math.pow(l,1.7));
function mk(x,y,k,pl,team){
  const st={};S.forEach(s=>st[s[0]]=0);
  const col=team!=null&&teamCols?teamCols[team][0]:(pl?T[k].c:pick(['#f14e54','#e67e22','#9b59b6','#3498db','#1abc9c']));
  return{x,y,vx:0,vy:0,ang:rr(0,TAU),k,pl,team:team!=null?team:null,col,st,hp:100,hpv:100,lv:1,xp:0,sc:0,pts:0,cd:0,rc:0,fl:0,bi:0,bf:{rapid:0,shield:0},dash:0,name:pl?'You':pick(NAMES),ps:pick(Object.keys(PS)),dead:0,ai:0,aim:rr(0,TAU),sd:R()<.5?1:-1,heat:0,heatSmoke:0,spawn:0};
}

/* ---------- fx ---------- */
function spark(x,y,n,cols,s0,s1,z0,z1,l0,l1){for(let i=0;i<n;i++){const a=rr(0,TAU),s=rr(s0,s1),l=rr(l0,l1);pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l,m:l,c:pick(cols),s:rr(z0,z1)})}if(pt.length>1100)pt.splice(0,pt.length-1100)}
const ring=(x,y,mr,c,l)=>rg.push({x,y,r:0,mr,l:l||.4,m:l||.4,c});
const flt=(x,y,t,c,s)=>{if(ft.length<80)ft.push({x,y,t,c,s:s||13,l:.9})};
function ban(t,c){const b=$('ban');b.textContent=t;b.style.color=c||'#fff';b.classList.remove('s');void b.offsetWidth;b.classList.add('s')}

/* ---------- maze walls (Base Destruction) ---------- */
function buildMaze(){
  walls=[];
  const cx=WW/2, gap=280, thick=55, len=900;
  // central vertical barrier with openings
  walls.push({x:cx-thick/2,y:0,w:thick,h:cx-gap*1.2});
  walls.push({x:cx-thick/2,y:cx+gap*1.2,w:thick,h:WW-(cx+gap*1.2)});
  // horizontal segments creating maze feel
  const segs=[
    [cx-1200,cx-400,thick,500],[cx+400,cx-400,thick,500],
    [cx-1200,cx+400-thick,thick,500],[cx+400,cx+400-thick,thick,500],
    [cx-1800,cx-thick/2,600,thick],[cx+1200,cx-thick/2,600,thick],
    [cx-800,cx-900,thick,400],[cx+800-thick,cx-900,thick,400],
    [cx-800,cx+500,thick,400],[cx+800-thick,cx+500,thick,400],
    [cx-500,cx-1500,400,thick],[cx+100,cx-1500,400,thick],
    [cx-500,cx+1500-thick,400,thick],[cx+100,cx+1500-thick,400,thick]
  ];
  for(const [x,y,w,h] of segs)walls.push({x,y,w,h});
}
function wallHit(x,y,r){
  for(const w of walls){
    const nx=cl(x,w.x,w.x+w.w), ny=cl(y,w.y,w.y+w.h);
    if(hyp(x-nx,y-ny)<r)return{nx,ny,w};
  }
  return null;
}
function resolveWall(t){
  const hit=wallHit(t.x,t.y,rad(t));
  if(!hit)return;
  const dx=t.x-hit.nx, dy=t.y-hit.ny, d=hyp(dx,dy)||1;
  t.x=hit.nx+dx/d*(rad(t)+1); t.y=hit.ny+dy/d*(rad(t)+1);
  t.vx*=.3; t.vy*=.3;
}

/* ---------- bases ---------- */
function spawnBases(){
  bases=[];
  // team 0 left, team 1 right
  bases.push({x:600,y:WW/2,r:110,team:0,hp:4000,mh:4000,cd:0,col:teamCols[0][0]});
  bases.push({x:WW-600,y:WW/2,r:110,team:1,hp:4000,mh:4000,cd:0,col:teamCols[1][0]});
}

/* ---------- combat ---------- */
function fire(t){
  if(t.heat>=1){t.cd=280;return}
  const guns=t.bossGuns||T[t.k].b, m=M(t), s=sz(t), n=guns.length;
  const bs=m.alt?[guns[t.bi++%n]]:guns, r=rad(t);
  if(m.trap){
    for(const b of bs){
      const a=t.ang+(b.a||0), tx=t.x+Math.cos(a)*(r+b.l*.5*s), ty=t.y+Math.sin(a)*(r+b.l*.5*s);
      const spd=220+t.st.bspd*15;
      traps.push({x:tx,y:ty,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:14*(m.trapSize||1)*s,rot:rr(0,TAU),spin:8+rr(0,4),life:8*(m.trapLife||1),maxLife:8*(m.trapLife||1),o:t,team:t.team,col:t.col,settled:0,hp:25*(m.trapSize||1),mh:25*(m.trapSize||1)});
      spark(tx,ty,3,['#fff',t.col],40,140,1,2.2,.08,.18);
    }
  } else if(m.missile){
    for(const b of bs){
      const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.55*s),ty=t.y+Math.sin(a)*(r+b.l*.55*s);
      if(m.swarm){for(let i=-1;i<=1;i++)msl.push({x:tx,y:ty,ang:a+i*.2,spd:bspd(t)*.68,l:2,o:t,r:8*s,lock:0,spin:0,auto:0,swarm:1,c:t.col,emit:0,flame:0,spinA:0,gCd:0})}
      else msl.push({x:tx,y:ty,ang:a,spd:bspd(t)*.76,l:2.4,o:t,r:12*s,lock:!!m.lock,spin:!!m.spin,auto:!!m.auto,swarm:0,c:t.col,emit:0,flame:0,spinA:0,gCd:0});
      spark(tx,ty,3,['#fff2ae','#ffd34d'],45,160,1,2.3,.07,.16);
    }
  } else {
    for(const b of bs){
      const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.6*s)-Math.sin(t.ang)*(b.o||0)*s,ty=t.y+Math.sin(a)*(r+b.l*.6*s)+Math.cos(t.ang)*(b.o||0)*s;
      for(let i=0;i<1+(m.pel||0);i++){
        const aa=a+(m.spr?(R()-.5)*m.spr:0),sp=bspd(t)*(m.pel?rr(.75,1.25):1);
        bl.push({x:tx,y:ty,px:tx,py:ty,vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp,r:(7+t.st.bdmg*.4)*(m.siz||1)*s*(m.pel?.9:1),dm:dmgOf(t),o:t,l:1.35*(m.life||1),c:t.pl?'#00e0ff':t.col,team:t.team});
      }
      spark(tx,ty,2,['#fff2ae','#ffd34d'],35,140,.9,2,.06,.14);
    }
  }
  // stronger longer overheat
  const heatGain=(m.heat||0)*0.07*(m.pel?1.4:1);
  if(heatGain>0)t.heat=Math.min(1.2,t.heat+heatGain);
  const k=(m.rc||1)*135*(.5+Math.min(2.3,m.dmg||1)*.22)*(m.pel?1.3:1)*(bs.length>1?1.12:1);
  t.vx-=Math.cos(t.ang)*k;t.vy-=Math.sin(t.ang)*k;t.rc=Math.min(16,t.rc+k*.09);
  if(t.pl){shake=Math.min(13,shake+k*.025);cam.kx-=Math.cos(t.ang)*k*.05;cam.ky-=Math.sin(t.ang)*k*.05}
  t.cd=relOf(t)/(m.alt?n:1);
}
function explodeMs(ms){
  if(ms.spin||ms.auto){spark(ms.x,ms.y,6,[ms.c,'#fff'],30,120,1.2,2.8,.15,.38);return}
  const o=ms.o,n=ms.swarm?7:10,sp=ms.swarm?240:290,sm=sz(o);
  for(let i=0;i<n;i++){const a=i/n*TAU+rr(0,.1);bl.push({x:ms.x,y:ms.y,px:ms.x,py:ms.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:(ms.swarm?4:5)*sm,dm:dmgOf(o)*(ms.swarm?.45:.55),o,l:.85,c:ms.c,team:o.team})}
  ring(ms.x,ms.y,(ms.swarm?45:75)*sm,ms.c,.3);spark(ms.x,ms.y,ms.swarm?8:12,[ms.c,'#ffd34d','#fff'],60,200,1.5,4,.22,.65);

  $('cn').textContent=(T[P.k]?T[P.k].n:'?')+(MODE==='bd'?' · '+teamName(P.team):'')+(sz(P)>1.12?' ×'+sz(P).toFixed(1):'');
  const b=[];if(P.bf.rapid>0)b.push('⚡'+P.bf.rapid.toFixed(1));if(P.bf.shield>0)b.push('◈'+P.bf.shield.toFixed(1));
  if(P.heat>.25)b.push(P.heat>=1?'🔥 OVERHEAT':'♨ '+(P.heat*100|0)+'%');
  if(autoSpin)b.push('🔄 SPIN');
  b.push(P.dash>0?'DASH '+P.dash.toFixed(1):'DASH [Space]');$('bf').textContent=b.join(' · ');
  $('vg').classList.toggle('l',!P.dead&&P.hp/mx(P)<.28);hudUps()}
function lbd(){const l=[];if(P&&!P.dead)l.push({n:'You',s:P.sc,c:T[P.k]?T[P.k].n:'?',y:1,col:P.col});for(const b of bt)l.push({n:(b.boss?'★':'')+b.name,s:b.sc,c:b.boss?b.name:(T[b.k]?T[b.k].n:'?'),col:b.col});l.sort((a,b)=>b.s-a.s);
  $('lb').innerHTML='<div style="text-align:center;color:#ffd34d;font-weight:700;margin-bottom:3px">LEADERBOARD</div>'+l.slice(0,10).map((r,i)=>'<div style="display:flex;gap:3px;padding:1px 0;'+(r.y?'font-weight:700':'')+'"><span style="width:14px;color:#aaa">'+(i+1)+'</span><span style="flex:1;color:'+(r.col||'#fff')+'">'+r.n+'</span><span style="color:#8abc3f;font-size:9px">'+r.c+'</span><span style="color:#ffd34d;width:42px;text-align:right">'+fs(r.s)+'</span></div>').join('')}

/* ---------- input ---------- */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==='tab'||k===' ')e.preventDefault();
  if(k==='`'){DBG=!DBG;$('dbg').textContent=DBG?'DEBUG Shift+L/U/H/K/B':''}
  if(k==='tab')$('lb').style.display=$('lb').style.display==='none'?'':'none';
  if(k==='e')auto=!auto;if(k==='q')autoSpin=!autoSpin;
  const n=parseInt(e.key);
  if(cur&&(state==='menu'||state==='pick')&&n>=1&&n<=cur.items.length){cur.cb(cur.items[n-1]);return}
  if(e.key==='Enter'&&state==='dead'&&cur){cur.cb(cur.items[0]);return}
  if(state!=='play'||!P)return;
  if(n>=1&&n<=7)spend(n-1);
  if(k===' '&&P.dash<=0){let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0);if(!dx&&!dy){dx=Math.cos(P.ang);dy=Math.sin(P.ang)}const l=hyp(dx,dy);P.vx+=dx/l*920;P.vy+=dy/l*920;P.dash=4;spark(P.x,P.y,10,['#fff',P.col],50,200,1.6,3.5,.15,.4);ring(P.x,P.y,50,'#fff',.2)}
  if(DBG&&e.shiftKey){if(k==='l')for(let i=0;i<5;i++)addXp(P,need(P.lv));if(k==='u')P.pts+=5;if(k==='h')P.hp=mx(P);if(k==='b')spawnBoss();
    if(k==='k'){for(const b of bt)if(hyp(b.x-P.x,b.y-P.y)<700)hurt(b,99999,P)}}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
C.addEventListener('mousemove',e=>{ms.x=e.clientX;ms.y=e.clientY});C.addEventListener('mousedown',()=>ms.d=1);addEventListener('mouseup',()=>ms.d=0);C.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- boot ---------- */
for(let i=0;i<100;i++)spawnShape();for(let i=0;i<14;i++)spawnBot();for(let i=0;i<3;i++)spawnNest();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play')update(dt);fxUpdate(dt);draw(now);hud();lbT+=dt;if(lbT>.5){lbT=0;lbd()}requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
