<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cratebound — Unboxing Simulator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@500;700;900&display=swap');

    :root {
      --bg: #05070f;
      --card: #111827;
      --accent: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #0f172a 0%, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 2.2rem 1rem 1rem;
    }
    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 5.5vw, 3.2rem);
      font-weight: 900;
      background: linear-gradient(90deg, #a5b4fc, #e879f9, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 3px;
    }
    header p {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }

    .crates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0;
    }

    .crate-card {
      background: var(--card);
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 1.6rem;
      text-align: center;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .crate-card:hover {
      transform: translateY(-8px);
      border-color: #6366f1;
      box-shadow: 0 15px 40px rgba(99, 102, 241, 0.25);
    }
    .crate-card.selected {
      border-color: #a5b4fc;
      box-shadow: 0 0 0 2px #a5b4fc, 0 15px 40px rgba(99, 102, 241, 0.35);
    }
    .crate-emoji {
      font-size: 3.8rem;
      margin-bottom: 0.9rem;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
    }
    .crate-name {
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 0.35rem;
    }
    .crate-desc {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 1.1rem;
    }
    .crate-price {
      display: inline-block;
      background: #0f172a;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fbbf24;
    }

    .open-section {
      text-align: center;
      margin: 2.8rem 0 1.5rem;
    }
    #openBtn {
      background: linear-gradient(135deg, #6366f1, #c026d3);
      color: white;
      border: none;
      padding: 1.1rem 3.8rem;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 1.5px;
      transition: all 0.2s;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.45);
    }
    #openBtn:hover:not(:disabled) {
      transform: scale(1.06);
      box-shadow: 0 14px 40px rgba(99, 102, 241, 0.6);
    }
    #openBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* ========== OPENING OVERLAY ========== */
    #openingOverlay {
      position: fixed;
      inset: 0;
      background: #02040a;
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #openingOverlay.active { display: flex; }

    .crate-visual {
      font-size: 8rem;
      z-index: 30;
      filter: drop-shadow(0 0 40px rgba(255,255,255,0.12));
      transition: transform 0.1s;
    }
    .crate-visual.shake {
      animation: hardShake 0.35s infinite;
    }
    @keyframes hardShake {
      0%, 100% { transform: translate(0,0) rotate(0); }
      15% { transform: translate(-10px, 6px) rotate(-3deg); }
      30% { transform: translate(12px, -8px) rotate(3deg); }
      45% { transform: translate(-8px, -5px) rotate(-2deg); }
      60% { transform: translate(9px, 7px) rotate(2deg); }
      75% { transform: translate(-6px, 4px) rotate(-1deg); }
    }

    /* MASSIVE WAVE LINES */
    .wave-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }
    .wave {
      position: absolute;
      top: 50%;
      right: -120%;
      width: 140%;
      height: 14px;
      transform: translateY(-50%);
      border-radius: 20px;
      opacity: 0;
      filter: blur(1px);
    }
    .wave::before {
      content: '';
      position: absolute;
      inset: -30px 0;
      background: inherit;
      filter: blur(35px);
      opacity: 0.7;
    }
    .wave::after {
      content: '';
      position: absolute;
      inset: -60px 0;
      background: inherit;
      filter: blur(70px);
      opacity: 0.35;
    }

    /* Particles */
    #particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* Full screen flash / energy */
    .screen-flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      z-index: 40;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* Final reveal */
    #revealScreen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      background: radial-gradient(circle at center, #0f172a 0%, #02040a 75%);
    }
    #revealScreen.show { display: flex; }

    .item-emoji {
      font-size: 7rem;
      margin-bottom: 1.2rem;
      animation: megaPop 0.7s cubic-bezier(0.34, 1.7, 0.64, 1);
      filter: drop-shadow(0 0 50px rgba(255,255,255,0.35));
    }
    .item-name {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 4.5vw, 2.8rem);
      font-weight: 900;
      margin-bottom: 0.5rem;
      text-align: center;
      letter-spacing: 1px;
    }
    .item-rarity {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 0.7rem;
      text-transform: uppercase;
      text-shadow: 0 0 30px currentColor;
    }
    .item-odds {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 1.8rem;
    }
    .item-desc {
      max-width: 440px;
      text-align: center;
      color: #cbd5e1;
      line-height: 1.55;
      margin-bottom: 2.8rem;
      padding: 0 1.2rem;
      font-size: 1.05rem;
    }

    #closeReveal {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      padding: 0.9rem 2.5rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #closeReveal:hover {
      background: #334155;
      border-color: #64748b;
    }

    @keyframes megaPop {
      0% { transform: scale(0.2); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .history {
      margin-top: 3.5rem;
      padding-top: 2rem;
      border-top: 1px solid #1e293b;
    }
    .history h2 {
      font-size: 1.15rem;
      margin-bottom: 1.1rem;
      color: var(--muted);
    }
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .history-item {
      background: #1e293b;
      border-radius: 12px;
      padding: 0.55rem 1rem;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      border-left: 4px solid;
    }
  </style>
</head>
<body>
  <header>
    <h1>CRATEBOUND</h1>
    <p>Unboxing Simulator — Open crates. Chase the impossible.</p>
  </header>

  <div class="container">
    <div class="crates-grid" id="cratesGrid"></div>

    <div class="open-section">
      <button id="openBtn" disabled>SELECT A CRATE</button>
    </div>

    <div class="history">
      <h2>Recent Unboxings</h2>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <!-- OPENING OVERLAY -->
  <div id="openingOverlay">
    <canvas id="particles"></canvas>
    <div class="wave-container" id="waveContainer"></div>
    <div class="screen-flash" id="screenFlash"></div>
    <div class="crate-visual" id="crateVisual">📦</div>

    <div id="revealScreen">
      <div class="item-emoji" id="itemEmoji"></div>
      <div class="item-name" id="itemName"></div>
      <div class="item-rarity" id="itemRarity"></div>
      <div class="item-odds" id="itemOdds"></div>
      <div class="item-desc" id="itemDesc"></div>
      <button id="closeReveal">Continue</button>
    </div>
  </div>

  <script>
    // ====================== DATA ======================
    const RARITIES = [
      { name: "Common",       color: "#9ca3af", weight: 4500 },
      { name: "Uncommon",     color: "#22c55e", weight: 2500 },
      { name: "Rare",         color: "#3b82f6", weight: 1400 },
      { name: "Super Rare",   color: "#60a5fa", weight: 800  },
      { name: "Epic",         color: "#a855f7", weight: 450  },
      { name: "Legendary",    color: "#fbbf24", weight: 200  },
      { name: "Mythic",       color: "#f97316", weight: 90   },
      { name: "Divine",       color: "#f8fafc", weight: 40   },
      { name: "Chroma",       color: "#ec4899", weight: 15   },
      { name: "Transcendent", color: "#e879f9", weight: 5    }
    ];

    const TOTAL_WEIGHT = RARITIES.reduce((s, r) => s + r.weight, 0);

    const CRATES = [
      {
        id: "starter",
        name: "Starter Crate",
        emoji: "📦",
        desc: "Basic gear for new explorers",
        price: "Free",
        items: [
          { name: "Rusty Dagger", emoji: "🗡️", rarity: "Common", desc: "Barely sharp. Still better than fists." },
          { name: "Cloth Bandana", emoji: "🧣", rarity: "Common", desc: "Keeps the dust out of your eyes." },
          { name: "Wooden Shield", emoji: "🛡️", rarity: "Uncommon", desc: "Cracks under pressure, but holds." },
          { name: "Spark Potion", emoji: "🧪", rarity: "Rare", desc: "A tiny burst of energy." },
          { name: "Iron Gauntlets", emoji: "🥊", rarity: "Super Rare", desc: "Heavy, reliable, slightly cold." },
          { name: "Shadow Cloak", emoji: "🧥", rarity: "Epic", desc: "Blends into darkness a little too well." },
          { name: "Phoenix Feather", emoji: "🪶", rarity: "Legendary", desc: "Warm to the touch. Never cools." },
          { name: "Void Shard", emoji: "💎", rarity: "Mythic", desc: "Whispers in a language you almost understand." },
          { name: "Celestial Key", emoji: "🔑", rarity: "Divine", desc: "Opens doors that shouldn't exist." },
          { name: "Prism Core", emoji: "🔮", rarity: "Chroma", desc: "Refracts reality itself." },
          { name: "Origin Fragment", emoji: "✨", rarity: "Transcendent", desc: "A piece of the first light." }
        ]
      },
      {
        id: "mystic",
        name: "Mystic Crate",
        emoji: "🔮",
        desc: "Arcane relics from forgotten realms",
        price: "150 Coins",
        items: [
          { name: "Mana Dust", emoji: "✨", rarity: "Common", desc: "Faintly glows at night." },
          { name: "Rune Scroll", emoji: "📜", rarity: "Uncommon", desc: "Words that shift when you look away." },
          { name: "Crystal Orb", emoji: "🔮", rarity: "Rare", desc: "Shows glimpses of parallel paths." },
          { name: "Echo Blade", emoji: "⚔️", rarity: "Super Rare", desc: "Every swing leaves a ghostly afterimage." },
          { name: "Astral Robe", emoji: "👘", rarity: "Epic", desc: "Stars move across the fabric." },
          { name: "Dragon Scale", emoji: "🐉", rarity: "Legendary", desc: "Still radiates residual heat." },
          { name: "Time Hourglass", emoji: "⏳", rarity: "Mythic", desc: "Sand flows both ways." },
          { name: "Godslayer Edge", emoji: "🗡️", rarity: "Divine", desc: "Forged to end immortality." },
          { name: "Rainbow Anomaly", emoji: "🌈", rarity: "Chroma", desc: "Doesn't obey the laws of color." },
          { name: "The First Spark", emoji: "⚡", rarity: "Transcendent", desc: "The moment existence began." }
        ]
      },
      {
        id: "void",
        name: "Void Crate",
        emoji: "🌑",
        desc: "Dangerous artifacts from the abyss",
        price: "400 Coins",
        items: [
          { name: "Black Dust", emoji: "🌫️", rarity: "Common", desc: "Absorbs nearby light." },
          { name: "Whisper Mask", emoji: "🎭", rarity: "Uncommon", desc: "You hear things that aren't there." },
          { name: "Abyss Fang", emoji: "🦷", rarity: "Rare", desc: "Never stops dripping shadow." },
          { name: "Null Ring", emoji: "💍", rarity: "Super Rare", desc: "Removes one memory at a time." },
          { name: "Horror Relic", emoji: "👁️", rarity: "Epic", desc: "It blinks when you don't look." },
          { name: "Oblivion Crown", emoji: "👑", rarity: "Legendary", desc: "Wear it and forget your name." },
          { name: "Endless Hunger", emoji: "🕳️", rarity: "Mythic", desc: "It grows the more you feed it." },
          { name: "Silent God", emoji: "🤫", rarity: "Divine", desc: "A presence that demands nothing... yet." },
          { name: "Chromatic Void", emoji: "🌀", rarity: "Chroma", desc: "All colors collapse into one." },
          { name: "The End of All", emoji: "💀", rarity: "Transcendent", desc: "There is nothing after this." }
        ]
      }
    ];

    // ====================== STATE ======================
    let selectedCrate = null;
    let isOpening = false;
    const history = [];

    // ====================== UI ======================
    const cratesGrid = document.getElementById('cratesGrid');
    const openBtn = document.getElementById('openBtn');
    const openingOverlay = document.getElementById('openingOverlay');
    const crateVisual = document.getElementById('crateVisual');
    const waveContainer = document.getElementById('waveContainer');
    const screenFlash = document.getElementById('screenFlash');
    const revealScreen = document.getElementById('revealScreen');
    const historyList = document.getElementById('historyList');
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    CRATES.forEach(crate => {
      const card = document.createElement('div');
      card.className = 'crate-card';
      card.innerHTML = `
        <div class="crate-emoji">${crate.emoji}</div>
        <div class="crate-name">${crate.name}</div>
        <div class="crate-desc">${crate.desc}</div>
        <div class="crate-price">${crate.price}</div>
      `;
      card.addEventListener('click', () => selectCrate(crate, card));
      cratesGrid.appendChild(card);
    });

    function selectCrate(crate, cardEl) {
      if (isOpening) return;
      selectedCrate = crate;
      document.querySelectorAll('.crate-card').forEach(c => c.classList.remove('selected'));
      cardEl.classList.add('selected');
      openBtn.disabled = false;
      openBtn.textContent = `OPEN ${crate.name.toUpperCase()}`;
    }

    openBtn.addEventListener('click', () => {
      if (!selectedCrate || isOpening) return;
      startOpening();
    });

    document.getElementById('closeReveal').addEventListener('click', () => {
      openingOverlay.classList.remove('active');
      revealScreen.classList.remove('show');
      isOpening = false;
      openBtn.disabled = false;
      openBtn.textContent = `OPEN ${selectedCrate.name.toUpperCase()}`;
      // clean residual waves
      waveContainer.innerHTML = '';
    });

    // ====================== CORE ======================
    function rollRarity() {
      let roll = Math.random() * TOTAL_WEIGHT;
      for (const r of RARITIES) {
        if (roll < r.weight) return r;
        roll -= r.weight;
      }
      return RARITIES[0];
    }

    function getItemForRarity(crate, rarityName) {
      const pool = crate.items.filter(i => i.rarity === rarityName);
      if (pool.length === 0) return crate.items[Math.floor(Math.random() * crate.items.length)];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function getOddsText(rarityName) {
      const r = RARITIES.find(x => x.name === rarityName);
      if (!r) return "";
      const oneIn = Math.round(TOTAL_WEIGHT / r.weight);
      return `1 in ${oneIn.toLocaleString()}`;
    }

    // ====================== WAVE SYSTEM ======================
    function createWave(color, intensity = 1) {
      const wave = document.createElement('div');
      wave.className = 'wave';
      wave.style.background = color;
      wave.style.height = `${10 + intensity * 6}px`;
      wave.style.boxShadow = `0 0 ${40 + intensity * 30}px ${color}`;
      waveContainer.appendChild(wave);
      return wave;
    }

    function fireWave(color, intensity = 1) {
      return new Promise(resolve => {
        const wave = createWave(color, intensity);
        
        // Force reflow
        wave.offsetHeight;

        wave.style.transition = `right ${0.55 + intensity * 0.08}s cubic-bezier(0.22, 0.8, 0.3, 1), opacity 0.15s`;
        wave.style.right = '-20%';
        wave.style.opacity = '1';

        // Particles along the wave
        spawnWaveParticles(color, 18 + intensity * 12, intensity > 4);

        // Screen flash for high tiers
        if (intensity >= 5) {
          flashScreen(color, 0.15 + intensity * 0.04);
        }

        // Camera shake
        if (intensity >= 4) {
          hardShake(intensity);
        }

        setTimeout(() => {
          wave.style.opacity = '0';
          setTimeout(() => wave.remove(), 300);
          resolve();
        }, 580 + intensity * 70);
      });
    }

    function flashScreen(color, strength = 0.25) {
      screenFlash.style.background = color;
      screenFlash.style.opacity = strength;
      screenFlash.style.transition = 'opacity 0.08s';
      setTimeout(() => {
        screenFlash.style.transition = 'opacity 0.45s';
        screenFlash.style.opacity = '0';
      }, 80);
    }

    function hardShake(intensity) {
      const amount = 6 + intensity * 3;
      document.body.style.transition = 'none';
      document.body.style.transform = `translate(${(Math.random()-0.5)*amount*2}px, ${(Math.random()-0.5)*amount}px)`;
      setTimeout(() => {
        document.body.style.transition = 'transform 0.08s';
        document.body.style.transform = '';
      }, 60);
    }

    // ====================== OPENING SEQUENCE ======================
    async function startOpening() {
      isOpening = true;
      openBtn.disabled = true;
      openBtn.textContent = "OPENING...";

      // Reset
      waveContainer.innerHTML = '';
      revealScreen.classList.remove('show');
      crateVisual.textContent = selectedCrate.emoji;
      crateVisual.classList.add('shake');
      openingOverlay.classList.add('active');

      // Roll result
      const finalRarity = rollRarity();
      const finalItem = getItemForRarity(selectedCrate, finalRarity.name);
      const finalIndex = RARITIES.findIndex(r => r.name === finalRarity.name);

      // Initial quiet moment + shake
      await sleep(900);

      // Fire waves from Common up to final rarity
      for (let i = 0; i <= finalIndex; i++) {
        const r = RARITIES[i];
        const intensity = i;               // 0 = Common … 9 = Transcendent
        const isFinal = i === finalIndex;

        await fireWave(r.color, intensity);

        // Extra pause + bigger effects right before the final wave ends
        if (isFinal) {
          await sleep(200);
          // Final massive burst
          spawnWaveParticles(r.color, 80 + i * 25, true);
          if (i >= 7) {
            // Divine / Chroma / Transcendent extra chaos
            for (let k = 0; k < 5; k++) {
              setTimeout(() => {
                spawnWaveParticles(r.color, 50, true);
                flashScreen(r.color, 0.3);
              }, k * 90);
            }
          }
        } else {
          // Short gap between waves (gets slightly longer near the top)
          await sleep(Math.max(90, 160 - i * 8));
        }
      }

      // Dramatic silence
      crateVisual.classList.remove('shake');
      await sleep(750);

      // Final explosion
      spawnWaveParticles(finalRarity.color, 120 + finalIndex * 20, true);
      flashScreen(finalRarity.color, 0.55);
      hardShake(finalIndex + 3);

      await sleep(600);

      showReveal(finalItem, finalRarity);
    }

    function showReveal(item, rarity) {
      document.getElementById('itemEmoji').textContent = item.emoji;
      document.getElementById('itemName').textContent = item.name;
      document.getElementById('itemRarity').textContent = rarity.name;
      document.getElementById('itemRarity').style.color = rarity.color;
      document.getElementById('itemOdds').textContent = getOddsText(rarity.name);
      document.getElementById('itemDesc').textContent = item.desc;

      revealScreen.classList.add('show');

      history.unshift({ item, rarity, crate: selectedCrate.name });
      if (history.length > 14) history.pop();
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = history.map(h => `
        <div class="history-item" style="border-color: ${h.rarity.color}">
          <span>${h.item.emoji}</span>
          <span>${h.item.name}</span>
          <span style="color:${h.rarity.color}; font-size:0.78rem; font-weight:600">${h.rarity.name}</span>
        </div>
      `).join('');
    }

    // ====================== PARTICLES ======================
    const particles = [];

    function spawnWaveParticles(color, count = 25, big = false) {
      const cy = canvas.height * 0.5;
      for (let i = 0; i < count; i++) {
        const x = canvas.width * (0.1 + Math.random() * 0.8);
        const angle = (Math.random() - 0.5) * Math.PI * 1.4;
        const speed = (big ? 5 : 2.5) + Math.random() * (big ? 11 : 5);
        particles.push({
          x,
          y: cy + (Math.random() - 0.5) * 40,
          vx: Math.cos(angle) * speed * (Math.random() > 0.5 ? 1 : -1),
          vy: Math.sin(angle) * speed - (big ? 3 : 1),
          life: 1,
          decay: 0.008 + Math.random() * 0.015,
          size: (big ? 3.5 : 1.8) + Math.random() * (big ? 6 : 3),
          color,
          glow: big
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.07;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = p.life * 0.9;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.glow ? 25 : 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
</body>
</html>
