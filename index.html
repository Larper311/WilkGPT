};

/* ---------- tank math ---------- */

const dmgOf=t=>(8+t.st.bdmg*4.6)*(M(t).dmg||1)*(pk(t,'sharp')?1.2:1)*(.9+sz(t)*.1);

function mk(x,y,k,pl){const st={};S.forEach(s=>st[s[0]]=0);return{x,y,vx:0,vy:0,ang:rr(0,TAU),k,pl,col:pl?T[k].c:pick(COLS),st,hp:100,hpv:100,lv:1,xp:0,sc:0,pts:0,cd:0,rc:0,fl:0,bi:0,pk:{},bf:{rapid:0,shield:0},dash:0,name:pl?'You':pick(NAMES),ps:pick(Object.keys(PS)),dead:0,ai:0,aim:rr(0,TAU),sd:R()<.5?1:-1,sp:0,pn:0}}
/* ---------- fx helpers ---------- */

const ring=(x,y,mr,c,l)=>rg.push({x,y,r:0,mr,l:l||.4,m:l||.4,c});
const flt=(x,y,t,c,s)=>{if(ft.length<60)ft.push({x,y,t,c,s:s||13,l:.9})};
function ban(t,c){const b=$('ban');b.textContent=t;b.style.color=c||'#fff';b.classList.remove('s');void b.offsetWidth;b.classList.add('s')}
/* ---------- combat ---------- */
function fire(t){const d=T[t.k],m=d.m,s=sz(t),n=d.b.length,bs=m.alt?[d.b[t.bi++%n]]:d.b,r=rad(t);
 for(const b of bs){const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.6*s)-Math.sin(t.ang)*(b.o||0)*s,ty=t.y+Math.sin(a)*(r+b.l*.6*s)+Math.cos(t.ang)*(b.o||0)*s;
  for(let i=0;i<1+(m.pel||0);i++){const aa=a+(m.spr?(R()-.5)*m.spr:0),sp=bspd(t)*(m.pel?rr(.75,1.25):1);

function hurtShape(s,dm,from){if(s.dead)return;s.hp-=dm;s.fl=.1;if(s.hp<=0){s.dead=1;spark(s.x,s.y,8,[s.col,'#fff'],40,160,1.4,4,.2,.5);ring(s.x,s.y,s.r*1.6,s.col,.3);if(from&&!from.dead)addXp(from,s.xp);if(s.sd>=6||R()<.05)drop(s.x,s.y,1);setTimeout(spawnShape,3000)}}
function drop(x,y,n){for(let i=0;i<n;i++)pu.push({x:x+rr(-25,25),y:y+rr(-25,25),k:pick(Object.keys(PU)),l:22})}
function addXp(t,a){if(pk(t,'sch'))a*=1.15;t.xp+=a;t.sc+=a;let up=0;
 while(t.xp>=need(t.lv)){t.xp-=need(t.lv);t.lv++;t.pts++;t.hp=Math.min(mx(t),t.hp+mx(t)*.3);up=1;
  if(!t.pl){const k=pick(S)[0];if(t.st[k]<8){t.st[k]++;t.pts--}const d=T[t.k];if(d.up.length&&t.lv>=d.lv)t.k=pick(d.up)}}
 if(up&&t.pl){flt(t.x,t.y-rad(t)-20,'LEVEL UP!','#ffd34d',18);ring(t.x,t.y,70*sz(t),'#ffd34d',.45);spark(t.x,t.y,14,['#ffd34d','#fff'],60,200,2,4,.3,.7);chk()}}
/* ---------- evolution + perks ---------- */
function chk(){if(!P||P.dead||state!=='play')return;const d=T[P.k];
 if(d.up.length&&P.lv>=d.lv){state='pick';ov('EVOLVE','Choose your next class',d.up.map(k=>({k,n:T[k].n,d:T[k].d})),it=>{P.k=it.k;P.col=T[it.k].c;P.hp=Math.min(mx(P),P.hp+60);ring(P.x,P.y,110*sz(P),P.col,.5);spark(P.x,P.y,26,[P.col,'#fff'],60,240,2,5.5,.3,.8);flt(P.x,P.y-40,T[it.k].n.toUpperCase()+'!','#ffd34d',18);state='play';hide();chk()});return}

/* ---------- overlay ---------- */

function menu(){state='menu';ov('TANK ARENA v8','Choose your class',STARTERS.map(k=>({k,n:T[k].n,d:T[k].d})),start)}
function start(it){const p=safe();P=mk(p.x,p.y,it.k,1);P.hp=P.hpv=mx(P);P.spawn=0;state='play';streak=0;bossT=45;hide();buildUps();ring(P.x,P.y,90,P.col,.5);spark(P.x,P.y,16,[P.col,'#fff'],45,170,2,4.5,.2,.6)}
function safe(){for(let i=0;i<40;i++){const x=rr(300,WW-300),y=rr(300,WW-300);if(!bt.some(b=>hyp(b.x-x,b.y-y)<800))return{x,y}}return{x:WW/2,y:WW/2}}
/* ---------- spawning ---------- */

/* ---------- ai ---------- */
function ai(b,dt,all){const p=PS[b.ps];let tg=null,bd=1e9;
 for(const o of all)if(o!==b&&!o.dead){const d=hyp(o.x-b.x,o.y-b.y);if(d<bd&&d<p.rg*1.1){bd=d;tg=o}}

/* ---------- update ---------- */
function update(dt){const all=P&&!P.dead?[P,...bt]:bt;
