<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tank Prototype — Arras-style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #555; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud-top {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    width: 340px; text-align: center; color: #fff; user-select: none;
  }
  #levelbar-wrap {
    height: 22px; background: rgba(0,0,0,.45); border: 2px solid #222;
    border-radius: 4px; overflow: hidden; position: relative;
  }
  #levelbar { height: 100%; width: 0%; background: #8abc3f; transition: width .15s; }
  #leveltext {
    position: absolute; inset: 0; line-height: 20px; font-size: 13px; font-weight: bold;
    text-shadow: 1px 1px 0 #000;
  }
  #score { margin-top: 4px; font-size: 15px; font-weight: bold; text-shadow: 1px 1px 0 #000; }

  /* ---------- Upgrade panel ---------- */
  #upgrades {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  }
  .upbtn {
    background: rgba(0,0,0,.5); border: 2px solid #222; color: #fff;
    padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
    text-align: center; min-width: 92px; user-select: none;
  }
  .upbtn:hover { background: rgba(255,255,255,.15); }
  .upbtn b { display: block; font-size: 11px; }
  .upbtn .pips { letter-spacing: 2px; color: #8abc3f; }
  .upbtn .key { color: #ffd34d; font-weight: bold; }

  #points {
    position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
    color: #ffd34d; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 0 #000;
    display: none; user-select: none;
  }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(0,0,0,.55); color: #fff; text-align: center; z-index: 10;
  }
  .overlay h1 { font-size: 42px; text-shadow: 2px 2px 0 #000; }
  .overlay p { font-size: 16px; color: #ddd; line-height: 1.6; }
  .hidden { display: none !important; }
</style>
<base target="_blank">
</head>
<body>

<div id="hud-top">
  <div id="levelbar-wrap"><div id="levelbar"></div><div id="leveltext">Level 1</div></div>
  <div id="score">Score: 0</div>
</div>

<div id="points">Upgrade points: 0 (press 1–7 or click)</div>
<div id="upgrades"></div>

<div class="overlay hidden" id="death-overlay">
  <h1>You were destroyed</h1>
  <p id="death-stats"></p>
  <p>Press <b>Enter</b> to respawn</p>
</div>

<canvas id="game"></canvas>

<script>
'use strict';
/* =====================================================================
   ARRAS-STYLE TANK PROTOTYPE
   ---------------------------------------------------------------------
   TANKS: define tank types here. Barrels are listed per-tank:
     angle  = direction relative to tank facing (radians)
     length / width = barrel dimensions
     offset = perpendicular shift from center (for multi-barrel tanks)
   Add new types later, e.g.:
     twin:  barrels: [{angle:0,length:38,width:16,offset:-10},
                     {angle:0,length:38,width:16,offset: 10}]
   ===================================================================== */
const TANKS = {
  basic: {
    name: 'Basic Tank',
    radius: 26,
    color: '#00b2e1',
    barrels: [ { angle: 0, length: 40, width: 18, offset: 0 } ]
  }
};

/* ---------------- Shape (polygon) definitions ---------------- */
const SHAPE_TYPES = {
  square:   { sides: 4, radius: 26, hp: 30,  xp: 10,  score: 10,  color: '#ffe763', bodyDmg: 8  },
  triangle: { sides: 3, radius: 24, hp: 70,  xp: 25,  score: 25,  color: '#fc7677', bodyDmg: 12 },
  pentagon: { sides: 5, radius: 34, hp: 220, xp: 130, score: 130, color: '#768cfc', bodyDmg: 20 }
};
const SHAPE_COUNTS = { square: 60, triangle: 32, pentagon: 12 };

/* ---------------- Canvas / world ---------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

const WORLD = { w: 4200, h: 4200 };
const GRID = 48;

/* ---------------- Stat system ---------------- */
const STAT_DEFS = [
  { key: 'regen',      name: 'Health Regen' },
  { key: 'maxHp',      name: 'Max Health'   },
  { key: 'bodyDmg',    name: 'Body Damage'  },
  { key: 'bulletSpd',  name: 'Bullet Speed' },
  { key: 'bulletDmg',  name: 'Bullet Damage'},
  { key: 'reload',     name: 'Reload'       },
  { key: 'moveSpd',    name: 'Move Speed'   }
];
const MAX_STAT = 8;

/* ---------------- Entities ---------------- */
let bullets = [];   // {x,y,vx,vy,radius,dmg,owner,life}
let shapes  = [];   // {x,y,type,hp,maxHp,rot,hurtFlash}
let enemies = [];   // ai tanks
let player  = null;

function makeStats() {
  const s = {}; STAT_DEFS.forEach(d => s[d.key] = 0); return s;
}

function createTank(x, y, typeKey, isPlayer) {
  const t = TANKS[typeKey];
  return {
    x, y, angle: 0, typeKey, isPlayer,
    radius: t.radius, color: t.color,
    stats: makeStats(),
    hp: 100, level: 1, xp: 0, score: 0, upgradePoints: 0,
    fireCd: 0, recoil: 0, dead: false,
    hitCd: 0,                     // body-contact damage cooldown
    // ai fields
    aiTarget: null, aiCd: 0, aiAngle: Math.random() * Math.PI * 2
  };
}

/* ---------------- Derived stats ---------------- */
function maxHpOf(t)     { return 100 + t.stats.maxHp * 22; }
function regenOf(t)     { return 0.4 + t.stats.regen * 0.55; }        // hp / second
function bodyDmgOf(t)   { return 10 + t.stats.bodyDmg * 5; }          // dps on contact
function bulletDmgOf(t) { return 9  + t.stats.bulletDmg * 5.5; }
function bulletSpdOf(t) { return 380 + t.stats.bulletSpd * 34; }      // px / second
function reloadOf(t)    { return Math.max(120, 550 * Math.pow(0.87, t.stats.reload)); } // ms
function moveSpdOf(t)   { return 170 + t.stats.moveSpd * 14; }        // px / second

function xpToNext(level) { return Math.round(14 * Math.pow(level, 1.7)); }

function addXp(t, amount) {
  t.xp += amount; t.score += amount;
  while (t.xp >= xpToNext(t.level)) {
    t.xp -= xpToNext(t.level);
    t.level++; t.upgradePoints++;
    t.hp = maxHpOf(t); // full heal on level up
  }
}

/* ---------------- Spawning ---------------- */
function spawnShape(forceType) {
  const keys = Object.keys(SHAPE_TYPES);
  const type = forceType || keys[Math.floor(Math.random() * keys.length)];
  const def = SHAPE_TYPES[type];
  shapes.push({
    x: 60 + Math.random() * (WORLD.w - 120),
    y: 60 + Math.random() * (WORLD.h - 120),
    type, def, hp: def.hp, maxHp: def.hp,
    rot: Math.random() * Math.PI * 2, hurtFlash: 0
  });
}

function spawnEnemy() {
  // spawn away from player
  let x, y, tries = 0;
  do {
    x = Math.random() * WORLD.w; y = Math.random() * WORLD.h; tries++;
  } while (player && Math.hypot(x - player.x, y - player.y) < 700 && tries < 20);

  const e = createTank(x, y, 'basic', false);
  e.color = ['#f14e54', '#bf7ff5', '#f5c77f'][Math.floor(Math.random() * 3)];
  e.level = 8 + Math.floor(Math.random() * 20);
  // random stat allocation
  let pts = e.level - 1;
  while (pts-- > 0) e.stats[STAT_DEFS[Math.floor(Math.random() * STAT_DEFS.length)].key]++;
  e.hp = maxHpOf(e);
  addXp(e, 0);
  enemies.push(e);
}

function initWorld() {
  bullets = []; shapes = []; enemies = [];
  player = createTank(WORLD.w / 2, WORLD.h / 2, 'basic', true);
  player.name = 'You';
  for (const [t, n] of Object.entries(SHAPE_COUNTS)) for (let i = 0; i < n; i++) spawnShape(t);
  for (let i = 0; i < 8; i++) spawnEnemy();
}

/* ---------------- Input ---------------- */
const keys = {};
const mouse = { x: 0, y: 0, down: false };
let autoFire = false;

addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'e') autoFire = !autoFire;
  const n = parseInt(e.key);
  if (n >= 1 && n <= STAT_DEFS.length) spendPoint(STAT_DEFS[n - 1].key);
  if (e.key === 'Enter' &&
      !document.getElementById('death-overlay').classList.contains('hidden')) {
    respawn();
  }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => mouse.down = true);
addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- Upgrades UI ---------------- */
function buildUpgradeUI() {
  const box = document.getElementById('upgrades');
  box.innerHTML = '';
  STAT_DEFS.forEach((d, i) => {
    const b = document.createElement('div');
    b.className = 'upbtn';
    b.id = 'up-' + d.key;
    b.onclick = () => spendPoint(d.key);
    box.appendChild(b);
  });
  refreshUpgradeUI();
}
function refreshUpgradeUI() {
  STAT_DEFS.forEach((d, i) => {
    const b = document.getElementById('up-' + d.key);
    const v = player.stats[d.key];
    const pips = '●'.repeat(v) + '○'.repeat(MAX_STAT - v);
    b.innerHTML = `<span class="key">[${i + 1}]</span> <b>${d.name}</b><span class="pips">${pips}</span>`;
    b.style.opacity = (player.upgradePoints > 0 && v < MAX_STAT) ? 1 : 0.55;
  });
  const p = document.getElementById('points');
  p.style.display = player.upgradePoints > 0 ? 'block' : 'none';
  p.textContent = `Upgrade points: ${player.upgradePoints} (press 1–7 or click)`;
}
function spendPoint(key) {
  if (player.dead || player.upgradePoints <= 0 || player.stats[key] >= MAX_STAT) return;
  player.upgradePoints--;
  player.stats[key]++;
  if (key === 'maxHp') player.hp += 22;
  refreshUpgradeUI();
}

/* ---------------- Combat ---------------- */
function fire(t) {
  const def = TANKS[t.typeKey];
  for (const b of def.barrels) {
    const a = t.angle + b.angle;
    const px = t.x + Math.cos(t.angle) * (t.radius + b.length * 0.55) - Math.sin(t.angle) * b.offset;
    const py = t.y + Math.sin(t.angle) * (t.radius + b.length * 0.55) + Math.cos(t.angle) * b.offset;
    const sp = bulletSpdOf(t);
    bullets.push({
      x: px, y: py,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      radius: 8 + t.stats.bulletDmg * 0.5,
      dmg: bulletDmgOf(t), owner: t, life: 1.6
    });
  }
  t.fireCd = reloadOf(t);
  t.recoil = 7;
}

function damageTank(t, dmg) {
  if (t.dead) return;
  t.hp -= dmg;
  if (t.hp <= 0) {
    t.dead = true;
    if (t.isPlayer) {
      document.getElementById('death-stats').textContent =
        `Level ${t.level} · Score ${t.score}`;
      document.getElementById('death-overlay').classList.remove('hidden');
    } else {
      if (player && !player.dead) { addXp(player, 250); }
      const idx = enemies.indexOf(t);
      if (idx >= 0) enemies.splice(idx, 1);
      setTimeout(spawnEnemy, 2000);
    }
  }
}

function damageShape(s, dmg, idx) {
  s.hp -= dmg; s.hurtFlash = 0.1;
  if (s.hp <= 0) {
    shapes.splice(idx, 1);
    if (player && !player.dead) addXp(player, s.def.xp);
    setTimeout(() => spawnShape(s.type), 3000);
  }
}

function respawn() {
  document.getElementById('death-overlay').classList.add('hidden');
  initWorld();
  refreshUpgradeUI();
}

/* ---------------- Update ---------------- */
function update(dt) {
  if (player.dead) return;

  /* --- player movement --- */
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const len = Math.hypot(dx, dy) || 1;
  const spd = moveSpdOf(player);
  player.x = Math.max(player.radius, Math.min(WORLD.w - player.radius, player.x + dx / len * spd * dt));
  player.y = Math.max(player.radius, Math.min(WORLD.h - player.radius, player.y + dy / len * spd * dt));

  player.angle = Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);

  /* --- firing --- */
  player.fireCd -= dt * 1000;
  if ((mouse.down || autoFire) && player.fireCd <= 0) fire(player);
  player.recoil = Math.max(0, player.recoil - dt * 30);
  player.hp = Math.min(maxHpOf(player), player.hp + regenOf(player) * dt);

  /* --- enemies AI --- */
  for (const e of enemies) {
    const distP = Math.hypot(player.x - e.x, player.y - e.y);
    if (distP < 560 && !player.dead) {
      e.angle = Math.atan2(player.y - e.y, player.x - e.x) + (Math.random() - 0.5) * 0.12;
      // approach but keep some distance
      const want = 260;
      const dir = distP > want ? 1 : -0.6;
      const espd = moveSpdOf(e) * 0.82;
      e.x += Math.cos(e.angle) * espd * dir * dt;
      e.y += Math.sin(e.angle) * espd * dir * dt;
      e.fireCd -= dt * 1000;
      if (e.fireCd <= 0) fire(e);
    } else {
      // wander
      e.aiCd -= dt;
      if (e.aiCd <= 0) { e.aiAngle = Math.random() * Math.PI * 2; e.aiCd = 2 + Math.random() * 3; }
      e.angle = e.aiAngle;
      e.x += Math.cos(e.aiAngle) * moveSpdOf(e) * 0.4 * dt;
      e.y += Math.sin(e.aiAngle) * moveSpdOf(e) * 0.4 * dt;
      e.fireCd = Math.max(e.fireCd, 300);
    }
    e.recoil = Math.max(0, e.recoil - dt * 30);
    e.hp = Math.min(maxHpOf(e), e.hp + regenOf(e) * dt);
    e.x = Math.max(e.radius, Math.min(WORLD.w - e.radius, e.x));
    e.y = Math.max(e.radius, Math.min(WORLD.h - e.radius, e.y));
    e.hitCd -= dt;
  }

  /* --- bullets --- */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < 0 || b.x > WORLD.w || b.y < 0 || b.y > WORLD.h) { bullets.splice(i, 1); continue; }

    // bullets vs shapes
    let hit = false;
    for (let j = shapes.length - 1; j >= 0; j--) {
      const s = shapes[j];
      if (Math.hypot(b.x - s.x, b.y - s.y) < b.radius + s.def.radius) {
        damageShape(s, b.dmg, j); hit = true; break;
      }
    }
    if (hit) { bullets.splice(i, 1); continue; }

    // bullets vs tanks
    const targets = b.owner.isPlayer ? enemies : [player];
    for (const t of targets) {
      if (!t.dead && Math.hypot(b.x - t.x, b.y - t.y) < b.radius + t.radius) {
        damageTank(t, b.dmg); hit = true; break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }

  /* --- body contact damage --- */
  function contact(t, other, dt) {
    t.hitCd -= 0; // (per-tank cooldown handled below via t.hitCd)
    if (Math.hypot(t.x - other.x, t.y - other.y) < t.radius + other.radius) {
      if (t.hitCd <= 0) { damageTank(other, bodyDmgOf(t)); t.hitCd = 0.4; }
      // push apart
      const a = Math.atan2(t.y - other.y, t.x - other.x);
      t.x += Math.cos(a) * 40 * dt; t.y += Math.sin(a) * 40 * dt;
    }
  }
  player.hitCd -= dt;
  for (const e of enemies) {
    contact(player, e, dt);
    contact(e, player, dt);
  }
  for (let j = shapes.length - 1; j >= 0; j--) {
    const s = shapes[j];
    if (Math.hypot(player.x - s.x, player.y - s.y) < player.radius + s.def.radius) {
      if (player.hitCd <= 0) { damageTank(player, s.def.bodyDmg); player.hitCd = 0.4; }
    }
    for (const e of enemies) {
      if (Math.hypot(e.x - s.x, e.y - s.y) < e.radius + s.def.radius) {
        if (e.hitCd <= 0) { damageTank(e, s.def.bodyDmg); e.hitCd = 0.4; }
      }
    }
  }

  /* --- shape hurt flash timer --- */
  for (const s of shapes) s.hurtFlash = Math.max(0, s.hurtFlash - dt);
}

/* ---------------- Drawing ---------------- */
function drawGrid(camX, camY) {
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  const startX = Math.floor(camX / GRID) * GRID;
  const startY = Math.floor(camY / GRID) * GRID;
  ctx.beginPath();
  for (let x = startX; x < camX + canvas.width; x += GRID) { ctx.moveTo(x, camY); ctx.lineTo(x, camY + canvas.height); }
  for (let y = startY; y < camY + canvas.height; y += GRID) { ctx.moveTo(camX, y); ctx.lineTo(camX + canvas.width, y); }
  ctx.stroke();
  // world border
  ctx.strokeStyle = '#222'; ctx.lineWidth = 6;
  ctx.strokeRect(0, 0, WORLD.w, WORLD.h);
}

function drawShape(s, camX, camY) {
  const x = s.x - camX, y = s.y - camY;
  if (x < -60 || y < -60 || x > canvas.width + 60 || y > canvas.height + 60) return;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(s.rot);
  ctx.beginPath();
  for (let i = 0; i < s.def.sides; i++) {
    const a = i / s.def.sides * Math.PI * 2;
    const px = Math.cos(a) * s.def.radius, py = Math.sin(a) * s.def.radius;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = s.hurtFlash > 0 ? '#ffffff' : s.def.color;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 4;
  ctx.fill(); ctx.stroke();
  ctx.restore();
  // hp bar
  if (s.hp < s.maxHp) {
    ctx.fillStyle = '#000'; ctx.fillRect(x - 20, y - s.def.radius - 12, 40, 5);
    ctx.fillStyle = '#8abc3f'; ctx.fillRect(x - 20, y - s.def.radius - 12, 40 * (s.hp / s.maxHp), 5);
  }
}

function drawTank(t, camX, camY) {
  const x = t.x - camX, y = t.y - camY;
  if (x < -80 || y < -80 || x > canvas.width + 80 || y > canvas.height + 80) return;
  const def = TANKS[t.typeKey];

  // barrels
  for (const b of def.barrels) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(t.angle + b.angle);
    ctx.translate(-t.recoil, b.offset);
    ctx.fillStyle = '#999';
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 3;
    const bl = b.length, bw = b.width;
    ctx.beginPath();
    ctx.rect(t.radius * 0.55 - bl * 0.45, -bw / 2, bl, bw);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // body
  ctx.beginPath();
  ctx.arc(x, y, t.radius, 0, Math.PI * 2);
  ctx.fillStyle = t.color;
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 4;
  ctx.fill(); ctx.stroke();

  // name + hp bar
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
  ctx.fillText(t.isPlayer ? 'You' : 'Bot (Lv ' + t.level + ')', x, y - t.radius - 16);
  ctx.fillStyle = '#000'; ctx.fillRect(x - 26, y - t.radius - 12, 52, 6);
  ctx.fillStyle = '#8abc3f'; ctx.fillRect(x - 26, y - t.radius - 12, 52 * Math.max(0, t.hp / maxHpOf(t)), 6);
}

function drawMinimap() {
  const size = 140, pad = 12;
  const mx = canvas.width - size - pad, my = canvas.height - size - pad;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(mx, my, size, size);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(mx, my, size, size);
  const sx = size / WORLD.w, sy = size / WORLD.h;
  for (const s of shapes) {
    if (s.type === 'pentagon') { ctx.fillStyle = '#768cfc'; ctx.fillRect(mx + s.x * sx - 1, my + s.y * sy - 1, 3, 3); }
  }
  for (const e of enemies) { ctx.fillStyle = '#f14e54'; ctx.fillRect(mx + e.x * sx - 1.5, my + e.y * sy - 1.5, 3, 3); }
  if (!player.dead) { ctx.fillStyle = '#fff'; ctx.fillRect(mx + player.x * sx - 2, my + player.y * sy - 2, 4, 4); }
}

/* ---------------- HUD refresh ---------------- */
function refreshHud() {
  const need = xpToNext(player.level);
  document.getElementById('levelbar').style.width = (player.xp / need * 100) + '%';
  document.getElementById('leveltext').textContent = `Level ${player.level}`;
  document.getElementById('score').textContent = 'Score: ' + player.score;
}

/* ---------------- Main loop ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);

  const camX = player.x - canvas.width / 2;
  const camY = player.y - canvas.height / 2;

  ctx.fillStyle = '#b9b9b9'; // arras-like background
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawGrid(camX, camY);
  for (const s of shapes) drawShape(s, camX, camY);

  // bullets
  for (const b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x - camX, b.y - camY, b.radius, 0, Math.PI * 2);
    ctx.fillStyle = b.owner.isPlayer ? '#00e0ff' : '#ffd34d';
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 3;
    ctx.fill(); ctx.stroke();
  }

  for (const e of enemies) drawTank(e, camX, camY);
  if (!player.dead) drawTank(player, camX, camY);

  drawMinimap();
  refreshHud();
  requestAnimationFrame(loop);
}

/* ---------------- Boot ---------------- */
initWorld();
buildUpgradeUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
