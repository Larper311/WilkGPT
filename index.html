<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Neon Rocket League 2D – Side View</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --orange: #ff6b00; --orange-glow: #ff9500;
      --blue: #00b4ff; --blue-glow: #00e5ff;
      --bg: #070b14; --neon: #00ffcc;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); font-family: 'Rajdhani', sans-serif;
      color: #fff; user-select: none; -webkit-user-select: none;
    }
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #0d1525 0%, #05070c 70%);
    }
    #gameCanvas {
      display: block; background: #0a101c;
      box-shadow: 0 0 50px rgba(0,180,255,0.12), 0 0 90px rgba(255,107,0,0.08);
      border-radius: 6px; max-width: 100%; max-height: 100%;
    }
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .scoreboard {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 22px;
      background: linear-gradient(180deg, rgba(8,12,22,0.9), rgba(8,12,22,0.65));
      padding: 8px 26px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    .team { display: flex; align-items: center; gap: 10px; }
    .team.orange .score { color: var(--orange-glow); text-shadow: 0 0 14px var(--orange); }
    .team.blue .score { color: var(--blue-glow); text-shadow: 0 0 14px var(--blue); }
    .team-name { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px; opacity: 0.65; }
    .score { font-family: 'Orbitron', sans-serif; font-size: 34px; font-weight: 900; min-width: 38px; text-align: center; }
    .timer-box { display: flex; flex-direction: column; align-items: center; min-width: 72px; }
    #timer { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .mode-label { font-size: 9px; letter-spacing: 2px; opacity: 0.5; margin-top: 1px; }
    .boost-meters {
      position: absolute; bottom: 20px; left: 0; width: 100%;
      display: flex; justify-content: space-between; padding: 0 36px; pointer-events: none;
    }
    .boost-bar {
      width: 170px; height: 13px; background: rgba(0,0,0,0.55);
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden;
    }
    .boost-bar span { position: absolute; top: -17px; left: 0; font-size: 9px; letter-spacing: 1px; opacity: 0.55; }
    .boost-fill { height: 100%; width: 100%; border-radius: 7px; transition: width 0.08s linear; }
    .boost-bar.orange .boost-fill { background: linear-gradient(90deg, #ff4500, var(--orange-glow)); box-shadow: 0 0 12px var(--orange); }
    .boost-bar.blue .boost-fill { background: linear-gradient(90deg, #0088ff, var(--blue-glow)); box-shadow: 0 0 12px var(--blue); }
    .overlay {
      position: absolute; inset: 0; background: rgba(4,6,12,0.92);
      display: flex; align-items: center; justify-content: center; z-index: 50;
      backdrop-filter: blur(10px); transition: opacity 0.2s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none !important;
      visibility: hidden;
      display: none;
    }
    .menu-content { text-align: center; max-width: 500px; padding: 20px; }
    .title {
      font-family: 'Orbitron', sans-serif; font-size: clamp(38px, 7.5vw, 64px); font-weight: 900; line-height: 0.95;
      background: linear-gradient(135deg, var(--orange-glow) 0%, #fff 45%, var(--blue-glow) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 22px rgba(0,180,255,0.35)); margin-bottom: 6px;
    }
    .subtitle { font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 5px; opacity: 0.55; margin-bottom: 32px; }
    .menu-buttons { display: flex; flex-direction: column; gap: 11px; margin-bottom: 36px; }
    .menu-btn {
      font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 2px;
      padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer;
      background: linear-gradient(135deg, var(--orange), #ff4500); color: #fff;
      box-shadow: 0 4px 22px rgba(255,107,0,0.4); transition: transform 0.12s, box-shadow 0.12s; pointer-events: auto;
    }
    .menu-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,107,0,0.55); }
    .menu-btn.secondary {
      background: linear-gradient(135deg, #151d2c, #0b1220);
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .menu-btn.secondary:hover { border-color: var(--blue); box-shadow: 0 4px 20px rgba(0,180,255,0.25); }
    .controls-hint { display: flex; justify-content: center; gap: 44px; text-align: left; opacity: 0.75; font-size: 12px; }
    .ctrl-col h3 { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px; margin-bottom: 7px; color: var(--neon); }
    .ctrl-col p { margin: 2px 0; opacity: 0.85; }
    #goal-banner { background: rgba(0,0,0,0.72); }
    .goal-text {
      font-family: 'Orbitron', sans-serif; font-size: clamp(52px, 11vw, 100px); font-weight: 900;
      background: linear-gradient(90deg, var(--orange-glow), #fff, var(--blue-glow));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: goalPulse 0.55s ease-out; filter: drop-shadow(0 0 28px rgba(255,255,255,0.45));
    }
    .goal-scorer { font-family: 'Orbitron', sans-serif; font-size: 16px; letter-spacing: 3px; margin-top: 10px; opacity: 0.9; }
    @keyframes goalPulse {
      0% { transform: scale(0.25); opacity: 0; }
      55% { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }
    .end-score { font-family: 'Orbitron', sans-serif; font-size: 26px; margin: 14px 0 26px; letter-spacing: 2px; }
    @media (max-width: 700px) {
      .scoreboard { gap: 10px; padding: 7px 14px; }
      .score { font-size: 26px; }
      .boost-meters { padding: 0 14px; }
      .boost-bar { width: 110px; }
      .controls-hint { flex-direction: column; gap: 16px; align-items: center; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
      <div class="scoreboard">
        <div class="team orange">
          <span class="team-name">ORANGE</span>
          <span id="score-orange" class="score">0</span>
        </div>
        <div class="timer-box">
          <span id="timer">5:00</span>
          <span class="mode-label">LOCAL</span>
        </div>
        <div class="team blue">
          <span id="score-blue" class="score">0</span>
          <span class="team-name">BLUE</span>
        </div>
      </div>
      <div class="boost-meters">
        <div class="boost-bar orange">
          <div id="boost-p1" class="boost-fill"></div>
          <span>P1 BOOST</span>
        </div>
        <div class="boost-bar blue">
          <div id="boost-p2" class="boost-fill"></div>
          <span>P2 BOOST</span>
        </div>
      </div>
    </div>

    <div id="main-menu" class="overlay">
      <div class="menu-content">
        <h1 class="title">NEON<br/>ROCKET<br/>LEAGUE</h1>
        <p class="subtitle">SIDE-VIEW CAR SOCCER</p>
        <div class="menu-buttons">
          <button id="btn-1v1" class="menu-btn">1 vs 1 LOCAL</button>
          <button id="btn-vs-ai" class="menu-btn">vs AI</button>
          <button id="btn-freeplay" class="menu-btn secondary">FREE PLAY</button>
        </div>
        <div class="controls-hint">
          <div class="ctrl-col">
            <h3>PLAYER 1 (ORANGE)</h3>
            <p>A / D — Drive</p>
            <p>W or Right-Click — Jump</p>
            <p>Shift or Left-Click — Boost</p>
            <p>Q / E — Tilt (aerials)</p>
          </div>
          <div class="ctrl-col">
            <h3>PLAYER 2 (BLUE)</h3>
            <p>← / → — Drive</p>
            <p>↑ — Jump</p>
            <p>Ctrl — Boost</p>
            <p>U / O — Tilt</p>
          </div>
        </div>
      </div>
    </div>

    <div id="goal-banner" class="overlay hidden">
      <div class="goal-text">GOAL!</div>
      <div id="goal-scorer" class="goal-scorer"></div>
    </div>

    <div id="pause-menu" class="overlay hidden">
      <div class="menu-content">
        <h2 style="font-family:Orbitron,sans-serif;margin-bottom:20px;letter-spacing:3px">PAUSED</h2>
        <button id="btn-resume" class="menu-btn">RESUME</button>
        <button id="btn-restart" class="menu-btn secondary">RESTART</button>
        <button id="btn-menu" class="menu-btn secondary">MAIN MENU</button>
      </div>
    </div>

    <div id="end-screen" class="overlay hidden">
      <div class="menu-content">
        <h2 id="end-title" style="font-family:Orbitron,sans-serif;letter-spacing:2px">MATCH OVER</h2>
        <p id="end-score" class="end-score"></p>
        <button id="btn-play-again" class="menu-btn">PLAY AGAIN</button>
        <button id="btn-to-menu" class="menu-btn secondary">MAIN MENU</button>
      </div>
    </div>
  </div>

<script>
/* =========================================================
   NEON ROCKET LEAGUE 2D – SIDE VIEW (fully working)
   ========================================================= */

const AudioSys = (() => {
  let ctx = null, master = null;
  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.32; master.connect(ctx.destination);
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function tone(freq, type, dur, vol = 0.25, slide = 0) {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime);
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, ctx.currentTime + dur);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime + dur);
  }
  function noise(dur, vol = 0.15) {
    if (!ctx) return;
    const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900;
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }
  return {
    init, resume,
    boost() { tone(85, 'sawtooth', 0.12, 0.1, 50); noise(0.1, 0.07); },
    hit(i = 1) { noise(0.07 + i * 0.04, 0.12 * i); tone(110 + i * 70, 'square', 0.09, 0.08 * i, -50); },
    jump() { tone(200, 'sine', 0.11, 0.18, 100); },
    goal() {
      tone(440, 'sine', 0.18, 0.22);
      setTimeout(() => tone(554, 'sine', 0.18, 0.22), 90);
      setTimeout(() => tone(659, 'sine', 0.3, 0.25), 180);
      noise(0.35, 0.12);
    },
    pickup() { tone(620, 'sine', 0.12, 0.18, 180); },
    whistle() { tone(900, 'sine', 0.35, 0.15, -250); }
  };
})();

class Particles {
  constructor() { this.list = []; }
  emit(x, y, o = {}) {
    const n = o.count || 8, col = o.color || '#fff', spd = o.speed || 3;
    const life = o.life || 0.5, sz = o.size || 3, spr = o.spread || Math.PI * 2;
    const ang = o.angle || 0, grav = o.gravity || 0;
    for (let i = 0; i < n; i++) {
      const a = ang + (Math.random() - 0.5) * spr;
      const s = spd * (0.4 + Math.random() * 0.9);
      this.list.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: life * (0.6 + Math.random() * 0.5), max: life,
        size: sz * (0.5 + Math.random() * 0.7), color: col, grav, a: 1
      });
    }
  }
  trail(x, y, ang, col) {
    this.emit(x, y, { count: 2, color: col, speed: 2.5, life: 0.3, size: 3.5, spread: 0.7, angle: ang + Math.PI });
  }
  boom(x, y, col) {
    this.emit(x, y, { count: 35, color: col, speed: 7, life: 0.8, size: 5, spread: Math.PI * 2, gravity: 120 });
    this.emit(x, y, { count: 15, color: '#fff', speed: 4, life: 0.4, size: 2.5, spread: Math.PI * 2 });
  }
  spark(x, y) { this.emit(x, y, { count: 5, color: '#fff', speed: 3.5, life: 0.25, size: 2, spread: Math.PI * 2 }); }
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += p.grav * dt; p.life -= dt;
      p.a = Math.max(0, p.life / p.max);
      if (p.life <= 0) this.list.splice(i, 1);
    }
  }
  draw(ctx) {
    for (const p of this.list) {
      ctx.globalAlpha = p.a; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

const G = 1280;          // slightly lower gravity = better aerials
const GROUND_Y = 620;
const ARENA_W = 2000;    // much longer field
const ARENA_H = 720;     // taller ceiling for aerials
const GOAL_H = 190;
const GOAL_W = 70;
const CROSSBAR_H = 14;   // thickness of the top bar / backboard lip

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

class Car {
  constructor(x, team) {
    this.team = team;
    this.w = 62; this.h = 28;
    this.x = x; this.y = GROUND_Y - this.h / 2;
    this.vx = 0; this.vy = 0;
    this.facing = team === 'orange' ? 1 : -1;
    this.angle = 0;           // tilt angle (radians) for aerials
    this.angVel = 0;
    this.onGround = true;
    this.boost = 50; this.maxBoost = 100;
    this.jumpBuffer = 0; this.canDouble = false;
    this.throttle = 0; this.boosting = false; this.jumpWanted = false;
    this.tilt = 0;            // -1 Q, +1 E
  }
  reset(x) {
    this.x = x; this.y = GROUND_Y - this.h / 2;
    this.vx = 0; this.vy = 0; this.angle = 0; this.angVel = 0;
    this.facing = this.team === 'orange' ? 1 : -1;
    this.onGround = true; this.boost = 33;
    this.jumpBuffer = 0; this.canDouble = false;
  }
  update(dt, input) {
    // More realistic / controlled speeds
    const ACCEL = 720, MAX_SPEED = 380, AIR_ACCEL = 520, FRICTION = 7.5, BOOST_POWER = 980;
    const TILT_SPEED = 8.5;
    const JUMP_POWER = -640;
    const DOUBLE_JUMP = -520;

    this.throttle = 0; this.boosting = false; this.jumpWanted = false; this.tilt = 0;
    if (input.left) { this.throttle = -1; this.facing = -1; }
    if (input.right) { this.throttle = 1; this.facing = 1; }
    if (input.boost && this.boost > 0) this.boosting = true;
    if (input.jump) this.jumpWanted = true;
    if (input.tiltLeft) this.tilt = -1;
    if (input.tiltRight) this.tilt = 1;

    // Ground / air driving
    const accel = this.onGround ? ACCEL : AIR_ACCEL;
    this.vx += this.throttle * accel * dt;

    // Boost – strong and follows nose when tilted (air dribble friendly)
    if (this.boosting && this.boost > 0) {
      const boostAng = this.onGround ? 0 : this.angle;
      const bx = Math.cos(boostAng) * this.facing;
      const by = Math.sin(boostAng);
      this.vx += bx * BOOST_POWER * dt;
      this.vy += by * BOOST_POWER * dt;          // full power in tilt direction
      if (!this.onGround) this.vy -= 320 * dt;   // solid upward component for aerials
      this.boost = Math.max(0, this.boost - 22 * dt);
      if (window.P) {
        const px = this.x - this.facing * (this.w / 2 + 8) * Math.cos(this.angle);
        const py = this.y + (this.w / 2 + 8) * Math.sin(-this.angle * this.facing);
        window.P.trail(px, py, this.facing > 0 ? this.angle : this.angle + Math.PI,
          this.team === 'orange' ? '#ff6b00' : '#00b4ff');
      }
    } else if (this.onGround) {
      this.boost = Math.min(this.maxBoost, this.boost + 11 * dt);
    }

    // Friction / drag
    if (this.onGround && Math.abs(this.throttle) < 0.1 && !this.boosting) {
      this.vx *= Math.max(0, 1 - FRICTION * dt);
    } else {
      this.vx *= Math.max(0, 1 - 1.15 * dt);
      if (!this.onGround) this.vy *= Math.max(0, 1 - 0.4 * dt); // light air drag
    }

    const spd = Math.hypot(this.vx, this.vy);
    if (spd > MAX_SPEED) {
      this.vx = (this.vx / spd) * MAX_SPEED;
      this.vy = (this.vy / spd) * MAX_SPEED;
    }

    // Jump / double jump (much stronger)
    if (this.jumpWanted) {
      if (this.onGround) {
        this.vy = JUMP_POWER;
        this.onGround = false;
        this.canDouble = true;
        this.jumpBuffer = 0.22;
        AudioSys.jump();
      } else if (this.canDouble && this.jumpBuffer <= 0) {
        // Powerful dodge / double jump
        this.vy = DOUBLE_JUMP;
        this.vx += this.facing * 220;
        if (this.tilt !== 0) {
          this.angVel = this.tilt * 18;
          this.vy += this.tilt * this.facing * 80;
        }
        this.canDouble = false;
        AudioSys.jump();
      }
    }
    if (this.jumpBuffer > 0) this.jumpBuffer -= dt;

    // Tilt – unlimited free rotation in the air
    if (!this.onGround) {
      this.angVel += this.tilt * TILT_SPEED * dt * 14;
      this.angVel *= 0.91;
      this.angle += this.angVel * dt;
      // wrap angle so it can spin freely forever
      if (this.angle > Math.PI * 2) this.angle -= Math.PI * 2;
      if (this.angle < -Math.PI * 2) this.angle += Math.PI * 2;
    } else {
      // gently upright on ground
      let a = this.angle % (Math.PI * 2);
      if (a > Math.PI) a -= Math.PI * 2;
      if (a < -Math.PI) a += Math.PI * 2;
      this.angle = a * 0.7;
      this.angVel = 0;
      if (Math.abs(this.angle) < 0.05) this.angle = 0;
    }

    if (!this.onGround) this.vy += G * dt;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Ground collision
    const halfH = (this.h / 2) * Math.cos(this.angle) + (this.w / 2) * Math.abs(Math.sin(this.angle));
    if (this.y + halfH >= GROUND_Y) {
      this.y = GROUND_Y - halfH;
      this.vy = 0;
      this.onGround = true;
      this.canDouble = false;
      this.angle *= 0.4;
    } else this.onGround = false;

    // Ceiling
    if (this.y - this.h / 2 < 30) {
      this.y = 30 + this.h / 2;
      this.vy = Math.abs(this.vy) * 0.3;
    }
    // Side walls (cars can't leave)
    if (this.x - this.w / 2 < 14) { this.x = 14 + this.w / 2; this.vx = Math.abs(this.vx) * 0.3; }
    if (this.x + this.w / 2 > ARENA_W - 14) { this.x = ARENA_W - 14 - this.w / 2; this.vx = -Math.abs(this.vx) * 0.3; }
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    // facing + tilt
    ctx.scale(this.facing, 1);
    ctx.rotate(this.angle * this.facing);

    ctx.shadowBlur = 20;
    ctx.shadowColor = this.team === 'orange' ? '#ff6b00' : '#00b4ff';

    // main body – sleek octane-like shape
    const g = ctx.createLinearGradient(-this.w / 2, 0, this.w / 2, 0);
    if (this.team === 'orange') {
      g.addColorStop(0, '#ff2a00'); g.addColorStop(0.4, '#ff7a00'); g.addColorStop(1, '#ffcc44');
    } else {
      g.addColorStop(0, '#0044ff'); g.addColorStop(0.4, '#00aaff'); g.addColorStop(1, '#44eeff');
    }
    ctx.fillStyle = g;
    // body
    ctx.beginPath();
    ctx.moveTo(-this.w / 2 + 4, -this.h / 2 + 2);
    ctx.lineTo(this.w / 2 - 8, -this.h / 2);
    ctx.lineTo(this.w / 2, -this.h / 2 + 6);
    ctx.lineTo(this.w / 2, this.h / 2 - 4);
    ctx.lineTo(this.w / 2 - 10, this.h / 2);
    ctx.lineTo(-this.w / 2 + 6, this.h / 2);
    ctx.lineTo(-this.w / 2, this.h / 2 - 6);
    ctx.closePath();
    ctx.fill();

    // outline
    ctx.strokeStyle = this.team === 'orange' ? '#ffdd88' : '#88eeff';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // canopy / glass
    ctx.fillStyle = 'rgba(10,15,25,0.85)';
    ctx.beginPath();
    ctx.moveTo(-2, -this.h / 2 + 3);
    ctx.lineTo(18, -this.h / 2 + 2);
    ctx.lineTo(20, 2);
    ctx.lineTo(-4, 4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1; ctx.stroke();

    // accent stripe
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-this.w / 2 + 10, -this.h / 2 + 5);
    ctx.lineTo(this.w / 2 - 12, -this.h / 2 + 4);
    ctx.stroke();

    // wheels
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath(); ctx.arc(-18, this.h / 2 - 1, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(16, this.h / 2 - 1, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = this.team === 'orange' ? '#ff8800' : '#00aaff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-18, this.h / 2 - 1, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(16, this.h / 2 - 1, 8, 0, Math.PI * 2); ctx.stroke();

    // boost flame
    if (this.boosting && this.boost > 0) {
      const flick = 0.55 + Math.random() * 0.55;
      ctx.shadowBlur = 28;
      ctx.fillStyle = this.team === 'orange' ? `rgba(255,120,0,${flick})` : `rgba(0,180,255,${flick})`;
      ctx.beginPath();
      ctx.moveTo(-this.w / 2 + 2, -8);
      ctx.lineTo(-this.w / 2 - 18 - Math.random() * 12, 0);
      ctx.lineTo(-this.w / 2 + 2, 8);
      ctx.closePath();
      ctx.fill();
      // secondary flame
      ctx.fillStyle = `rgba(255,255,200,${flick * 0.7})`;
      ctx.beginPath();
      ctx.moveTo(-this.w / 2 + 2, -4);
      ctx.lineTo(-this.w / 2 - 10 - Math.random() * 6, 0);
      ctx.lineTo(-this.w / 2 + 2, 4);
      ctx.closePath();
      ctx.fill();
    }

    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

class Ball {
  constructor() {
    this.r = 30; this.mass = 2.6;   // bigger RL-style ball
    this.x = ARENA_W / 2; this.y = GROUND_Y - 200;
    this.vx = 0; this.vy = 0; this.spin = 0; this.trail = [];
  }
  reset() {
    this.x = ARENA_W / 2; this.y = GROUND_Y - 220;
    this.vx = 0; this.vy = 0; this.spin = 0; this.trail = [];
  }
  update(dt) {
    this.vy += G * 0.78 * dt;
    // almost no air drag – ball stays lively
    this.vx *= 0.9995;
    this.vy *= 0.9995;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.spin += this.vx * 0.011 * dt;

    // Ground – high bounce + long roll
    if (this.y + this.r > GROUND_Y) {
      this.y = GROUND_Y - this.r;
      this.vy = -Math.abs(this.vy) * 0.88;   // very bouncy
      this.vx *= 0.990;
      if (Math.abs(this.vy) < 30) this.vy = 0;
    }
    // Ceiling
    if (this.y - this.r < 25) {
      this.y = 25 + this.r;
      this.vy = Math.abs(this.vy) * 0.72;
    }

    // Side walls + goal mouths with CROSSBAR / backboard
    const goalTop = GROUND_Y - GOAL_H;
    const crossTop = goalTop - CROSSBAR_H;

    // Left side
    if (this.x - this.r < GOAL_W) {
      if (this.y + this.r > crossTop && this.y - this.r < goalTop + 8) {
        // hit the crossbar / top of goal
        if (this.vy > 0 && this.y < goalTop) {
          this.y = crossTop - this.r;
          this.vy = -Math.abs(this.vy) * 0.7;
        } else if (this.x - this.r < 0 && this.y < goalTop) {
          // still above crossbar area – normal wall
          this.x = this.r;
          this.vx = Math.abs(this.vx) * 0.75;
        }
        // else: inside goal mouth → scoring handled elsewhere
      } else if (this.y <= goalTop && this.x - this.r < 0) {
        this.x = this.r;
        this.vx = Math.abs(this.vx) * 0.75;
      }
    }

    // Right side
    if (this.x + this.r > ARENA_W - GOAL_W) {
      if (this.y + this.r > crossTop && this.y - this.r < goalTop + 8) {
        if (this.vy > 0 && this.y < goalTop) {
          this.y = crossTop - this.r;
          this.vy = -Math.abs(this.vy) * 0.7;
        } else if (this.x + this.r > ARENA_W && this.y < goalTop) {
          this.x = ARENA_W - this.r;
          this.vx = -Math.abs(this.vx) * 0.75;
        }
      } else if (this.y <= goalTop && this.x + this.r > ARENA_W) {
        this.x = ARENA_W - this.r;
        this.vx = -Math.abs(this.vx) * 0.75;
      }
    }

    this.trail.push({ x: this.x, y: this.y, life: 0.45 });
    if (this.trail.length > 22) this.trail.shift();
    for (const t of this.trail) t.life -= dt;
    this.trail = this.trail.filter(t => t.life > 0);
  }
  draw(ctx) {
    for (const t of this.trail) {
      ctx.globalAlpha = Math.min(0.35, t.life * 1.8);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(t.x, t.y, this.r * 0.45 * (t.life / 0.3), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.shadowBlur = 18; ctx.shadowColor = '#ffffff';
    const gr = ctx.createRadialGradient(this.x - 4, this.y - 4, 2, this.x, this.y, this.r);
    gr.addColorStop(0, '#fff'); gr.addColorStop(0.45, '#ddd'); gr.addColorStop(1, '#777');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5;
    ctx.translate(this.x, this.y); ctx.rotate(this.spin);
    for (let i = 0; i < 6; i++) {
      ctx.rotate(Math.PI / 3);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -this.r + 2); ctx.stroke();
    }
    ctx.restore();
  }
}

class BoostPad {
  constructor(x, y, big = false) {
    this.x = x; this.y = y; this.big = big;
    this.r = big ? 20 : 11; this.active = true; this.timer = 0; this.pulse = 0;
  }
  update(dt) {
    this.pulse += dt * 3.5;
    if (!this.active) { this.timer -= dt; if (this.timer <= 0) this.active = true; }
  }
  try(car) {
    if (!this.active) return;
    const dx = car.x - this.x, dy = car.y - this.y;
    if (dx * dx + dy * dy < (this.r + 22) ** 2) {
      this.active = false; this.timer = this.big ? 9 : 3.5;
      car.boost = Math.min(car.maxBoost, car.boost + (this.big ? 100 : 14));
      AudioSys.pickup();
      if (window.P) window.P.emit(this.x, this.y, { count: this.big ? 16 : 7, color: '#00ffcc', speed: 2.5, life: 0.4, size: 2.5 });
    }
  }
  draw(ctx) {
    if (!this.active) ctx.globalAlpha = 0.12;
    const p = 0.65 + Math.sin(this.pulse) * 0.35;
    ctx.shadowBlur = 12 * p; ctx.shadowColor = '#00ffcc';
    ctx.strokeStyle = `rgba(0,255,200,${p})`; ctx.lineWidth = this.big ? 2.5 : 1.8;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.stroke();
    if (this.big) {
      ctx.fillStyle = `rgba(0,255,200,${0.12 * p})`; ctx.fill();
      ctx.font = 'bold 10px Orbitron'; ctx.fillStyle = `rgba(0,255,200,${p})`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('BOOST', this.x, this.y);
    } else {
      ctx.fillStyle = `rgba(0,255,200,${0.28 * p})`;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}

function collideCarBall(car, ball) {
  const hw = car.w / 2, hh = car.h / 2;
  const cx = Math.max(car.x - hw, Math.min(ball.x, car.x + hw));
  const cy = Math.max(car.y - hh, Math.min(ball.y, car.y + hh));
  const dx = ball.x - cx, dy = ball.y - cy;
  const distSq = dx * dx + dy * dy;
  if (distSq >= ball.r * ball.r) return false;

  let nx, ny, pen;
  if (distSq < 0.0001) {
    const left = ball.x - (car.x - hw), right = (car.x + hw) - ball.x;
    const top = ball.y - (car.y - hh), bot = (car.y + hh) - ball.y;
    const m = Math.min(left, right, top, bot);
    if (m === left) { nx = -1; ny = 0; pen = left + ball.r; }
    else if (m === right) { nx = 1; ny = 0; pen = right + ball.r; }
    else if (m === top) { nx = 0; ny = -1; pen = top + ball.r; }
    else { nx = 0; ny = 1; pen = bot + ball.r; }
  } else {
    const dist = Math.sqrt(distSq);
    nx = dx / dist; ny = dy / dist; pen = ball.r - dist;
  }

  ball.x += nx * pen; ball.y += ny * pen;
  const rvx = ball.vx - car.vx, rvy = ball.vy - car.vy;
  const vn = rvx * nx + rvy * ny;
  if (vn > 0) return true;

  const e = 0.82;
  const j = -(1 + e) * vn / (1 / 11 + 1 / ball.mass);
  const punch = 1.55; // stronger hit for aerials & dribbles
  ball.vx += (j * punch * nx) / ball.mass;
  ball.vy += (j * punch * ny) / ball.mass;
  // transfer more of the car's velocity (key for air dribbles)
  ball.vx += car.vx * 0.38;
  ball.vy += car.vy * 0.32;
  // slight upward pop when hitting from below
  if (ny < -0.3) ball.vy -= 40;
  return true;
}

function collideCars(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const overlapX = (a.w + b.w) / 2 - Math.abs(dx);
  const overlapY = (a.h + b.h) / 2 - Math.abs(dy);
  if (overlapX <= 0 || overlapY <= 0) return;
  if (overlapX < overlapY) {
    const s = dx > 0 ? 1 : -1;
    a.x -= s * overlapX * 0.5; b.x += s * overlapX * 0.5;
    const rv = b.vx - a.vx;
    if (rv * s > 0) return;
    const j = -rv * 0.6; a.vx -= j; b.vx += j;
  } else {
    const s = dy > 0 ? 1 : -1;
    a.y -= s * overlapY * 0.5; b.y += s * overlapY * 0.5;
    const rv = b.vy - a.vy;
    if (rv * s > 0) return;
    const j = -rv * 0.5; a.vy -= j; b.vy += j;
  }
}

const AI = {
  update(car, ball, dt) {
    const dx = ball.x - car.x;
    const dy = ball.y - car.y;
    const predX = ball.x + ball.vx * 0.35;
    const predY = ball.y + ball.vy * 0.25;
    const dist = Math.hypot(predX - car.x, predY - car.y);

    car.throttle = 0; car.boosting = false; car.jumpWanted = false; car.tilt = 0;

    // Drive toward predicted ball
    if (predX < car.x - 12) { car.facing = -1; car.throttle = -1; }
    else if (predX > car.x + 12) { car.facing = 1; car.throttle = 1; }

    // Boost when far or chasing
    if (dist > 140 && car.boost > 18) car.boosting = true;
    if (dist > 280 && car.boost > 10) car.boosting = true;

    // Jump for aerial / challenge
    if (dist < 110 && ball.y < car.y - 15 && car.onGround && Math.random() < 0.12) {
      car.jumpWanted = true;
    }
    // Aerial boost + tilt toward ball
    if (!car.onGround) {
      if (dist < 160 && car.boost > 8) car.boosting = true;
      // simple tilt toward ball height
      if (ball.y < car.y - 20) car.tilt = car.facing > 0 ? -1 : 1;
      else if (ball.y > car.y + 20) car.tilt = car.facing > 0 ? 1 : -1;
      if (dist < 80 && Math.random() < 0.06) car.jumpWanted = true; // double jump poke
    }

    // Defend own goal aggressively
    const ownGoalX = car.team === 'orange' ? 40 : ARENA_W - 40;
    const ballThreat = Math.abs(ball.x - ownGoalX) < 320 && Math.sign(ball.vx) === Math.sign(ownGoalX - ARENA_W / 2);
    if (ballThreat && dist > 80) {
      const mid = (ball.x + ownGoalX) * 0.5;
      if (car.x > mid + 20) { car.facing = -1; car.throttle = -1; }
      else if (car.x < mid - 20) { car.facing = 1; car.throttle = 1; }
      if (car.boost > 12) car.boosting = true;
      if (ball.y < car.y - 30 && car.onGround) car.jumpWanted = true;
    }

    // Don't sit still
    if (Math.abs(car.vx) < 25 && dist > 60) car.throttle = car.facing;
  }
};

(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let state = 'menu', mode = '1v1';
  let scoreO = 0, scoreB = 0, timeLeft = 300, goalT = 0, shake = 0;
  let car1, car2, ball, pads = [];
  const P = new Particles(); window.P = P;

  const keys = {
    p1: { left: false, right: false, jump: false, boost: false, tiltLeft: false, tiltRight: false },
    p2: { left: false, right: false, jump: false, boost: false, tiltLeft: false, tiltRight: false }
  };
  // mouse state for player 1
  let mouseBoost = false, mouseJump = false;

  const $ = id => document.getElementById(id);
  const elSO = $('score-orange'), elSB = $('score-blue'), elT = $('timer');
  const elB1 = $('boost-p1'), elB2 = $('boost-p2');
  const menu = $('main-menu'), goalBan = $('goal-banner'), goalTxt = $('goal-scorer');
  const pauseM = $('pause-menu'), endM = $('end-screen');
  const endTitle = $('end-title'), endScore = $('end-score');

  function resize() {
    const maxW = window.innerWidth - 16, maxH = window.innerHeight - 16;
    const scale = Math.min(maxW / ARENA_W, maxH / ARENA_H);
    canvas.width = Math.floor(ARENA_W * scale);
    canvas.height = Math.floor(ARENA_H * scale);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }

  function makePads() {
    pads = [
      new BoostPad(ARENA_W * 0.2, GROUND_Y - 8, false),
      new BoostPad(ARENA_W * 0.5, GROUND_Y - 8, true),
      new BoostPad(ARENA_W * 0.8, GROUND_Y - 8, false),
      new BoostPad(ARENA_W * 0.1, GROUND_Y - 110, false),
      new BoostPad(ARENA_W * 0.9, GROUND_Y - 110, false),
      new BoostPad(ARENA_W * 0.3, GROUND_Y - 200, false),
      new BoostPad(ARENA_W * 0.7, GROUND_Y - 200, false),
      new BoostPad(ARENA_W * 0.5, GROUND_Y - 290, true),
      new BoostPad(ARENA_W * 0.4, GROUND_Y - 380, false),
      new BoostPad(ARENA_W * 0.6, GROUND_Y - 380, false)
    ];
  }

  function resetKickoff() {
    car1.reset(320); car2.reset(ARENA_W - 320); ball.reset();
    car1.boost = 40; car2.boost = 40;
  }

  function start(m) {
    mode = m; scoreO = 0; scoreB = 0;
    timeLeft = m === 'freeplay' ? 99999 : 300;
    mouseBoost = false; mouseJump = false;
    // clear all keys so nothing is stuck
    for (const p of ['p1', 'p2']) {
      for (const k of Object.keys(keys[p])) keys[p][k] = false;
    }

    menu.classList.add('hidden');
    endM.classList.add('hidden');
    pauseM.classList.add('hidden');
    goalBan.classList.add('hidden');

    car1 = new Car(320, 'orange');
    car2 = new Car(ARENA_W - 320, 'blue');
    ball = new Ball();
    makePads();
    resetKickoff();

    document.querySelector('.mode-label').textContent =
      m === '1v1' ? '1v1 LOCAL' : m === 'ai' ? 'VS AI' : 'FREE PLAY';
    elSO.textContent = '0'; elSB.textContent = '0';

    state = 'playing';
    AudioSys.init(); AudioSys.resume(); AudioSys.whistle();
  }

  function checkGoal() {
    const gt = GROUND_Y - GOAL_H;
    // Must be fully inside the goal mouth (below crossbar)
    if (ball.x + ball.r > ARENA_W - 8 && ball.y - ball.r > gt && ball.y + ball.r < GROUND_Y + 5) return 'orange';
    if (ball.x - ball.r < 8 && ball.y - ball.r > gt && ball.y + ball.r < GROUND_Y + 5) return 'blue';
    return null;
  }

  function onGoal(team) {
    state = 'goal'; goalT = 2.0;
    if (team === 'orange') scoreO++; else scoreB++;
    elSO.textContent = scoreO; elSB.textContent = scoreB;
    goalTxt.textContent = team === 'orange' ? 'ORANGE SCORES!' : 'BLUE SCORES!';
    goalBan.classList.remove('hidden');
    AudioSys.goal();
    P.boom(ball.x, ball.y, team === 'orange' ? '#ff6b00' : '#00b4ff');
    shake = 16;
  }

  function endMatch() {
    state = 'end'; endM.classList.remove('hidden');
    if (scoreO > scoreB) { endTitle.textContent = 'ORANGE WINS!'; endTitle.style.color = '#ff9500'; }
    else if (scoreB > scoreO) { endTitle.textContent = 'BLUE WINS!'; endTitle.style.color = '#00e5ff'; }
    else { endTitle.textContent = 'DRAW!'; endTitle.style.color = '#fff'; }
    endScore.textContent = `${scoreO}  -  ${scoreB}`;
    AudioSys.whistle();
  }

  function drawArena() {
    // deep stadium sky
    const bg = ctx.createLinearGradient(0, 0, 0, ARENA_H);
    bg.addColorStop(0, '#060b18'); bg.addColorStop(0.45, '#0a1428'); bg.addColorStop(1, '#080e1a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, ARENA_W, ARENA_H);

    // subtle stadium light beams
    ctx.fillStyle = 'rgba(100,160,255,0.025)';
    ctx.beginPath(); ctx.moveTo(ARENA_W * 0.2, 0); ctx.lineTo(ARENA_W * 0.35, GROUND_Y); ctx.lineTo(ARENA_W * 0.15, GROUND_Y); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(ARENA_W * 0.8, 0); ctx.lineTo(ARENA_W * 0.85, GROUND_Y); ctx.lineTo(ARENA_W * 0.65, GROUND_Y); ctx.closePath(); ctx.fill();

    // horizontal structural lines
    ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
      const y = 30 + i * 55;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(ARENA_W, y); ctx.stroke();
    }

    // ground
    const groundGrad = ctx.createLinearGradient(0, GROUND_Y, 0, ARENA_H);
    groundGrad.addColorStop(0, '#0c1522'); groundGrad.addColorStop(1, '#080e16');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, GROUND_Y, ARENA_W, ARENA_H - GROUND_Y);
    // neon ground line
    ctx.strokeStyle = 'rgba(0,220,255,0.25)'; ctx.lineWidth = 2.5;
    ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(0,200,255,0.4)';
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(ARENA_W, GROUND_Y); ctx.stroke();
    ctx.shadowBlur = 0;

    // center circle
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ARENA_W / 2, GROUND_Y - 50, 90, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(ARENA_W / 2, GROUND_Y - 50, 8, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
    // center line
    ctx.beginPath(); ctx.moveTo(ARENA_W / 2, 40); ctx.lineTo(ARENA_W / 2, GROUND_Y); ctx.stroke();

    const gt = GROUND_Y - GOAL_H;
    const crossY = gt - CROSSBAR_H;

    // LEFT GOAL (orange) + backboard / crossbar
    ctx.fillStyle = 'rgba(255,100,0,0.12)';
    ctx.fillRect(0, gt, GOAL_W, GOAL_H);
    // net lines
    ctx.strokeStyle = 'rgba(255,120,0,0.22)'; ctx.lineWidth = 1;
    for (let i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(0, gt + (GOAL_H / 6) * i); ctx.lineTo(GOAL_W, gt + (GOAL_H / 6) * i); ctx.stroke();
    }
    for (let i = 1; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo((GOAL_W / 4) * i, gt); ctx.lineTo((GOAL_W / 4) * i, GROUND_Y); ctx.stroke();
    }
    // goal frame
    ctx.strokeStyle = '#ff6b00'; ctx.lineWidth = 4;
    ctx.shadowBlur = 14; ctx.shadowColor = '#ff6b00';
    ctx.strokeRect(0, gt, GOAL_W, GOAL_H);
    // CROSSBAR / top board
    ctx.fillStyle = '#ff6b00';
    ctx.fillRect(0, crossY, GOAL_W + 6, CROSSBAR_H);
    ctx.shadowBlur = 0;
    // backboard wall above goal
    ctx.fillStyle = 'rgba(30,40,60,0.75)';
    ctx.fillRect(0, 0, 12, crossY);
    ctx.strokeStyle = 'rgba(255,100,0,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(12, crossY); ctx.stroke();

    // RIGHT GOAL (blue) + backboard / crossbar
    ctx.fillStyle = 'rgba(0,180,255,0.12)';
    ctx.fillRect(ARENA_W - GOAL_W, gt, GOAL_W, GOAL_H);
    ctx.strokeStyle = 'rgba(0,180,255,0.22)'; ctx.lineWidth = 1;
    for (let i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(ARENA_W - GOAL_W, gt + (GOAL_H / 6) * i); ctx.lineTo(ARENA_W, gt + (GOAL_H / 6) * i); ctx.stroke();
    }
    for (let i = 1; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(ARENA_W - GOAL_W + (GOAL_W / 4) * i, gt); ctx.lineTo(ARENA_W - GOAL_W + (GOAL_W / 4) * i, GROUND_Y); ctx.stroke();
    }
    ctx.strokeStyle = '#00b4ff'; ctx.lineWidth = 4;
    ctx.shadowBlur = 14; ctx.shadowColor = '#00b4ff';
    ctx.strokeRect(ARENA_W - GOAL_W, gt, GOAL_W, GOAL_H);
    // CROSSBAR
    ctx.fillStyle = '#00b4ff';
    ctx.fillRect(ARENA_W - GOAL_W - 6, crossY, GOAL_W + 6, CROSSBAR_H);
    ctx.shadowBlur = 0;
    // backboard wall above goal
    ctx.fillStyle = 'rgba(30,40,60,0.75)';
    ctx.fillRect(ARENA_W - 12, 0, 12, crossY);
    ctx.strokeStyle = 'rgba(0,180,255,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ARENA_W - 12, 0); ctx.lineTo(ARENA_W - 12, crossY); ctx.stroke();
  }

  function update(dt) {
    if (state !== 'playing' && state !== 'goal') return;

    if (state === 'goal') {
      goalT -= dt; P.update(dt);
      if (goalT <= 0) {
        goalBan.classList.add('hidden');
        if (mode !== 'freeplay' && (scoreO >= 5 || scoreB >= 5)) { endMatch(); return; }
        resetKickoff(); state = 'playing'; AudioSys.whistle();
      }
      return;
    }

    if (mode !== 'freeplay') {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; endMatch(); return; }
    }

    const i1 = {
      left: keys.p1.left, right: keys.p1.right,
      jump: keys.p1.jump || mouseJump,
      boost: keys.p1.boost || mouseBoost,
      tiltLeft: keys.p1.tiltLeft, tiltRight: keys.p1.tiltRight
    };
    const i2 = {
      left: keys.p2.left, right: keys.p2.right,
      jump: keys.p2.jump, boost: keys.p2.boost,
      tiltLeft: keys.p2.tiltLeft, tiltRight: keys.p2.tiltRight
    };

    if (mode === 'ai') {
      AI.update(car2, ball, dt);
      i2.left = car2.throttle < -0.3;
      i2.right = car2.throttle > 0.3;
      i2.boost = car2.boosting;
      i2.jump = car2.jumpWanted;
      i2.tiltLeft = car2.tilt < -0.3;
      i2.tiltRight = car2.tilt > 0.3;
    }

    car1.update(dt, i1);
    if (mode !== 'freeplay') car2.update(dt, i2);
    else { car2.vx *= 0.9; car2.vy *= 0.9; }

    ball.update(dt);

    for (const p of pads) {
      p.update(dt); p.try(car1);
      if (mode !== 'freeplay') p.try(car2);
    }

    if (collideCarBall(car1, ball)) {
      AudioSys.hit(Math.min(1.4, Math.hypot(ball.vx, ball.vy) / 350));
      P.spark(ball.x, ball.y); shake = Math.min(10, shake + 3);
    }
    if (mode !== 'freeplay' && collideCarBall(car2, ball)) {
      AudioSys.hit(Math.min(1.4, Math.hypot(ball.vx, ball.vy) / 350));
      P.spark(ball.x, ball.y); shake = Math.min(10, shake + 3);
    }
    if (mode !== 'freeplay') collideCars(car1, car2);

    const g = checkGoal();
    if (g) onGoal(g);

    P.update(dt);
    shake *= 0.88; if (shake < 0.2) shake = 0;

    elB1.style.width = Math.max(0, car1.boost) + '%';
    elB2.style.width = Math.max(0, car2.boost) + '%';
    const m = Math.floor(timeLeft / 60), s = Math.floor(timeLeft % 60);
    elT.textContent = mode === 'freeplay' ? '∞' : `${m}:${s.toString().padStart(2, '0')}`;
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawArena();
    for (const p of pads) p.draw(ctx);
    // Always draw both cars + ball (even in freeplay car2 stays parked)
    if (car2) car2.draw(ctx);
    if (car1) car1.draw(ctx);
    if (ball) ball.draw(ctx);
    P.draw(ctx);

    const v = ctx.createRadialGradient(ARENA_W / 2, ARENA_H / 2, ARENA_H * 0.25, ARENA_W / 2, ARENA_H / 2, ARENA_W * 0.65);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, ARENA_W, ARENA_H);
    ctx.restore();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  const map = {
    KeyA: ['p1', 'left'], KeyD: ['p1', 'right'], KeyW: ['p1', 'jump'],
    ShiftLeft: ['p1', 'boost'], ShiftRight: ['p1', 'boost'],
    KeyQ: ['p1', 'tiltLeft'], KeyE: ['p1', 'tiltRight'],
    ArrowLeft: ['p2', 'left'], ArrowRight: ['p2', 'right'], ArrowUp: ['p2', 'jump'],
    ControlLeft: ['p2', 'boost'], ControlRight: ['p2', 'boost'],
    KeyU: ['p2', 'tiltLeft'], KeyO: ['p2', 'tiltRight']
  };
  window.addEventListener('keydown', e => {
    if (e.code === 'Escape') {
      if (state === 'playing') { state = 'paused'; pauseM.classList.remove('hidden'); }
      else if (state === 'paused') { state = 'playing'; pauseM.classList.add('hidden'); }
      return;
    }
    const m = map[e.code];
    if (m) { keys[m[0]][m[1]] = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    const m = map[e.code];
    if (m) { keys[m[0]][m[1]] = false; e.preventDefault(); }
  });

  // Mouse controls for Player 1: Left = Boost, Right = Jump
  // Only active while actually playing – never when menus are open
  window.addEventListener('mousedown', e => {
    if (state !== 'playing') return;
    if (e.button === 0) { mouseBoost = true; e.preventDefault(); }
    if (e.button === 2) { mouseJump = true; e.preventDefault(); }
  });
  window.addEventListener('mouseup', e => {
    if (e.button === 0) mouseBoost = false;
    if (e.button === 2) mouseJump = false;
  });
  window.addEventListener('contextmenu', e => e.preventDefault());
  // Reset mouse state if window loses focus
  window.addEventListener('blur', () => { mouseBoost = false; mouseJump = false; });

  function safeStart(m) {
    try {
      // force-hide every overlay first
      menu.classList.add('hidden');
      pauseM.classList.add('hidden');
      endM.classList.add('hidden');
      goalBan.classList.add('hidden');
      start(m);
    } catch (err) {
      console.error('Start failed:', err);
    }
  }

  $('btn-1v1').onclick = (e) => { e.stopPropagation(); safeStart('1v1'); };
  $('btn-vs-ai').onclick = (e) => { e.stopPropagation(); safeStart('ai'); };
  $('btn-freeplay').onclick = (e) => { e.stopPropagation(); safeStart('freeplay'); };
  $('btn-resume').onclick = (e) => { e.stopPropagation(); state = 'playing'; pauseM.classList.add('hidden'); };
  $('btn-restart').onclick = (e) => { e.stopPropagation(); pauseM.classList.add('hidden'); safeStart(mode); };
  $('btn-menu').onclick = (e) => {
    e.stopPropagation();
    pauseM.classList.add('hidden'); endM.classList.add('hidden');
    state = 'menu'; menu.classList.remove('hidden');
  };
  $('btn-play-again').onclick = (e) => { e.stopPropagation(); safeStart(mode); };
  $('btn-to-menu').onclick = (e) => {
    e.stopPropagation();
    endM.classList.add('hidden'); state = 'menu'; menu.classList.remove('hidden');
  };

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);
  window.addEventListener('click', () => { AudioSys.init(); AudioSys.resume(); }, { once: true });
})();
</script>
</body>
</html>
