<html lang="en"><head><meta charset="UTF-8"><title>Tank Arena v10</title>
<style>

<canvas id="c"></canvas>
<div id="top" class="hud"><div id="bar"><div id="xp"></div><div id="lv">Level 1</div></div><div id="sc">0</div><div id="cn" style="color:#ffd34d"></div><div id="bf"></div></div>
<div id="lb" class="hud"></div><div id="ups" class="hud"></div><div id="ban" class="hud"></div><div id="vg" class="hud"></div>
<div class="hud" style="bottom:66px;left:10px;font-size:11px;opacity:.85;line-height:1.5">WASD · mouse · click / E autofire · <b>Space dash</b> · 1-7 stats · Tab LB<br>Evolve Lv10 / 25 / 40 · ` debug (Shift+L/U/H/K/B)</div>
<div id="dbg" class="hud" style="top:10px;right:10px;color:#fc6"></div>
<div id="ov"></div>
<script>
'use strict';
const C=document.getElementById('c'),X=C.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0;function rs(){C.width=W=innerWidth;C.height=H=innerHeight}addEventListener('resize',rs);rs();
const R=Math.random,rr=(a,b)=>a+R()*(b-a),pick=a=>a[R()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v)),hyp=Math.hypot,TAU=6.2832;
const ad=(a,b)=>{let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
const WW=9000; // much bigger map

/* ---------- classes (expanded tree, no perks) ---------- */
const D=(n,c,r,d,b,m,up,lv)=>({n,c,r,d,b,m,up:up||[],lv:lv||0});
const T={
basic:D('Basic','#00b2e1',26,'Balanced all-rounder.',[{l:40,w:18}],{},['twin','sniper','pounder','flank','shotgun','machine','missile'],10),
twin:D('Twin','#8abc3f',26,'Alternating twin barrels.',[{l:40,w:14,o:-11},{l:40,w:14,o:11}],{alt:1,rc:1.1,heat:1},['triplet','quad'],25),
sniper:D('Sniper','#3ecfcf',25,'Long range, fast bullets.',[{l:62,w:12}],{rel:1.7,dmg:1.5,siz:.7,spd:1.5,life:1.7,rc:1.6},['rail','assassin'],25),
pounder:D('Pounder','#ff8c42',29,'Huge slow shells.',[{l:50,w:30}],{rel:2.2,dmg:2.3,siz:1.7,rc:2.4},['destroyer','howitzer'],25),
flank:D('Flank','#e67e22',27,'Front and rear guns.',[{l:42,w:16},{a:Math.PI,l:36,w:14}],{rc:1.1},['triflank','quadflank'],25),
shotgun:D('Shotgun','#e6b84c',27,'Close-range pellet blast.',[{l:42,w:26}],{rel:1.8,dmg:.55,siz:.6,life:.5,pel:6,spr:.55,rc:1.6},['scatter'],25),
machine:D('Machine Gun','#5ad45a',27,'Rapid spray.',[{l:36,w:22}],{rel:.45,dmg:.5,siz:.65,spr:.3,rc:.9,heat:1.4},['minigun'],40),
missile:D('Missile','#bf7ff5',26,'Launches explosive missiles.',[{l:52,w:24}],{missile:1,rel:3.4,rc:1.7},['lockon','swarm','spinner'],25),
triplet:D('Triplet','#7dcf3a',26,'Three barrels at once.',[{l:42,w:12,o:-16},{l:46,w:14},{l:42,w:12,o:16}],{rel:1.1,dmg:.8,rc:1.4,heat:.8},['penta'],40),
quad:D('Quadriplet','#6abf2f',27,'Dense four-barrel stream.',[{l:40,w:11,o:-20},{l:44,w:12,o:-7},{l:44,w:12,o:7},{l:40,w:11,o:20}],{rel:1.2,dmg:.7,rc:1.5,heat:1},['penta'],40),
penta:D('Penta Shot','#5aaf20',28,'Five barrels of continuous fire.',[{l:38,w:10,o:-22},{l:42,w:11,o:-11},{l:46,w:13},{l:42,w:11,o:11},{l:38,w:10,o:22}],{rel:1.25,dmg:.62,rc:1.6,heat:1.2}),
rail:D('Railgun','#5ff0ff',25,'Slow, enormous-range slug.',[{l:76,w:10}],{rel:2.8,dmg:3,siz:.55,spd:2.3,life:2,rc:2.6},['hyper'],40),
hyper:D('Hyper Rail','#7affff',24,'Extreme velocity rail.',[{l:82,w:9}],{rel:3.2,dmg:3.6,siz:.5,spd:2.8,life:2.2,rc:2.9}),
assassin:D('Assassin','#2fbfae',24,'Fast sniper rifle.',[{l:68,w:11}],{rel:1.2,dmg:1.2,siz:.6,spd:1.8,life:1.8,rc:1.2},['stalker'],40),
stalker:D('Stalker','#1a9a8a',24,'Predator. Fast deadly shots.',[{l:70,w:10}],{rel:1.0,dmg:1.35,siz:.55,spd:1.9,life:1.9,rc:1.1}),
destroyer:D('Destroyer','#e05a2b',31,'Heavy shell.',[{l:55,w:34}],{rel:2.9,dmg:3,siz:1.9,rc:3},['annihilator'],40),
annihilator:D('Annihilator','#c0392b',33,'Devastating shell.',[{l:62,w:40}],{rel:3.4,dmg:4.0,siz:2.2,rc:3.5}),
howitzer:D('Howitzer','#ff6b1a',32,'Colossal shell, brutal kick.',[{l:60,w:40}],{rel:3.6,dmg:4.2,siz:2.3,rc:3.6}),
triflank:D('Tri-Flank','#d35400',28,'Front + two rear guns.',[{l:44,w:15},{a:2.4,l:36,w:13},{a:-2.4,l:36,w:13}],{rc:1.3},['hexflank'],40),
quadflank:D('Quad-Flank','#c0521a',28,'Guns in all four directions.',[{l:44,w:15},{a:Math.PI,l:40,w:14},{a:1.5708,l:36,w:13},{a:-1.5708,l:36,w:13}],{rc:1.2},['hexflank'],40),
hexflank:D('Hexa-Flank','#a04010',29,'Six directions of fire.',[{l:40,w:13},{a:1.047,l:36,w:12},{a:2.094,l:36,w:12},{a:Math.PI,l:38,w:13},{a:-2.094,l:36,w:12},{a:-1.047,l:36,w:12}],{rc:1.3}),
scatter:D('Scatter','#ffcf5c',28,'Huge pellet cloud.',[{l:46,w:30}],{rel:2,dmg:.5,siz:.6,life:.5,pel:11,spr:.8,rc:2.2}),
minigun:D('Minigun','#3fe08a',28,'Insane fire rate.',[{l:40,w:28}],{rel:.28,dmg:.4,siz:.55,spr:.45,rc:.8,heat:2.2}),
lockon:D('Lock-On','#d48cff',27,'Soft aim-assist missiles.',[{l:54,w:26}],{missile:1,lock:1,rel:3.6,rc:1.8}),
swarm:D('Swarm','#a66bff',28,'Fan of smaller missiles.',[{l:48,w:28}],{missile:1,swarm:1,rel:4.0,rc:1.9}),
spinner:D('Spinner','#c77dff',27,'Missile + spinning gun. No boom.',[{l:50,w:22}],{missile:1,spin:1,rel:3.3,rc:1.6},['auto'],40),
auto:D('Auto Missile','#e0a0ff',28,'Missile + mini-gun lock. No boom.',[{l:52,w:24}],{missile:1,auto:1,rel:3.5,rc:1.7})
};
const STARTERS=['basic','twin','sniper','pounder','flank','shotgun','missile'];
const S=[['regen','Regen'],['hp','Max HP'],['body','Body Dmg'],['bspd','Bullet Spd'],['bdmg','Bullet Dmg'],['rel','Reload'],['mov','Speed']];
const PS={aggr:{pd:140,ap:1.3,rt:0,rg:660,st:.5},snip:{pd:500,ap:.4,rt:-1.1,rg:880,st:.7},flnk:{pd:240,ap:1.05,rt:-.45,rg:600,st:1.3},tank:{pd:85,ap:1.4,rt:.35,rg:520,st:.3}};
const NAMES=['Vortex','Blitz','Nova','Rusty','Havoc','Mochi','Zeta','Gunner','Pixel','Tango','Ghost','Bolt','Comet','Sarge','Echo','Rook'];
const COLS=['#f14e54','#e67e22','#9b59b6','#3498db','#1abc9c','#d14e9c','#c0392b','#2980b9'];
const SHT=[
['sq',4,24,30,10,'#ffe763',5],['tr',3,22,65,22,'#fc7677',8],['pe',5,32,220,120,'#768cfc',14],
['hx',6,40,480,300,'#c77dff',22],['oc',8,46,900,550,'#ff9f43',30],['st',5,28,160,90,'#f368e0',12],['al',3,48,700,400,'#ee5a24',28]
];
const PU={heal:['#58e06a','+'],rapid:['#ffd34d','»'],shield:['#4db8ff','◈']};

/* Bosses — multi-cannon + defensive drones */
const BOSSES=[
  {name:'Ironclad', col:'#ff3b5c', shape:'hex', r:52, drones:6, guns:[
    {l:50,w:16},{l:40,w:13,a:.85},{l:40,w:13,a:-.85},{l:38,w:12,a:2.3},{l:38,w:12,a:-2.3},{l:36,w:12,a:Math.PI}
  ], m:{rel:1.15,dmg:1.25,rc:1.6}},
  {name:'Warden', col:'#ff6b6b', shape:'pent', r:50, drones:7, guns:[
    {l:55,w:15},{l:42,w:12,a:1.1},{l:42,w:12,a:-1.1},{l:40,w:12,a:2.4},{l:40,w:12,a:-2.4}
  ], m:{rel:1.3,dmg:1.35,rc:1.7}},
  {name:'Behemoth', col:'#c0392b', shape:'oct', r:58, drones:8, guns:[
    {l:48,w:20},{l:42,w:14,a:.7},{l:42,w:14,a:-.7},{l:40,w:13,a:1.6},{l:40,w:13,a:-1.6},{l:38,w:13,a:Math.PI}
  ], m:{rel:1.5,dmg:1.6,siz:1.15,rc:2.0}},
  {name:'Overseer', col:'#e74c3c', shape:'star', r:48, drones:9, guns:[
    {l:46,w:13,o:-14},{l:50,w:15},{l:46,w:13,o:14},{l:36,w:12,a:Math.PI},{l:34,w:11,a:1.8},{l:34,w:11,a:-1.8}
  ], m:{rel:1.1,dmg:1.2,rc:1.4}},
  {name:'Colossus', col:'#ff4757', shape:'hex', r:62, drones:8, guns:[
    {l:55,w:22},{l:44,w:14,a:.8},{l:44,w:14,a:-.8},{l:40,w:13,a:1.9},{l:40,w:13,a:-1.9},{l:38,w:13,a:Math.PI}
  ], m:{rel:1.4,dmg:1.55,siz:1.15,rc:2.0}},
  {name:'Dreadnought', col:'#b33939', shape:'oct', r:56, drones:7, guns:[
    {l:60,w:12},{l:48,w:16,a:Math.PI},{l:40,w:12,a:1.2},{l:40,w:12,a:-1.2},{l:36,w:11,a:2.3},{l:36,w:11,a:-2.3}
  ], m:{rel:1.7,dmg:1.8,spd:1.3,life:1.5,rc:2.2}},
  {name:'Apex', col:'#ff6348', shape:'star', r:54, drones:10, guns:[
    {l:44,w:12,o:-20},{l:48,w:14,o:-7},{l:48,w:14,o:7},{l:44,w:12,o:20},{l:36,w:11,a:Math.PI}
  ], m:{rel:1.0,dmg:1.2,rc:1.5,heat:1.0}}
];

/* ---------- state ---------- */
let state='menu',P=null,cur=null,shake=0,DBG=false,auto=false,bossT=35,streak=0,streakT=0,lbT=0;
const cam={x:WW/2,y:WW/2,z:1,kx:0,ky:0},keys={},ms={x:0,y:0,d:0};
let bl=[],msl=[],sh=[],bt=[],pt=[],rg=[],ft=[],pu=[],nests=[],drones=[];

/* ---------- tank math ---------- */
const sz=t=>1+Math.min(1.7,Math.pow(Math.max(0,t.sc)/120000,.45));
const rad=t=>(t.bossR||T[t.k]?.r||30)*sz(t);
const M=t=>t.bossM||T[t.k]?.m||{};
const mx=t=>(100+t.st.hp*22)*(.85+sz(t)*.15)*(t.boss?4:1);
const dmgOf=t=>(8+t.st.bdmg*4.6)*(M(t).dmg||1)*(.9+sz(t)*.1);
const relOf=t=>Math.max(80,520*Math.pow(.89,t.st.rel)*(M(t).rel||1)*(t.bf.rapid>0?.62:1));
const bspd=t=>(380+t.st.bspd*28)*(M(t).spd||1);
const movOf=t=>(155+t.st.mov*11)/Math.pow(sz(t),.15);
const bodyOf=t=>(9+t.st.body*4.5)*(.9+sz(t)*.12);
const need=l=>Math.round(14*Math.pow(l,1.7));
function mk(x,y,k,pl){const st={};S.forEach(s=>st[s[0]]=0);return{x,y,vx:0,vy:0,ang:rr(0,TAU),k,pl,col:pl?T[k].c:pick(COLS),st,hp:100,hpv:100,lv:1,xp:0,sc:0,pts:0,cd:0,rc:0,fl:0,bi:0,bf:{rapid:0,shield:0},dash:0,name:pl?'You':pick(NAMES),ps:pick(Object.keys(PS)),dead:0,ai:0,aim:rr(0,TAU),sd:R()<.5?1:-1,heat:0,spawn:0}}

/* ---------- fx ---------- */
function spark(x,y,n,cols,s0,s1,z0,z1,l0,l1){for(let i=0;i<n;i++){const a=rr(0,TAU),s=rr(s0,s1),l=rr(l0,l1);pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l,m:l,c:pick(cols),s:rr(z0,z1)})}if(pt.length>1000)pt.splice(0,pt.length-1000)}
const ring=(x,y,mr,c,l)=>rg.push({x,y,r:0,mr,l:l||.4,m:l||.4,c});
const flt=(x,y,t,c,s)=>{if(ft.length<80)ft.push({x,y,t,c,s:s||13,l:.9})};
function ban(t,c){const b=$('ban');b.textContent=t;b.style.color=c||'#fff';b.classList.remove('s');void b.offsetWidth;b.classList.add('s')}

/* ---------- combat ---------- */
function fire(t){
  if(t.heat>=1){t.cd=220;return}
  const guns=t.bossGuns||T[t.k].b, m=M(t), s=sz(t), n=guns.length;
  const bs=m.alt?[guns[t.bi++%n]]:guns, r=rad(t);
  if(m.missile){
    for(const b of bs){
      const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.55*s),ty=t.y+Math.sin(a)*(r+b.l*.55*s);
      if(m.swarm){for(let i=-1;i<=1;i++)msl.push({x:tx,y:ty,ang:a+i*.22,spd:bspd(t)*.68,l:2.0,o:t,r:8*s,lock:0,spin:0,auto:0,swarm:1,c:t.col,emit:0,flame:0,spinA:0,gCd:0})}
      else msl.push({x:tx,y:ty,ang:a,spd:bspd(t)*.76,l:2.5,o:t,r:12*s,lock:!!m.lock,spin:!!m.spin,auto:!!m.auto,swarm:0,c:t.col,emit:0,flame:0,spinA:0,gCd:0});
      spark(tx,ty,3,['#fff2ae','#ffd34d'],50,180,1.1,2.5,.07,.18);
    }
  } else {
    for(const b of bs){
      const a=t.ang+(b.a||0),tx=t.x+Math.cos(a)*(r+b.l*.6*s)-Math.sin(t.ang)*(b.o||0)*s,ty=t.y+Math.sin(a)*(r+b.l*.6*s)+Math.cos(t.ang)*(b.o||0)*s;
      for(let i=0;i<1+(m.pel||0);i++){
        const aa=a+(m.spr?(R()-.5)*m.spr:0),sp=bspd(t)*(m.pel?rr(.75,1.25):1);
        bl.push({x:tx,y:ty,px:tx,py:ty,vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp,r:(7+t.st.bdmg*.4)*(m.siz||1)*s*(m.pel?.9:1),dm:dmgOf(t),o:t,l:1.4*(m.life||1),c:t.pl?'#00e0ff':t.col});
      }
      spark(tx,ty,2,['#fff2ae','#ffd34d'],40,150,1,2.2,.06,.15);
    }
  }
  const heatGain=(m.heat||0)*0.045*(m.pel?1.3:1);
  if(heatGain>0)t.heat=Math.min(1.15,t.heat+heatGain);
  const k=(m.rc||1)*140*(.5+Math.min(2.4,m.dmg||1)*.25)*(m.pel?1.4:1)*(bs.length>1?1.15:1);
  t.vx-=Math.cos(t.ang)*k;t.vy-=Math.sin(t.ang)*k;t.rc=Math.min(18,t.rc+k*.1);
  if(t.pl){shake=Math.min(14,shake+k*.03);cam.kx-=Math.cos(t.ang)*k*.06;cam.ky-=Math.sin(t.ang)*k*.06}
  t.cd=relOf(t)/(m.alt?n:1);
}
function explodeMs(ms){
  if(ms.spin||ms.auto){spark(ms.x,ms.y,7,[ms.c,'#fff'],35,130,1.3,3,.16,.4);return}
  const o=ms.o,n=ms.swarm?7:11,sp=ms.swarm?250:300,sm=sz(o);
  for(let i=0;i<n;i++){const a=i/n*TAU+rr(0,.1);bl.push({x:ms.x,y:ms.y,px:ms.x,py:ms.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:(ms.swarm?4.2:5.2)*sm,dm:dmgOf(o)*(ms.swarm?.48:.58),o,l:.9,c:ms.c})}
  ring(ms.x,ms.y,(ms.swarm?48:80)*sm,ms.c,.32);spark(ms.x,ms.y,ms.swarm?9:14,[ms.c,'#ffd34d','#fff'],70,220,1.6,4.5,.25,.7);
}
function hurt(t,dm,from){if(t.dead)return;if(t.bf.shield>0)dm*=.35;t.hp-=dm;t.fl=.12;
 if(dm>=2)flt(t.x+rr(-12,12),t.y-rad(t),Math.round(dm),t.pl?'#ff6b6b':'#fff',t.pl?12:10);
 if(t.hp<=0)kill(t,from)}
function kill(t,from){t.dead=1;ring(t.x,t.y,rad(t)*3,t.col,.5);spark(t.x,t.y,24,[t.col,'#fff','#666'],55,250,1.8,5.5,.3,.85);shake=Math.min(16,shake+(t.boss?12:4));
 // remove boss drones
 for(let i=drones.length-1;i>=0;i--)if(drones[i].owner===t)drones.splice(i,1);
 if(t.pl){state='dead';ov('YOU WERE DESTROYED','Level '+t.lv+' · '+(t.boss?t.name:T[t.k].n)+' · Score '+fs(t.sc),[{n:'Respawn',d:'Press Enter or click'}],menu);return}
 if(from&&!from.dead){
   const steal=Math.floor(t.sc*0.5), base=160+t.lv*12+Math.floor(t.sc*0.02);
   addXp(from,base+steal);
   if(from.pl&&steal>0)flt(t.x,t.y-18,'+'+fs(steal)+' STOLEN','#ffd34d',13);
   if(from.pl){streak++;streakT=4;if(streak>=2)ban(['','','DOUBLE KILL','TRIPLE KILL','MEGA KILL','RAMPAGE!'][Math.min(streak,5)],'#ffd34d')}
 }
 if(from&&from.pl&&t.boss){addXp(P,6000);ban('GUARDIAN DESTROYED  +6000','#ffd34d')}
 drop(t.x,t.y,t.boss?4:(R()<.4?1:0));setTimeout(spawnBot,1300)}
function hurtShape(s,dm,from){if(s.dead)return;s.hp-=dm;s.fl=.1;if(s.hp<=0){s.dead=1;spark(s.x,s.y,s.sides>=6?12:7,[s.col,'#fff'],35,150,1.3,3.8,.18,.45);ring(s.x,s.y,s.r*1.5,s.col,.28);if(from&&!from.dead)addXp(from,s.xp);if(s.sides>=6||R()<.06)drop(s.x,s.y,1);if(s.nestId==null)setTimeout(spawnShape,2600)}}
function damageNest(n,dm){n.hp-=dm;n.fl=.12;if(n.hp<=0){const idx=nests.indexOf(n);ring(n.x,n.y,160,'#ff4d6d',.65);spark(n.x,n.y,40,['#ff4d6d','#7a1525','#fff'],70,300,2.2,7,.4,1.1);shake=Math.min(16,shake+12);

/* ---------- boss drones ---------- */
function spawnBossDrone(owner,slot){
  const ang=rr(0,TAU);
  drones.push({x:owner.x+Math.cos(ang)*80,y:owner.y+Math.sin(ang)*80,vx:0,vy:0,ang,r:11,hp:45,mh:45,owner,col:owner.col,slot,phase:rr(0,TAU),hitCd:0,fl:0})}
function updateDrones(dt){
  for(let i=drones.length-1;i>=0;i--){
    const d=drones[i];if(!d.owner||d.owner.dead){drones.splice(i,1);continue}
    d.hitCd-=dt;d.fl=Math.max(0,d.fl-dt);d.phase+=dt*1.4;
    // orbit owner + attack nearest threat
    let cx=d.owner.x,cy=d.owner.y,attack=null,ad=420;
    if(P&&!P.dead){const dd=hyp(P.x-d.owner.x,P.y-d.owner.y);if(dd<ad){ad=dd;attack=P}}
    for(const o of bt){if(o===d.owner||o.dead)continue;const dd=hyp(o.x-d.owner.x,o.y-d.owner.y);if(dd<ad){ad=dd;attack=o}}
    if(attack){cx=attack.x;cy=attack.y}
    else{const a=d.phase+d.slot*0.9;cx=d.owner.x+Math.cos(a)*85;cy=d.owner.y+Math.sin(a)*85}
    const total=Math.max(1,drones.filter(x=>x.owner===d.owner).length);
    const sa=(d.slot/total)*TAU+d.phase*0.1,fr=attack?20:30;
    const tx=cx+Math.cos(sa)*fr,ty=cy+Math.sin(sa)*fr;
    const dx=tx-d.x,dy=ty-d.y,dist=hyp(dx,dy)||1;
    d.vx+=((dx/dist)*Math.min(210,dist*3)-d.vx)*5*dt;d.vy+=((dy/dist)*Math.min(210,dist*3)-d.vy)*5*dt;
    d.vx*=Math.pow(.2,dt);d.vy*=Math.pow(.2,dt);d.x+=d.vx*dt;d.y+=d.vy*dt;d.ang=Math.atan2(d.vy,d.vx);
    // damage
    const targets=d.owner.pl?bt:(P?[P]:[]);
    for(const t of targets){if(t&&!t.dead&&hyp(d.x-t.x,d.y-t.y)<d.r+rad(t)){if(d.hitCd<=0){hurt(t,8,d.owner);d.hitCd=.28;d.fl=.1}}}
    if(!d.owner.pl)for(const o of bt){if(o===d.owner||o.dead)continue;if(hyp(d.x-o.x,d.y-o.y)<d.r+rad(o)){if(d.hitCd<=0){hurt(o,7,d.owner);d.hitCd=.3}}}
    for(let j=sh.length-1;j>=0;j--){const s=sh[j];if(hyp(d.x-s.x,d.y-s.y)<d.r+s.r){if(d.hitCd<=0){hurtShape(s,9,d.owner);d.hitCd=.25}}}
  }
}
